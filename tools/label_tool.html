ures.Responsible for all monies collected from customers as well as petty cash and will call funds.Inspects physical condition of warehouse and equipment, including delivery vehicles.Ensures repairs are made and submits requisitions for replacement of equipment if needed.Confers with department heads to ensure coordination of warehouse activities with activities of other functions such as"}, {"resume_id": "20237244", "category": "INFORMATION-TECHNOLOGY", "job_id": "3901638429", "job_title": "Human Systems Integration Engineer II", "job_text": "Human Systems Integration Engineer II. REPORTS TO: Integrated Logistics Support (ILS) Manager\n\nSUPERVISES:  N/A\n\nAuthorities / Responsibilities\n\nThe selected candidate will work as part of a dynamic cross-functional team to support the design and development of various U.S. Navy and Coast Guard ships and ensure human factors engineering (HFE) and human systems integration (HSI) requirements are met.\n\nSpecific Responsibilities Include\n\nProvide engineering/technical support for concept studies; feasibility studies; preliminary design activities; contract design activities; detail design and construction activities; independent design reviews; In-service ship design and engineering activities; shipboard installation support; and special studies related to ships/boats/craft, ship systems and/or shipboard equipment.Provide naval architecture, marine engineering, electrical engineering and in-depth engineering support for the Hull, Mechanical & Electrical (HM&E); Command, Control, Communications, Computers & Intelligence (C4I); and mission equipment and systems installed aboard ships, boats, craft and targets, including naval warships, Coast Guard Cutters, Combat Logistics Force (CLF), and Special Mission Ships.\n\nQualifications / Knowledge / Experience\n\nBachelor\u2019s degree or higher in a Human Engineering field (e.g., Human Systems Engineering, Industrial Engineering, Engineering Psychology)3+ years of relevant engineer experience in the human engineering fieldExcellent written and oral communication skills requiredDemonstrated knowledge of scheduling, possess an ability to monitor progress to schedule and adhere to strict deadlines requiredKnowledge in Human System Integration (HSI)Experience in program documentation of the HFE processes and products in a format consistent with US Military Data Item Descriptions (e.g. Human Engineering Program Plan, Human Engineering Design Approach Document \u2013 Operator, Human Engineering Design Approach Document \u2013 Maintainer, Human Engineering Test Plan, Human Engineering Test "}, {"resume_id": "20237244", "category": "INFORMATION-TECHNOLOGY", "job_id": "3898176137", "job_title": "Quality Assurance Technician", "job_text": "Quality Assurance Technician. PCI Level I/II Certification and ACI Field Grade Technician Certification required."}, {"resume_id": "16899268", "category": "INFORMATION-TECHNOLOGY", "job_id": "3904972441", "job_title": "Sr Principal Cyber Systems Administrator \u2013 Compliance/Patching System Administrator (24-064)", "job_text": "Sr Principal Cyber Systems Administrator \u2013 Compliance/Patching System Administrator (24-064). At Northrop Grumman, our employees have incredible opportunities to work on revolutionary systems that impact people's lives around the world today, and for generations to come. Our pioneering and inventive spirit has enabled us to be at the forefront of many technological advancements in our nation's history - from the first flight across the Atlantic Ocean, to stealth bombers, to landing on the moon. We look for people who have bold new ideas, courage and a pioneering spirit to join forces to invent the future, and have fun along the way. Our culture thrives on intellectual curiosity, cognitive diversity and bringing your whole self to work \u2014 and we have an insatiable drive to do what others think is impossible. Our employees are not only part of history, they're making history.Northrop Grumman Space Systems\u2014Launch and Missile Defense Systems has an exciting career opportunity for a Sr Principal Cyber Systems Administrator \u2013 Compliance/Patching System Administrator (24-064) to join our team of qualified, diverse individuals. This position will be at Schriever Space Force Base, Colorado Springs, and/or the Colorado Springs, CO area.Position Overview:Act as the primary group for testing and applying patches on all main software/application systems, including workstations and servers. Support the system by interacting continuously with the cyber and compliance team to remediate any vulnerabilities found during automated or manual cyber scans. Patching can be an impacting activity; a detail-oriented individual is necessary for this position.Essential Functions:Monitor systems asset compliance via Tenable Security Center to coordinate a testing strategy for patching found vulnerabilities.Administer patching solutions, such as Tanium, WSUS, and YUM.Identify and work with component owners to build subset groups for patching testing prior to wide deployment of enterprise patching.Coordinate with system owners to patch specific products/solutions, such as server applicatio"}, {"resume_id": "28005884", "category": "ENGINEERING", "job_id": "3905311069", "job_title": "RN - Labor And Delivery (L&D) - Travel", "job_text": "RN - Labor And Delivery (L&D) - Travel. Gross Pay (weekly): $2026.0\n\nTaxable Pay (weekly): 864.0\n\nNon-taxable Pay (weekly): 1162.0\n\nRN - Labor And Delivery (L&D) - Travel\n\nShift: Day/Night Rotate\n\nLocation: Bismarck, ND\n\nScheduled Hours : 36"}, {"resume_id": "28198029", "category": "SALES", "job_id": "3901935425", "job_title": "Associate Sales Representative / Clinical Support", "job_text": "Associate Sales Representative / Clinical Support. Company Overview:Restech supplies innovative, minimally invasive tools and therapies that help to accurately diagnose, manage, and treat reflux disorders. \nPosition Overview:This position will support current customers with the proper use of our products, and expand customer base by cultivating new leads. \nKey Responsibilities:Physician Education:Educating physicians and staff in the operating room/endoscopy suite on the Stretta minimally invasive antireflux procedure.Conduct training sessions and workshops for physicians on the Stretta procedure, ensuring proper technique and adherence to best practices.Provide ongoing support and guidance to physicians in the field, addressing any questions or concerns related to the procedure or device usage.Stay up-to-date on clinical research, industry trends, and competitor products to effectively communicate the benefits of our technology. \nOperating Room/Endoscopy Suite Staff Training:Work with OR/Endo Staff to ensure proper protocol is followed during Stretta procedures.Inservice/Educate staff on equipment set-up, intraprocedural techniques, and procedural protocols to maintain a safe and efficient environment.\nClinic Support:Supporting clinic personnel on the proper use and application of the Restech Dx-pH Measurement System. Assist clinic staff with the set-up of Restech Dx-pH Study procedures, including patient preparation, equipment setup, and data interpretation.Provide troubleshooting assistance and technical support to clinics.Foster strong relationships with clinic administrators and staff to promote customer satisfaction and loyalty.\nCustomer Engagement and Relationship Building:Build strong relationships with key opinion leaders, healthcare providers, and professional organizations. Attend medical conferences, seminars, and trade shows to represent the company and engage with potential customers and partners.\nClinical Documentation and Reporting:Maintain accurate records of training activities and support interact"}, {"resume_id": "47470864", "category": "HR", "job_id": "3889437728", "job_title": "Finance Specialist - 1771249", "job_text": "Finance Specialist - 1771249. Boutique law firm seeks full-time Finance Specialist to work in finance department. Finance Specialist will work closely with head of billing and attorneys. The role involves overseeing the control, monitoring, and collection of accounts receivables, and requires close collaboration with attorneys and clients. This is an in-office position.\n\nResponsibilities include:\n\nWork with attorneys and staff to create, distribute, edit, post, and submit bills using a variety of delivery methods.Reviewing monthly attorney time entries.Prepare reports on billing and collections data.Ensure effective monitoring and management of outstanding accounts receivable, unapplied funds, and collection efforts.Assist partners and clients with any inquiries or concerns regarding unpaid or underpaid invoices.Process payments for retainers, invoices, etc., and accurately apply fees and costs in TABS.Work with billing team to resolve any inquiries or issues regarding the billing and collections process.Review credit card expenses and assign them to the correct general ledger accounts.Performing accounts payable duties.\n\n\nQualifications:\n\nBachelor's degree in either accounting or finance. Superior organizational, communication and time management skills. Skilled in Microsoft Office, with a particular focus on Outlook and ExcelExperience with TABS3 is a plus.\n\n\n"}, {"resume_id": "12858898", "category": "FINANCE", "job_id": "3905307541", "job_title": "Inside Sales Representative Raleigh", "job_text": "Inside Sales Representative Raleigh. We\u2019re JTI, Japan Tobacco International and we believe in freedom. We think that the possibilities are limitless when you\u2019re free to choose. In fact, we\u2019ve spent the last 20 years innovating, creating new and better products for our consumers to choose from. It\u2019s how we\u2019ve grown to be present in 130 countries.\n\nBut our business isn\u2019t just business. Our business is our people. Their talent. Their potential. We believe when they\u2019re free to be themselves, grow, travel and develop, amazing things can happen for our business.\n\nThat\u2019s why our employees, from around the world, choose to be a part of JTI. It is why 83% of employees feel happy working at JTI. And why we\u2019ve been awarded Global Top Employer status, nine years running.\n\nSo when you\u2019re ready to choose a career you\u2019ll love, in a company you\u2019ll love, feel free to #JoinTheIdea.\n\nLearn more jti.com\n\nWhat This Position Is About\n\nThe purpose of this position is to develop and ensure implementation of the JT International USA sales strategies and programs within the incumbent's assignment to achieve the Company's financial, sales, and volume quarterly/annual targets.The primary role of the Interal Sales Associate is to support the sales organization by direct retail selling. The incubent will be responsible for contacting retail stores in order to secure distribution, verify program compliance and build partnership. The duties include handling inbound and outbound calls to and from retailers, listening to customers needs or issues and providing helpful solutions to their problems.\n\nWhat Will You Do Responsibilities\n\nContact retailers for the purposes of gaining distribution and product availability in accordance with the objectives set for the target segementation by the Sales Manager.Work with retailers to merchandise, display, and communicate our products' messages to the ultimate consumer through effective communication/negotiation skills with the retail trade to achieve optimum merchandising, display, and price poin"}, {"resume_id": "47410104", "category": "FINANCE", "job_id": "3905286463", "job_title": "Peoplesoft Business Analyst - Level 3", "job_text": "Peoplesoft Business Analyst - Level 3. HTC Global Services wants you. Come build new things with us and advance your career. At HTC Global you'll collaborate with experts. You'll join successful teams contributing to our clients' success. You'll work side by side with our clients and have long-term opportunities to advance your career with the latest emerging technologies.\n\nAt HTC Global Services our consultants have access to a comprehensive benefits package. Benefits can include Paid-Time-Off, Paid Holidays, 401K matching, Life and Accidental Death Insurance, Short & Long Term Disability Insurance, and a variety of other perks.\n\nLevel Description\n\n8 or more years of experience, relies on experience and judgment to plan and accomplish goals, independently performs a variety of complicated tasks, a wide degree of creativity and latitude is expected.\n\nJob Description\n\nUnderstands business objectives and problems, identifies alternative solutions, performs studies and cost/benefit analysis of alternatives. Analyses user requirements, procedures, and problems to automate processing or to improve existing computer system: Confers with personnel of organizational units involved to analyse current operational procedures, identify problems, and learn specific input and output requirements, such as forms of data input, how data is to be; summarized, and formats for reports. Writes detailed description of user needs, program functions, and steps required to develop or modify computer program. Reviews computer system capabilities, specifications, and scheduling limitations to determine if requested program or program change is possible within existing system.\n\nAdditional Job Details And Special Considerations\n\nClient requires the services of a PeopleSoft Financials Business Analyst. This PeopleSoft FSCM 9.2 business analyst role is ideal for a candidate with a strong business analyst background and deep understanding of business processes. Prior experience in a techno-functional role is not required, and a focus o"}, {"resume_id": "16899268", "category": "INFORMATION-TECHNOLOGY", "job_id": "3901161851", "job_title": "Nurse Clinician/Ambulatory", "job_text": "Nurse Clinician/Ambulatory. Posting Details\n\nJob Title Nurse Clinician/Ambulatory\n\nRequisition Number RE44485\n\nWorking Title Nurse Clinician\n\nDepartment Name 7A810: Division of OMFS\n\nWork Location Lexington, KY\n\nGrade Level 45\n\nSalary Range $22.50-37.13/hour\n\nType of Position Staff\n\nPosition Time Status  Full-Time\n\nRequired Education\n\nADN\n\nClick here for more information about equivalencies: https://hr.uky.edu/employment/working-uk/equivalencies\n\nRequired Related Experience\n\n3 yrs\n\nRequired License/Registration/Certification\n\nRegistered Nurse (RN).\n\nPhysical Requirements\n\nStanding for long periods of time.\n\nShift\n\nMonday \u2013 Friday; 8:00 am \u2013 5:00 pm.\n\nJob Summary\n\nThe person in this position will serve as a Nurse for the College of Dentistry, primarily at UK Dentistry Turfland\u2019s Oral and Maxillofacial Surgery Clinic.\n\nThis position will be responsible for providing care to patients during consultation, pre op, surgery and post op. Will provide wound care to post op patients. Coordinate patient care among multi clinics. The Nurse Clinician will monitor and record baseline, intra-op and post-op vital signs, as well as report any abnormal readings or other pertinent health history to provider. Other duties include: administer medications under the verbal order of provider, act as point of contact for patients and/or other healthcare entities, and complete post-op evaluation of patient prior to transporting patient following sedation procedures. Prepare patient for procedure sedation including nasal cannula, blood pressure, ECG leads, pulse oximeter, placement of intravenous catheter and local cases include pre-op blood pressure. They will also complete timeout process, ensuring correct patient, procedure, consent and supplies are obtained prior to giving medications, as well as review post-op instructions with patient and escort. This position will serve as a back up nurse when necessary.\n\nThe successful candidate must be able to thrive in a fast paced high volume.\n\nSkills / Knowledge / Abilities\n"}, {"resume_id": "38314236", "category": "ENGINEERING", "job_id": "3902921380", "job_title": "Software Engineer", "job_text": "Software Engineer. Company Overview\n\nDocusign brings agreements to life. Over 1.5 million customers and more than a billion people in over 180 countries use Docusign solutions to accelerate the process of doing business and simplify people\u2019s lives. With intelligent agreement management, Docusign unleashes business-critical data that is trapped inside of documents. Until now, these were disconnected from business systems of record, costing businesses time, money, and opportunity. Using Docusign\u2019s Intelligent Agreement Management platform, companies can create, commit, and manage agreements with solutions created by the #1 company in e-signature and contract lifecycle management (CLM).\n\nWhat you'll do\n\nThe DocuSign Sign engineering team is looking for a highly motivated Software Engineer to join our Reporting team in Chicago. The Reporting team leverages big data technologies, such as Spark and Presto to create customer-facing reports. The team is currently in the process of migrating reporting from on-prem to an Azure cloud environment. As part of this migration, we are also designing the next-generation data platform that will support reporting for both electronic signature and Contract Lifecycle Management (CLM).\n\nAs an engineer on the reporting team, we expect you to have a good understanding of everything data, as well as back-end code development.\n\nThis position will demand critical thinking skills, ability to quickly understand existing systems and the ability to work in agile, fast paced environments. The ability to take smart and educated risks is essential to the success of this position.\n\nThis position is an individual contributor role reporting to the Sr. Manager, Engineering.\n\nResponsibility\n\nBe open minded, forward thinking, and passionate about great softwareThink about how to solve problems in scale and build fault tolerant systemsDevelop testable, high-quality, and ship-ready code with ample test coverageWork as part of a cross-site development team to drive implementat"}, {"resume_id": "17812897", "category": "HR", "job_id": "3901167349", "job_title": "Human Resources Business Partner", "job_text": "Human Resources Business Partner. Human Resource Dimensions has been engaged to place an HR Business Partner for a client in Atlanta (Buckhead), Georgia. This will be an onsite role.\nThis HR Business Partner position formulates partnerships across the HR function to deliver value-added service to management and employees that reflect the business objectives of the organization. \nThis individual is responsible for supporting our client's markets and corporate functions in onboarding/offboarding, employee relations, backup for benefits administration, and training and development across all company operations.\nIn addition to resolving customer (management and employee) problems/ issues, this individual must have the ability to recognize \u201cbig picture\u201d opportunities for process improvement, identify the proper course of action, and partner with the field and corporate to manage the change from start to finish.\nThe HRBP must have strong attention to detail, organization, and project coordination skills and can multi-task priorities and assignments. Must be able to work independently, and have strong communication and relationship-building skills. Must have HRIS experience as well as advanced level computer skills in MS Office Suite. Must have the ability to handle confidential and sensitive information. Must be competent and confident in interactions with all levels of employees, customers and vendors.\n RESPONSIBILITIES:Employee RelationsAdvise managers on HR regulations, practices, and Company policies and procedures.Manages and resolves complex employee relations issues (including complaints from Compliance Hotline). Conducts effective, thorough, and objective investigations.Support, counsel, and strategize with managers on employee and/or performance issues to help ensure actions are appropriate.Consult with HR leadership and operations management regarding employee discipline, performance concerns, and terminations to ensure fair and consistent application of client practices.Document all employee re"}, {"resume_id": "24083609", "category": "INFORMATION-TECHNOLOGY", "job_id": "3889706607", "job_title": "Senior ASIC Design Engineer -Risc-V / UVM", "job_text": "Senior ASIC Design Engineer -Risc-V / UVM. Senior ASIC Design Engineer- RTL Design / UVM\nWe are partnered up with a well-established Semiconductor organisation who enable state of the art perception for autonomous vehicles who are looking for Senior ASIC Verification Engineer to join their team in California.\nIf this is you please continue reading below!\nResponsibilities:\nEnsure the pre-silicon correctness and quality of a multi-million gate ASIC that integrates computational accelerators and 3rd-party SoC IP blocks.SoC/Subsystem verification of embedded CPUs such as ARM/RISC-V and interconnect subsystem (including C and assembly diag validation)Architect and implement complex RTL designs.Work closely with design and architecture teams to understand the functional and performance goals of the design; and work together to make the design-under-test work under all specified circumstances.\nQualifications:\n5+ years of ASIC design experience, RTL logic DesignKnowledge of ARM/MIPS/RISC-V Architectures, Memory hierarchy, Cache coherency, Virtual memory, Multicore CPU operationFamiliarity with AMBA/APB/AXI ProtocolFamiliarity with processor peripheral interfaces like SPI, eMMC, *MII, GPIO, I2C ....Excellent Verilog/System Verilog programming skills.Experience with UVM (or similar).\nKeywords: UVM / ASIC /System Verilog / Verilog / Python / Perl/ RTL Design\nIf interested Apply via LinkedIn, or send your CV to fm@eu-recruit.com\nBy applying to this role you understand that we may collect your personal data and store and process it on our systems. For more information please see our Privacy Notice (https://eu-recruit.com/about-us/privacy-notice/)"}, {"resume_id": "31677347", "category": "ENGINEERING", "job_id": "3889198723", "job_title": "AM Senior Manufacturing Engineer", "job_text": "AM Senior Manufacturing Engineer. Divergent is on a mission to democratize the design and manufacture of vehicles. We want to enable a future where small entrepreneurial teams across the globe will bring increasingly material and energy efficient transportation solutions to market with a fraction of the capital and time.\n\nDivergent has invented a complete manufacturing solution to address system level challenges. The Divergent Adaptive Production System (DAPS) is a complete software hardware solution designed to replace traditional vehicle manufacturing. To make the complex simple, it is a complete modular digital factory for complex structures. Given a set of digital requirements as input, the machine automatically computationally engineers, additively manufactures, and assembles any complex structure. The system is able to move seamlessly between manufacturing different vehicle models.\n\nPurpose of Job:\u202f\n\nLeads manufacturing engineering activities of laser powder bed fusion machine development, manufacturing, and operations to meet cost, throughput, and quality targets in partnership with the Additive Technologies machine development team.\n\nEssential Job Functions and Performance Standards:\u202f\n\nDevelop, maintain, and continuously improve clear and comprehensive work instructions for internal and external assembly and manufacturing processes.\n\nCollaborate with cross-functional teams to ensure work instructions align with production goals and quality standards\n\nWork closely with design teams to provide input on manufacturability during the product development phases.\n\nIdentify and implement design improvements to improve efficiency of manufacturing processes.\n\nConduct DFM analyses to optimize production costs and cycle times.\n\nAddress and resolve issues related to machine build processes.\n\nCollaborate with the machine development team to improve machine reliability and performance.\n\nImplement preventative maintenance programs to minimize machine downtime.\n\nLead first-pass RCCA activities to identify ro"}, {"resume_id": "23296286", "category": "SALES", "job_id": "3906253313", "job_title": "Process Technician", "job_text": "Process Technician. Westfall Technik is a global holding company which provides innovative plastics manufacturing solutions to the healthcare, consumer package goods and light industrial vertical markets. The site locations, operating within the?Westfall Technik enterprise, are internationally aligned with unmatched global reach in the industry. Our proprietary Stacked Integration Model \u2122 enables us to operate leveraging a high degree of specialization, extensive capacities in end-to-end design, production and assembly, and first-class references in high-end manufacturing.\n\nONE WESTFALL\n\nCompetitive advantages such as vertical integration, speed-to-market and advanced manufacturing systems allow us to streamline our processes and be a complete solution provider positively impacting our customers\u2019 business. We are powered by experienced people with diversified capabilities and specialties.?We pride ourselves in developing customized solutions with precision and care. So, while there is complexity to what we do; we simplify the process to deliver a customer experience that is enjoyable and easy; providing a single point of accountability.\n\nALL IN.\n\nThis simple phrase captures what Westfall Technik is all about.?The statement embodies the company\u2019s commitment to total support, complete manufacturing capabilities and its bold approach.?It is our internal rallying cry. It is our philosophy.?Nothing half-hearted.\n\nAssociates (and Customers) can be confident that this mantra drives the organization to be nimble, scalable and comprehensive ----no matter how complex the customers\u2019 challenge.\n\nWe look?forward to having an interesting conversation with you.\n\nJob Description\n\nTitle:?Process Technician\n\nPosition: Full Time / Non-Exempt\n\nLocation:?Riverside, CA\n\nManager:\n\nReports to: Production Manager\n\nSummary Of Role\n\nStart-up, shutdown, monitor and troubleshoot production jobs according to set procedures.\n\nDuties And Responsibilities\n\nAssures part quality, cycle yields, and efficiencies are to st"}, {"resume_id": "33685988", "category": "FINANCE", "job_id": "3901998779", "job_title": "Financial Services Representative", "job_text": "Financial Services Representative. Synergy Financial is a rapidly growing financial services company offering remote work-from-home commission-based positions. We are currently seeking serious, ambitious, and hardworking individuals in the United States to join our team.\nOpportunity of a LifetimeThis contract-based position provides an incredible opportunity to change your life. As a state-licensed insurance broker, you will have the chance to help families with various financial services, including 401K rollovers, annuities, life insurance, living benefits, death benefits, student loan debt settlements, and more. By joining our team, you will receive extensive training and become part of one of the highest-paying industries in financial services.Robust Skill Sets\nWe are looking for individuals with a diverse range of skill sets to excel in this position. The ideal candidate possesses the following abilities:\nStrong customer service skillsExcellent sales and negotiation skillsBusiness development expertiseProficiency in data analyticsConsulting experience in financial services\nThese skill sets, combined with your dedication and hard work, will enable you to thrive in this commission-based role.\nLife-changing OpportunityAt Synergy Financial, we believe in the power of financial education and creating generational wealth. Our organization is multi-lingual and multi-cultural, providing an inclusive and supportive environment. By joining our team, you will have the opportunity to make a positive impact on people's lives while enjoying a great income.\nCompensationThis is a contract-based position with an estimated full-time annual On-Time-Estimate of Commissions at $75,000 - $100,000+. The earning potential is substantial, and the more you put into this opportunity, the more you can achieve.\nJoin the MovementIf you are looking to be part of a movement that is changing lives and creating a positive impact, this is your chance. Synergy Financial, and supporting screening team, Meraki Group Endeavors, offers"}, {"resume_id": "22319662", "category": "SALES", "job_id": "3898157722", "job_title": "Human Resources Director", "job_text": "Human Resources Director. Director of Human Resources\nLHH Recruitment Solutions is currently seeking a Director of Human Resources who has a proven track record partnering with executive leadership to develop company strategy and specifically execute across all HR functions.\nResponsibilities:Partner with executive leadership guiding people strategy to develop a people center strategy that aligns with overall business objectives.Provide leadership for all strategic and tactical functions of HR including Diversity Equity and Inclusion, Learning and Development, Total Rewards, Talent Acquisitions, etc.Develop and improve talent management programs such as succession planning, employee engagement, review process, and performance management.Ensure all the HR policies and procedures are legally compliant, up to date, and efficient and effective across the entire organization.Utilize data to measure effectiveness of current initiatives and drive continuous improvement through the optimization of HRIS and ATS tools.Maintain and build strong relationships with internal stake holders as well as all third-party vendors.\n\nQualifications8 plus years of progressive human resource experiencePHR or SHRM certificationMasters Degree in HR or related preferredDemonstrated Project Management or Implementation experience\n\nEmployment Type: Full-time\nSalary: $120,000 - $140,000 based on experience\nHours: Monday through Friday\nTo learn more about this position, please submit your current resume for immediate consideration.\nEqual Opportunity Employer/Veterans/DisabledTo read our Candidate Privacy Information Statement, which explains how we will use your information, please navigate to https://www.lhh.com/us/en/candidate-privacyThe Company will consider qualified applicants with arrest and conviction records"}, {"resume_id": "21866029", "category": "HEALTHCARE", "job_id": "3898169011", "job_title": "Bilingual Recruiter", "job_text": "Bilingual Recruiter. The Recruiter will assist walk-in applicants with completion of job applications and related documents and conduct group orientations prior to placement by recruiting staff. Manage daily customer communications including incoming customer requests, employee call-offs, confirmation of arrivals and other dispatch tasks. Process weekly payroll.\nResponsibilities\nProvides customer service and support to all applicants at the kiosks and front desk.Responsible for 100% accuracy of all applications, I-9 forms, medical questionnaires and W-4 and other forms associated with the application & hiring process.Provides accurate and timely weekly payroll input.Conducts pre-employment screening and reference checks as needed.Screens new candidates, evaluates job skills to ensure the highest fill rates possible and excellent customer satisfaction. Screens for skilled candidates to assist the Skilled Recruiters.Facilitates employee orientation training and client-specific testing.Effectively communicates the skills required and expectations of jobs to which employees are dispatched.Maintains effective business relationships and communications with all Proman Staffing clients.Effectively manages and immediately resolves any problems with client orders, including escalation to branch management or other Proman personnel based on the Service Escalation Chart.Ensures accuracy & completeness of assignment information in Avionte at all times.Manages and continually assesses employee information available in the system to keep it current and accurate at all times.Visits client sites to gain knowledge of specific operations and job assignments to provide accurate expectations to employees about jobs and to enhance recruitment and placement.Counsels, coaches, and takes disciplinary action with service employees when necessary.Participates effectively in and encourages a \u201cteam\u201d working environment.Works with peers and managers to effectively provide staffing coverage and minimize overtime hour"}, {"resume_id": "28198029", "category": "SALES", "job_id": "3902929847", "job_title": "Lead Strategic Sales Planning Manager", "job_text": "Lead Strategic Sales Planning Manager. Job Description:\n\nJoin AT&T and reimagine the communications and technologies that connect the world. Our Consumer Technology experience team is delivering innovative and reliable technology solutions to power differentiated, simplified customer experiences. Bring your bold ideas and fearless risk-taking to redefine connectivity and transform how the world shares stories and experiences that matter. When you step into a career with AT&T, you won\u2019t just imagine the future-you\u2019ll create it.\n\nOur Lead Strategic Sales Planning Managers provides matrix managed sales operations support to Senior Manager Sales Leaders.\n\nKey Roles and Responsibilities: \n\nAnalyzes trends and growth targets, providing detailed feedback to the CFO and Sales Leaders.Drives achievement of the Sales Plan by analyzing the performance of the sales channel and sales team.Develops strategies for improving effectiveness.Provides insight on the Sales Customer Base sales projects and client revenue that will drive the sales team to react faster and to be more proactive.Design and provide reporting to the sales teams to ensure that they have the information needed to make informed decisions and facilitate continual process improvements.Considered subject matter expert within the discipline.Manages highly complex work and provides strategic direction that is critical to the organization.Works without supervision with extensive latitude for independent judgment.May lead less experienced peers.\n\n\nEducation: \n\nBachelor's degree preferred.\n\n\nRequired Skills:\n\nPower BI Development Intermediate to Expert, Microsoft Access Intermediate\n\n\nExperience:\n\nTypically requires 10 to 14 years of experience or equivalent combination of experience and education.\n\n\nSupervisory:\n\nNo.\n\n\nOur Lead Strategic Sales Planning Manager, earn between $105,600 - $158,400. Not to mention all the other amazing rewards that working at AT&T offers. Individual starting salary within this range may depend on geography, experience, expertise,"}, {"resume_id": "31677347", "category": "ENGINEERING", "job_id": "3901618884", "job_title": "SCCM Engineer ", "job_text": "SCCM Engineer . The following requirement is open with our client.Client : Infosys Title : SCCM With ATMLocation : Charlotte, NC 28202Duration : 8+ MonthsVisa Status : ANY Relevant Experience (in Yrs.) - 8+\nJob description:ATM Development, Imaging and SCCM Packaging Engineer/Developer1. Create and test SCCM Packages, Baselines, Task Sequence for ATM2. Create scripts that are used for ATMs Installsa. Write scripts in PowerShell and bat files3. Review and Investigate Installation Logs/trouble shooting4. Install/un-install images and patches and configuration on ATMs5. Must have working experience with Remote deployment tools, Security Tools and Applications6. Must complete and pass eLearning, Truist regulatory courses\nMust Have Skills:SCCMATM"}, {"resume_id": "31677347", "category": "ENGINEERING", "job_id": "3905236860", "job_title": "Commercial Real Estate Sales", "job_text": "Commercial Real Estate Sales. Commercial Real Estate Brokerage \u2013 Investment Sales\ufeffSCOPE, a leading investment sales and finance company in the Mid-Atlantic, is looking to grow its roster of brokerage professionals by continuing to hire top talent in the Northeastern/Mid-Atlantic markets. SCOPE is committed to offering top-tier brokerage development to its entry-level associates all the way to its seven-figure producers. If your skillsets aren\u2019t an exact match, we still look forward to getting to know you! The Opportunity:This position is for a commercial real estate salesperson/broker for titles ranging from associate to managing director. Our structure offers agents a unique conduit to the market. SCOPE\u2019s focus is on the middle market with primary clients being owners of assets ranging from $5M-$50M in value. States of focus are PA, NJ, DE, MD, and NY. Asset classes of focus are multifamily, industrial, retail, and medical office with specific subsets within each. Scope of Work:Procure new owner relationshipsNurture and grow existing relationshipsPrepare and present financial analysisAct as a fiduciary in exclusive representation engagementsNegotiate complex transactionsManage due diligence processesAct as a liaison between buyers, sellers, attorneys, appraisers, legalProvide market intelligence to market participantsReceive coaching and best practice training  Job Requirements:Person will work within a primary asset type: i.e., Multifamily, Industrial, Retail, etcDemonstrate discipline in a high-level sales production roleBe able to maintain and thrive in a commission-based rolePreferred: Bachelor\u2019s degree in business, finance, real estate, or relatedPreferred: 2-5+ years of work experience in real estate brokerage or related verticalsAnalytical, qualitative skills to manage critical deliverables including valuations, proposals, etc.Strong communication skills and a personable demeanorTime management skills, self-accountability, and a motivated mindsetComputer proficiency specifically with Mic"}, {"resume_id": "12858898", "category": "FINANCE", "job_id": "3888027067", "job_title": "Project Financial Analyst", "job_text": "Project Financial Analyst. Company Overview\n\nAs the nation's largest producer of clean, carbon-free energy, Constellation is a company purposely-built to meet the challenges of the climate crisis. Constellation has been the leader in clean energy production for more than a decade and we are growing our company and capabilities. Now, we're accelerating, speeding our low-carbon or no-carbon power to more people in more places, day and night, providing our customers and communities with options to buy, manage and use energy as part of their decarbonization mission. The race is on to confront the climate crisis and Constellation is ready to meet the challenge. Come join us as we lead energy, together.\n\nTOTAL REWARDS\n\nConstellation offers a wide range of benefits and rewards, designed to help our employees thrive professionally and personally. In addition to highly competitive salaries, we offer a bonus program, 401(k) with company match, employee stock purchase program; comprehensive medical, dental and vision benefits, including a robust wellness program; paid time off for vacation, holidays and sick days; and much more.\n\nExpected salary range of $92,700 to $103,000, varies based on experience, along with comprehensive benefits package that includes bonus and 401(k).\n\nPrimary Purpose Of Position\n\nTo support Constellation organizations in the monitoring and controlling of project budget, forecasts and expenditures through the development of project checkbooks and analysis of current and future expenditures.\n\nThis position can be filled at the following locations:\n\nWarrenville, ILKennett Square, PADelta, PAOswego, NY\n\nPrimary Duties And Accountabilities\n\nApplies financial management tools and skills to prepare project checkbooks with input from the project manager that accurately reflect monthly/yearly budgets, forecast of future spends, and actual monthly expenditures. Processes approved Project Change Requests (PCRs) to update budgets in the project checkbook tool. Checkbooks are updated monthly"}, {"resume_id": "16877897", "category": "HR", "job_id": "3902392703", "job_title": "Bookkeeper and Administrative/HR Assistant", "job_text": "Bookkeeper and Administrative/HR Assistant. About Us:Blockreum USA Corp. is a dynamic and growing software development company committed to excellence. We pride ourselves on our dedication to providing top-notch service to our clients while fostering a positive and collaborative work environment for our team members. Job Description:We are seeking a skilled and detail-oriented individual to join our team as a Bookkeeper and Administrative/HR Assistant. This multifaceted role will be responsible for managing financial records, assisting with administrative tasks, and supporting our Human Resources department. Responsibilities:Maintain accurate and up-to-date financial records using accounting software (e.g., QuickBooks).Process accounts payable and accounts receivable transactions.Reconcile bank statements and credit card accounts.Prepare financial reports, including balance sheets, income statements, and cash flow statements.Assist with payroll processing and employee expense reimbursements.Coordinate administrative tasks such as answering phones, managing emails, and organizing office supplies.Support the HR department with recruitment efforts, employee onboarding, and maintaining personnel records.Assist with employee benefits administration and HR compliance activities.Handle other duties and special projects as assigned. Qualifications:Bachelor's degree in Accounting, Finance, Business Administration, or related field preferred.Proven experience working as a bookkeeper, administrative assistant, or HR assistant.Strong knowledge of accounting principles and practices.Proficiency in using accounting software (e.g., QuickBooks) and MS Office applications.Excellent organizational and time management skills with the ability to multitask and prioritize tasks effectively.Exceptional attention to detail and accuracy.Strong communication and interpersonal skills.Ability to maintain confidentiality and handle sensitive information with discretion.  Blockreum USA Corp. is an equal opportunity employer and does not d"}, {"resume_id": "10553553", "category": "INFORMATION-TECHNOLOGY", "job_id": "3874702220", "job_title": "Mental Health Therapist", "job_text": "Mental Health Therapist. Are you a licensed doctoral or master's-level clinician seeking a nurturing and collaborative environment where your mental well-being is valued as much as that of your clients? Do you prioritize schedule flexibility and work/life balance in your career? Look no further than Duality Psychological Services.\nAt Duality Psychological Services, we pride ourselves on fostering a supportive and inclusive culture where everyone feels valued and respected. We believe in creating a space where clinicians can thrive both personally and professionally.\nWe are currently seeking a licensed psychologist or masters-level clinician to join our team, focusing on treating individuals navigating relational trauma and ailments due to complex posttraumatic stress disorder. Additionally, if you have experience in neuropsychological or psychodiagnostic testing, there are opportunities for further skill development in these areas within our practice.\nJoin us at Duality Psychological Services and become part of a community that prioritizes your well-being and growth. We welcome applicants from diverse backgrounds and are committed to creating an environment where everyone feels empowered to succeed.\nResponsibilities:Conduct individual therapy sessions with a focus on addressing relational trauma and complex PTSD.Conduct thorough patient assessments and diagnostic evaluations to formulate personalized treatment plans.Employ evidence-based practices to deliver high-quality therapy and interventions.Maintain meticulous and confidential patient records in adherence to HIPAA regulations.Maintain a caseload of 25 to 30 weekly therapy clients, both in-person and via telehealth.Possess a personal laptop or computer for administrative tasks and telehealth sessions.Stay abreast of current research and best practices in psychology.Willingness to supervise psychological associate trainees as needed.\nSkills:Proficiency in conducting therapy sessions using various modalities.Experience working with indiv"}, {"resume_id": "29149998", "category": "HR", "job_id": "3895515593", "job_title": "Human Resources Coordinator", "job_text": "Human Resources Coordinator. Build Your Career With Ashley!\n\nTalent Acquisition Coordinator\n\nWho We Are\n\nAt Ashley, we\u2019re more than a business\u2026we\u2019re family. As the largest manufacturer of home furnishings in the world, we know what it takes to build incredible furniture and future leaders. We\u2019re problem solvers with the grit to persevere during challenging times and innovators who won't coast when times are good. We create solutions, not excuses. And never settle for status quo. It\u2019s the reason we\u2019re always searching for better ways to delivering an exceptional customer experience. That's why Ashley Furniture is #1 in our industry.\n\nReady to grow? You\u2019ve come to the right place. Ashley Furniture has a \u201cGrowth Mindset\u201d, and once you join our team, you\u2019ll learn from the best in the business.\n\nApply today and find your home at Ashley!\n\nWhat Will You Do?\n\nThe Talent Acquisition Coordinator will manage the applicant tracking system, coordinate recruiting efforts for all locations, and manage the development and maintenance of advertising templates. Lastly, you will take the lead on coordinating all the pre-hire process for new hires including offer letters, pre-employment tests, reference checks and background screenings.\n\nWork with recruiter and/or hiring managers to determine specific recruiting needs and preferred candidate specifications. Use provided data to place employment ads in internal and external sources including newspapers, web sites, Universities, etc.Coordinate recruiting efforts for all locations\u2019 mass hiring initiatives, including but not limited to off or on-site job fairs.Coordinate the company\u2019s participation in and attend all local job fairs and recruiting initiatives and events, which includes local area high school mock interview events, providing company information, tours of the facility, college, internships/co-ops, etc.Manage the development and maintenance of advertising templates for internet, radio, television, print and other advertising avenues as needed, for all loc"}, {"resume_id": "12858898", "category": "FINANCE", "job_id": "3902348225", "job_title": "Employee Benefits Specialist", "job_text": "Employee Benefits Specialist. POSITION SUMMARYThe Employee Compensation and Benefits Analyst provides expert support on Dayforce (HCM) Benefits and Employee Compensation modules and engages in continuous process improvement. Works collaboratively with City departments to ensure full system usage which may include reporting, training, and the cost-benefit assessment of other HCM modules and/or value-added services. Compiles statistical/historical reports, analyzes benefit vendor reports and budgets, assists in the RFP process for vendor selection, and completes other projects as assigned. This position has exposure to the application of collective bargaining agreements as related to compensation and benefits administration and requires the ability to manage several complex projects while meeting deadlines.\nDepartment: Human Resources & Civil ServiceSalary: $77,981 per year\nWORK EXPERIENCE: The application must clearly show two (2) years of full-time professional experience in human resources, accounting, finance or a related field. Experience using Microsoft Office applications or related software is required. Experience with HCM systems preferred.EDUCATION/TRAINING: The application must clearly show a Bachelor's Degree from a fully accredited institution in Human Resources, Finance, Pubic Administration, or a related field. \nPOSITION DUTIES\nEnsures the integrity of the compensation and benefits data housed in the City of Pittsburgh's Human Capital Management (HCM) system. Collaboratively works with, and provides guidance to, various other City of Pittsburgh departments to ensure full system usage which may include reporting, training, and the cost-benefit assessment of other HCM modules and/or value-added services. Works toward integration of data and data-systems coordinating interdepartmental efforts to manage data availability in a uniform and easily understood format which may include the creation of standardized reports.Proactively identifies potential problems and creates well-developed so"}, {"resume_id": "93988900", "category": "HEALTHCARE", "job_id": "3901940525", "job_title": "Labor and Delivery Nurse", "job_text": "Labor and Delivery Nurse. Contract- 16 WeeksShift Notes- Nights 7 PM-7:30 AM (3x12 hours) REQUIRED: Must have CA license, not accepting EMSA. Must have BSN and NRP PREFERRED: teaching hospital and greater than 3 years of L&D experience. SHIFT: 3x12s NIGHTS Schedule- 1900 - 0730 SCRUBS: Navy DETAILS: 4-weekend shifts (Fri and Sat night) every 4-week schedule with flexing to Santa Monica as needed"}, {"resume_id": "47470864", "category": "HR", "job_id": "3884435055", "job_title": "Continuous Improvement Manager", "job_text": "Continuous Improvement Manager. Job Title: Continuous Improvement Manager\nPosition Overview: As the Continuous Improvement Manager, you will be responsible for leading and implementing continuous improvement initiatives across all aspects of our manufacturing operations. Leveraging your expertise in lean manufacturing principles and methodologies, you will drive a culture of continuous improvement, waste reduction, and efficiency enhancement throughout the organization. You will work closely with cross-functional teams to identify opportunities for improvement, develop action plans, and implement sustainable solutions to optimize our manufacturing processes and drive operational excellence.\nKey Responsibilities:Develop and implement a comprehensive continuous improvement strategy aligned with the company's goals and objectives.Lead and facilitate continuous improvement projects using lean manufacturing principles, Six Sigma methodologies, and other proven improvement techniques.Analyze data and metrics to track progress, measure performance improvements, and quantify the impact of continuous improvement initiatives.Provide training and guidance to employees at all levels to foster a culture of continuous improvement and empower them to drive positive change.Lead cross-functional teams to develop and implement innovative solutions to complex operational challenges.Drive cost reduction initiatives through process optimization, waste reduction, and resource utilization improvements.\nQualifications:Bachelor's degree in Engineering, Operations Management, Business Administration, or a related field. Advanced degree preferred.Minimum of 5 years of experience in continuous improvement roles within a heavy industrial manufacturing environment.Proven track record of successfully leading and implementing continuous improvement initiatives, resulting in tangible performance improvements and cost savings.Strong understanding of lean manufacturing principles, Six Sigma methodologies, and other continuous impro"}, {"resume_id": "93988900", "category": "HEALTHCARE", "job_id": "3885821519", "job_title": "Transportation and Installation Engineer Offshore Wind", "job_text": "Transportation and Installation Engineer Offshore Wind. About Us\n\nWe are the independent expert in assurance and risk management. Driven by our purpose, to safeguard life, property, and the environment, we empower our customers and their stakeholders with facts and reliable insights so that critical decisions can be made with confidence.\n\nAs a trusted voice for many of the world\u2019s most successful organizations, we use our knowledge to advance safety and performance, set industry benchmarks, and inspire and invent solutions to tackle global transformations.\n\nAbout Energy Systems\n\nWe help customers navigate the complex transition to a decarbonized and more sustainable energy future. We do this by assuring that energy systems work safely and effectively, using solutions that are increasingly digital. We also help industries and governments to navigate the many complex, interrelated transitions taking place globally and regionally, in the energy industry.\n\nAbout The Role\n\nDNV Energy Systems, Renewables Certification\n\nRenewables Certification (RC) belongs to Business Area Energy Systems providing advisory, verification and certification services for the Energy industries with 4000 people globally.\n\nDNV Renewables Certification has the global responsibility for Type Certification (TC), Component Certification (CC) and Project Certification (PC) for Renewables within DNV. Currently RC consists of 300+ experts with locations in Beijing, Boston, Busan, Copenhagen, Esbjerg, Dresden, Hamburg, Hvik, Houston, London, Shanghai, Taipei and Tokyo.\n\nRC is the global market leader in Renewables Certification and works with the leading OEMs in the TC wind market in addition to being involved in more than 75% of Project Certification for fixed and floating offshore wind parks and offshore substations in the world.\n\nDNV Energy System-Renewables Certification (RC) group is seeking a Transportation and Installation Engineer Offshore Wind, to join our RC team in US. RC has the global responsibility for Type Certification (TC), Component Certifi"}, {"resume_id": "24854026", "category": "FINANCE", "job_id": "3899529704", "job_title": "Business Analyst (Level III)", "job_text": "Business Analyst (Level III). \n\nLength of Assignment: 7 months\n\n\nHybrid Schedule 3days in office 2days from home\n\nTop 3 skills:\n\nFamiliarity with GMI and its static data functions.\n Operational background particularly with an FCM\n Data Analytics\n\nWho we are:\n Global Collateral Operations & Exchange Traded Derivatives Operations (GCO & ETD Ops) are responsible for the exchange of collateral to reduce counterparty credit risk and for the support of post-execution trade clearing and product lifecycle management. Our global team consists of a diverse pool of over 500 individuals spanning 16 cities across 7 countries. We provide front-to back support for a broad range of Clients (hedge funds, market makers, trading firms, advisers and investment banks), Global Market products and businesses including:\n Futures and Options & OTC Cleared (F&O)Prime Brokerage (PB)Global Wealth & Investment Management (GWIM)OTC Bi-lateral Derivatives (OTC)\n\nETD Operations supports:Execution, clearing and allocation of trades and position transfers to the highest quality standards.Futures and Options position life cycle management including option exercise and assignments, physical deliveries, expirations, last trade date monitoring, long date reporting, open interest adjustments and regulator inquires.Daily Reconciliations and exception resolution, maintaining the integrity of the sub ledger for Listed and OTC Futures and Options product.Non-Financial Regulatory Reporting to Futures Exchanges and RegulatorsSetup and maintenance of static data, clearing fees and memberships within sub ledger and Exchanges.Ensuring compliance with regulatory and industry mandates across 15 Legal EntitiesProduction of reports and information required to comply with regulatory requirements and internal control policies.Researching and resolving problems within the line of businessDay-to-day analysis, research, and resolution of varied problems\n\nThe Team:\n The Data Control Team are considered Subject Matter Experts (SME) on the GMI back-offic"}, {"resume_id": "21866029", "category": "HEALTHCARE", "job_id": "3906094499", "job_title": "Materials Science Intern", "job_text": "Materials Science Intern. Materials Science links product performance, processing, structure, and properties via materials characterization and particle engineering.\nOverview:This position will allow the selected candidate to learn about drug substance and drug product development. Specifically, the candidate will either work on developing small molecule crystallization processes or building structure-property-processing-performance relationships for drug substances and drug products.\nQualifications: Pursuing a degree in Chemical Engineering, Physical Chemistry, or similar disciplines.Basic understanding and ability to apply chemical engineering or physical chemistry concepts in a laboratory setting.Basic understanding of Microsoft Office suite.Must be able to work full-time (35-40 hours/week) throughout the 12-week assignment.\nBenefits of the Internship:Interns are offered a competitive hourly pay rate and benefits. Please note benefits eligibility is to be determined upon hire.Guidance and leadership from industry leaders.Professional development opportunities and career pathways.Employee Resource Groups.\nImportant: The successful application submission for the above role(s) will be conditional to your profile evaluation by our Recruitment Specialists using the AI system. \nIf you meet the eligibility criteria, please apply and our recruitment team will help you understand your strengths and strategize your career ahead.\n\n"}, {"resume_id": "10553553", "category": "INFORMATION-TECHNOLOGY", "job_id": "3904964632", "job_title": "Voice Network Engineer", "job_text": "Voice Network Engineer. Job Title: Network Voice EngineerLocation: Dallas, TX 75201Mode : Contract (6+ Months) (Day 1 Onsite)\nTechnical Skills.\u2022 Expert level understanding of the following Cisco Unified Communication Productso CUCM 11.5 and latero CUC 11.5 and latero Cisco Emergency Responder(CER) 11.5 and latero SIP Trunks, E1/ T1(CAS,CCS), FXS /FXO etc.,o Gateway protocols: H323, SIP, MGCP, SCCP.o IM Presence & Jabbero Cisco SIP/SCCP Phone registration and troubleshootingo Able to analysis the SIP/MGCP/H323 logso Able to configure analog gateways/phones as per the customer requirements and standards.o Good understanding of UCS machines, ESXI, CIMC etc.o Deep understanding of Media resources and can configure them in real time as per customer need.o Good knowledge of Webex Control Hub and Cisco Cloud related to Cisco Voice infrastructure.\u2022 Good understanding and basic troubleshooting skills of switching \u2013 LAN, WAN, VLAN, Voice VLAN, VTP, STP, PoE, Ether channel, HSRP\u2022 Good understanding and basic troubleshooting skills of any recording server like Higher Gound(preferred), Nice Perform 4.5 and later."}, {"resume_id": "93988900", "category": "HEALTHCARE", "job_id": "3891806393", "job_title": "Maintenance/Construction Technician III", "job_text": "Maintenance/Construction Technician III. Description Of Work\n\n NOW ELIGIBLE FOR A $7,000 SIGN ON BONUS! \n\n To be eligible for a sign-on bonus, the candidate must not have worked as a probationary, permanent, or time-limited employee in the last 12 months as an employee subject to the State Human Resources Act. \n\nResponsibilities\n\nReporting to the Facility Maintenance Supervisor IV, this position will be responsible for performing routine, preventative, and corrective maintenance tasks and repairs ensuring that all assigned systems within an adult correctional facility and support buildings are maintained in a safe and efficient manner. Tasks will be performed at the Journeyman level in the electrical/mechanical trades and at the semi-skilled level for all other trades, i.e., masonry, telephone systems, and plumbing. Job responsibilities include, but are not limited to, the following:\n\nServicing and repairing potable and wastewater drainage systems, water heating systems, circulating loops and fixtures, building wiring, conduit, security fencing and equipment, lighting, electrical door controls, and motors. Repairing commercial kitchen equipment and make minor repairs to buildings both interior and exterior. Servicing and repairing HVAC systems and controls. Supervising the work of skilled, semi-skilled and unskilled labor (including inmates) assisting with completing assigned tasks, providing support to other staff members performing trade skills during preventive maintenance and/or other duties assigned by the supervisor as deemed necessary. \n\nThis is a full-time position (40 hours per week) with State Benefits .\n\nThis is a REPOST of position 60068879. Previous applicants are still under consideration and do not need to reapply.\n\nNote To Current State Employees\n\nState employees are encouraged to apply for positions of interest even if the salary grade is the same as, or lower than, their current position. If selected for this position, a new salary will be recalculated taking into consideration the quanti"}, {"resume_id": "47410104", "category": "FINANCE", "job_id": "3903470414", "job_title": "Sr. FP&A Analyst", "job_text": "Sr. FP&A Analyst. Senior FP&A Analyst\n\nFully Remote\n\n90000 - 105000 plus bonus\n\nAbout The Company And The Sr. FP&A Analyst Opportunity.\n\nOur client, a well-respected tech company is seeking a Senior Financial Analyst. This can be a remote role, but must be on CST or EST. HQ is in Chicago.\n\nWhy this company?\n\nGreat company culture with fun benefits like catered lunch, stocked fridge, beautiful workspace, office gym.Great leadershipGreat work life balanceFlexible schedule, mostly remote, in office 1x a week maximumGrowing company! Exciting time to join the companyCompetitive compensation package and benefitsFully remote, on CST or EST time zone\n\nSpecific Duties Of This Senior Financial Analyst Include\n\nBuild financial models to aid in financial decision making (Cap Ex., Acquisitions, etc.)Continue to drive process enhancement and process improvement in the reporting, forecasting, and budgeting functions via automation and system enhancements.Work collaboratively with the Treasury function (13 week rolling cash flow forecasting)Ad-hoc projects and reporting done to enhance business profitabilityPrepare the month end reporting package: P & L, B/S, Statement of Cash Flows and the respective variance analysisVariance analysis comparing actual results to budget and forecast\n\nSpecific Requirements For The Senior Financial Analyst Include\n\n2-10+ years finance experiencePrivate equity, investment banking, or strong corporate finance experience in the SaaS industryStrong Excel skills\n\n#INAPR2024\n\n#CBAPR2024\n\n"}, {"resume_id": "24854026", "category": "FINANCE", "job_id": "3889738607", "job_title": "Experienced Auto Technician", "job_text": "Experienced Auto Technician. FORMULA IMPORTS In CHARLOTTE NC has an immediate opening for an experienced auto technician / shop foreman for its new location. We currently sell everything from Ferrari and Lamborghini to Volkswagen. The ideal candidate has been an auto technician for at least 3 years or has owned a shop. Must have experience with Import and Domestic vehicles and have your own tools. Experience managing other technicians is a plus. Bilingual is a plus! This is an excellent opportunity for long term employment and growth with us that is geared towards customer service and performance. Pay is based on experience plus an override bonus is possible on the entire shop production. We are closed Sundays. 4 day work week is possible"}, {"resume_id": "24854026", "category": "FINANCE", "job_id": "3905292284", "job_title": "OMNI Dir Human Resources", "job_text": "OMNI Dir Human Resources. Omni Air International is a private airline providing tailored passenger and government charter services. We\u2019re committed to exceeding expectations, with satisfaction and safety as our measure of success.\n\nWe pride ourselves on providing our employees a work experience built on family values. Our employee\u2019s contributions impact the lives of passengers on a daily basis. Our comprehensive benefits package is designed with you in mind. Medical, dental, vision, company paid life insurance, 401K with company match, employee assistance program and more!\n\nEssential Duties And Responsibilities\n\nThe Director of Human Resources will oversee the HR team This person will be accountable for providing leadership and direction surrounding hiring/onboarding processes, benefits administration, performance management, leadership development, and disciplinary processes, while implementing continuous improvement of processes and procedures.\n\nPartner with leadership on processes and strategies related to HR objectives and compliance that best supports business goalsReviews monthly base staffing reports for senior management and provide recommendations; establish staffing and retention goals based on business needsResponsible for ensuring the effective execution of the following activities performed by the HR team and Payroll teams: Affirmative Action, Benefits, Backgrounds, Drug & Alcohol Testing Administration, FMLA, Recruiting/On-boarding, Training, Workers Compensation, Unemployment, Employee Relations, and PayrollSupport labor relations and contract negotiations and secure effective relationship between the company and union(s)Develop and deliver company communications surrounding company initiatives, changes, concerns, and other sensitive topicsAdvise all levels of management on effective performance management solutionsConducts and reviews all investigations and ensures that all information is accurate and documented correctly; approves all suspensions and terminations as appropri"}, {"resume_id": "20237244", "category": "INFORMATION-TECHNOLOGY", "job_id": "3904510172", "job_title": "Full Stack Software Engineer", "job_text": "Full Stack Software Engineer. Our client is seeking a Full Stack Software Engineer who will join a highly skilled development team. You will be responsible for the design and development of all Client Side software.\n\nCompensation: $150-200k\n\nResponsibilities\n\nDesign and develop User Interface for Desktop, Web and Mobile environment\n\nDesign and develop all call processing, recording and record management software\n\nDe"}, {"resume_id": "28198029", "category": "SALES", "job_id": "3904364456", "job_title": "Production Associate - Garment Hanger/Inspector - Up To $19.25/Hour", "job_text": "Production Associate - Garment Hanger/Inspector - Up To $19.25/Hour. Requisition Number: 171010\n\nJob Description\n\nCintas is seeking a Production Associate - Garment Hanger/Inspector - Up To $19.25/Hour to support the Rental Division. The Garment Hanger/Inspector is responsible for safely and accurately placing customer garments on hangers and for visually inspecting all garments to identify the need for proactive repairing, such as patching holes or tears. Garment Hanger/Inspectors are expected to maintain the cleanliness of their work area. This position is on a performance-based incentive pay structure; meaning the Garment Hanger/Inspector must meet or exceed a production standard for hanging garments, and additional compensation incentive (e.g., higher hourly pay) is tied to exceeding production standards.\n\nSkills/Qualifications\n\nJob Expectations and Eligibility Factors:\n\nWork Eligibility (prior to first day of employment)\n\nMust be authorized to work in the US. Must be 18 years of age or older.\n\nWork Expectations\n\nMust adhere to attendance policy.Must be willing to work in a safe proximity to other people for extended periods of time.Must be willing to work in a fast-paced, schedule driven environment where there are time pressures to complete work quickly.\n\nPhysical Qualifications, With Or Without Reasonable Accommodation\n\nRequires standing for most of shift.Requires repetitive motions, stretching, bending, turning, or reaching to accomplish work activities.May require pushing carts or bins full of bulk or linen product to station to prepare for folding.\n\nAttributes Of a Great Employee-Partner\n\nAttention To Detail: Is thorough and careful about detail when completing work tasks or correcting flaws or mistakes.Work Ethic / Effort: Displays a high level of effort and commitment towards performing work; is hard working and dependable; prioritizes tasks properly to meet deadlines.Interpersonal Skills: Is pleasant with others on the job and displays a good-natured, cooperative attitude; is respectful, courteous, and polite towards oth"}, {"resume_id": "30083943", "category": "SALES", "job_id": "3894547269", "job_title": "Associate Director, Sales Development, SMB", "job_text": "Associate Director, Sales Development, SMB. Who We Are Is What We Do.\n\nDeel and our family of growing companies are made up of global teams dedicated to helping businesses hire anyone, anywhere, easily.\n\nThe team comprises over three thousand self-driven individuals spanning over 100 countries, and our unified yet diverse culture keeps us continually learning and innovating the platform and products for customers.\n\nCompanies should be able to hire the best talent anywhere in the world, so we are building the best platform to make that a reality. Our market-leading technology, expertise, and global team are crucial to the platform\u2019s success. We deliver the best products and features in our space, enabling millions of jobs worldwide and connecting the global workforce with the best companies and opportunities.\n\nWhy should you be part of our success story?\n\nA 30-mile hiring radius should no longer dictate how companies hire because exceptional talent lives everywhere. Deel sees a world without hiring borders and endless talent that pairs perfect candidates with great companies.\n\nWe offer global teams all the tools they need to hire, onboard, manage, pay, and scale at full speed. We aim to foster a diverse global economy by building a generational platform that seamlessly connects companies with talent worldwide.\n\nAfter our successful Series D in 2021, we raised another $50M in 2023, doubling our valuation to $12B. There\u2019s never been a more exciting time to join Deel \u2014 the international payroll and compliance market leader.\n\nWhat we\u2019re looking for:\n\nAs the Associate Director of Sales Development, you'll manage a team of high-performing managers and team members focused on our Small-Medium Sized Business segment. You will be responsible for driving revenue and customer acquisition across these segments in a meaningful way, as well as coaching team members to improve the quality of the pipelines driven by the SDR organization. The Sales Development team is the first interaction with prospective Deel customers and i"}, {"resume_id": "17108676", "category": "ENGINEERING", "job_id": "3901344926", "job_title": "System Engineer", "job_text": "System Engineer. System EngineerClient: Large Banking InstitutionLocation: Plano, TX (hybrid)Pay Rate: $73.68Business Unit: Global TechnologyContract Length: 12-18 months \nJob Description:The Systems Engineer will be responsible for leading multiple projects on the Technology Infrastructure team within a complex financial organization. The middleware team is responsible for managing a distributed architecture framework hosting mission critical J2EE internet intranet applications. The ideal candidate will have a background in technical infrastructure management and engineering, with a history of hands-on experience.\nResponsibilities include:Web-based application (Weblogic Server/Portal) server design and build outs for applications and services in a UNIX infrastructure.Troubleshooting complex application integration points and coordinating with virtual team members across the enterprise to deliver complex J2EE hosting solutionsManage multiple projects concurrently and be readily adaptable to change. Additionally this person is expected to be self-motivated, a strong leader, able to influence others and able to think creatively.Manage and work closely with application teams deploying new applications in the Weblogic hosting environment(s). Able to gather application configuration needs and facilitate changes with administrators and product vendor (when need be) to resolve technical configuration or application issues etc.Will be required to provide on call support and flexible working hours.Working with customers (application teams and/or testing teams) on a daily basis and providing Middleware and Java support; Serving as a J2EE architect and making recommendations on J2EE best practices in application development; Designing Middleware infrastructure and Middleware topology design for high availability and failover capability; Providing technical consultation to other team members and their supported areas; Communicating with business partners at an enterprise level; Interfacing with"}, {"resume_id": "20237244", "category": "INFORMATION-TECHNOLOGY", "job_id": "3905849375", "job_title": "Security Training Supervisor $21.50/hr", "job_text": "Security Training Supervisor $21.50/hr. \nABOUT THE ORGANIZATION\n\nWe are a positive thinking, diverse team of security professionals who respectfully provide stewardship to clients, their property, and guests. Our service, integrity and reputation are unwavering. The senior management team of J8 Security has 50+ years of security experience. What does this mean to you? J8 Security is a company based on the expertise of that combined experience, This experience plus our commitment to deliver superior security services is why we continue to grow new business and maintain long term clients. Most of our clients have been with us for over a decade. \n\nDESCRIPTION\n\nSecurity Training Supervisor $21.50 per hour**The J8 Security team has been providing exceptional security services to prestigious companies in the Greater Cleveland and Akron Areas for more than 30 years. We are looking for individuals who want to become a part of a growing, open-minded, positive thinking company. Position Overview:This position\u2019s purpose is to be third in command over the J8 Officers at the customer location. The Training Officer is tasked with training and development of all new and existing officers. Responsibilities:Responsible for all site trainingWill act as on-site custodian of all training documentsWill continually update and tailor training to meet the needs of each postCompleting disciplinary actions pertaining to training issuesConduct monthly in-service trainingParticipate in department & Supervisor meetingsComplete J8 Security Officer Performance ReviewsMake sure uniforms are up to standard for officers on each shiftConduct annual training auditsMaintaining a line of communication with the clientReview reports for officer for clarity and accuracyComplete 2 post inspections per weekSchedule:Full-time position must be available to conduct training on all shifts.Check the requirements:High School diploma/GEDGood physical conditionMinimum 3-5 years supervisory security or military experience preferred21 years or olderLegally "}, {"resume_id": "47470864", "category": "HR", "job_id": "3903474478", "job_title": "HR Generalist", "job_text": "HR Generalist. The Company\n\nHeico has a history of success. Since its founding over 40 years ago, The Heico Companies has grown from a single business to over 78 separate companies through a strategic acquisition policy, and by reinvesting its earnings into internal growth and new prospects. Historically talented at restoring distressed companies, Heico strategically targets acquisitions that will complement its ever-growing portfolio of companies in manufacturing, construction, and industrial services.\n\nThese four core operations are organized into groups: Applied Solutions Group, Construction Solutions Group, Industrial Technologies Group, and Metal Processing Group. Once acquired, new Heico companies are assigned to a group and run on a stand-alone basis, allowing for great independence as well as the opportunity to share knowledge about markets, production processes, and management practices across other Heico groups and companies.\n\nHeico continues to seek out new opportunities and maintain its standard of success. The Heico Companies has remained a privately held company since its creation and maintains a majority ownership in each of its operations, which generates more than $3.3 billion dollars in revenues. Many of our businesses are certified Woman-owned Business Enterprises (WBE). \n\nMore information about the overall organization can be found at www.heicocompanies.com.\n\nThe Position\n\nThe Human Resources Generalist is responsible for performing HR-related duties on a professional level and works closely with leadership in supporting the business unit. This position is located in Baytown, TX and carries out responsibilities in the following functional areas: full cycle recruiting, benefits administration, employee relations, training, performance management, onboarding, policy implementation, labor relations and compliance.\n\nJob Description\n\nTalent Management \n\nPartner with the HR Manager and Corporate Talent team to manage full cycle recruiting responsibilities, maintainin"}, {"resume_id": "22319662", "category": "SALES", "job_id": "3888972089", "job_title": "Retail Sales Associate (Part-Time)", "job_text": "Retail Sales Associate (Part-Time). AutoZone's Part-Time Retail Sales Associates drive sales through superior customer service by exceeding customer expectations and providing a WOW! Customer Service experience. While assisting customers, the Retail Sales Associate will perform daily assigned duties and remain compliant with company procedures in accordance to AutoZone expectations by Living the Pledge every day.\n\nPosition Responsibilities\n\nProvides WOW! Customer ServiceEnsures assigned store tasks are completed in a timely manner on assigned shiftOperates cash registers and follows established cash handling proceduresFollows company policies and loss prevention proceduresMaintains a safe working environment including PPE (Personal Protective Equipment)Maintains store appearance and merchandising standards as directedEnsures that merchandise is restocked and placed in their respective areasUtilizes ZNET to help customers locate merchandise or find suitable alternativesMaintains product knowledge and current promotions through AutoZone systems and information sourcesPractices GOTTChA and assists with the installation of wipers blades, batteries and light bulbsUtilizes OBDII to read codes from customer\u2019s automobilesAbility to diagnose automobile problems and recommend solutionsCommunicates with managers regarding customer concerns and employee mattersActively engaged in developing more effective customer service skillsProvides honest and trustworthy advice to customers regarding the best products that fit the customers\u2019 expectations\n\nPosition Requirements\n\nApplicants 18 years or older High School diploma or equivalentBasic knowledge of automotive parts is requiredExcellent communication and decision making skillsAbility to lift, load, and deliver merchandiseAbility to work a flexible schedule to meet the business needs, including holidays, evenings and weekend shifts\n\nBenefits At AutoZone\n\nAutoZone cares about people. That\u2019s why AutoZone offers thoughtful benefits programs with one-on-one benefit guidan"}, {"resume_id": "47470864", "category": "HR", "job_id": "3904966341", "job_title": "Human Resources Ass
