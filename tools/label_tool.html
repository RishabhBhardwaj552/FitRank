ociate", "job_text": "Human Resources Associate. Job Title: Human Resources and Client Services Associate\nReports To: VP Recruiting & Operations\nJob Overview:GForce Life Sciences is one of the fastest-growing companies in the US! Ranked #8 in 2018 and #90 in 2019 on the Inc. 500 Fastest Growing Private Companies list, we are continuing to expand! GForce has repeatedly been awarded as a \u201cBest Staffing Company to Work For\u201d by Staffing Industry Analysts and \u201cBest Companies to Work For\u201d in our home state of Illinois.\nThe Human Resources and Client Services Associate is responsible for managing the day-to-day operations of the human resources department, including, onboarding, employee relations, benefits, performance management, consultant care & communication, effective office management, social media, marketing and compliance with applicable employment laws and regulations. \nThe Human Resources and Client Services Associate will work closely with department managers and employees to ensure that the organization has a high-performing workforce that is motivated, engaged, and aligned with the company's goals and values.\nGForce ValuesMust embrace and exemplify GForce\u2019s values:Passion \u2013 Must love pairing top-notch candidates with clients. \u201cDo what you love. Love what you do.\u201dRespect \u2013 Hold our colleagues, clients & candidates in high esteem \u2013 always.Integrity \u2013 Always focused on doing the right thing in a reliable way.Conviction \u2013 Only make promises you can keep to your clients & candidates.Enthusiasm - Attack each day and interaction with zeal.\nKey Responsibilities \u2013 Human Resources:Onboarding: Oversee the onboarding process for new employees, including orientation, ensure training is scheduled, execute background check and drug test and completing required paperwork.Employee Relations: Serve as the primary point of contact for employee relations issues, providing guidance and support to managers and employees to resolve conflicts, promote open communication, and ensure a positive workplace culture.Benefits administrat"}, {"resume_id": "93988900", "category": "HEALTHCARE", "job_id": "3906069836", "job_title": "Nurse Practitioner", "job_text": "Nurse Practitioner. Position Type: Full-time, exempt\n\nCompensation: Up to $165,000 annually\n\nJob Highlights\n\n6-Hour Shifts Daily: Short, balanced workdays.Flexible Schedules: Work around your life.No On-Call: Free weekendsNo Overnight RequirementsSupportive Community: Access to physician/provider network.Effortless documentation: Conversational and Dragon dictation.Meaningful Connections: Establish lasting relationships with patients and staff.Paid Time Off! No holidays!Culture of Appreciation: Your work is valued and rewarded.$1,500 CME and Conference Allowance: Invest in your growth.Full Gear: iPad with LTE, Apple Pen, AirPods provided.Licensure Reimbursed: We cover your medical licensure costs.Malpractice & Tail Covered: Full insurance peace of mind.Benefits: 401k match, Medical/Dental/Vision, Disability, Employer-paid Life Insurance.Relocation Help: Assistance for a smooth move.Referral Bonus: Earn more by expanding our team.Travel Reimbursed: Gas and mileage for work travel.Career Advancement: Leadership opportunities promoted.UpToDate Subscription: Latest medical info at your fingertips.\n\n\nEssential Functions & Responsibilities\n\nProvider is responsible for rounding and managing the clinical care of the population at the assigned SNF. The provider is responsible for rounding daily and prescribing medications and treatments for residents residing at SNFs. Provider will provide high quality, patient-centered, comprehensive primary care services to patients residing in SNFs. Provider is responsible for timely documentation of all patient care/encounters The provider will be available for phone/secure messaging consultations with facility nursing staff.Provider documentation is completed in Theoria\u2019s proprietary electronic health record (EHR) system, ChartEasy\u2122. PointClickCare, MatrixCare, and American HealthTech are the most commonly used facility EHR systems. Provider is expected to be on-site on and on time for their in-person scheduled shifts. Timely attendance is imperative.Relia"}, {"resume_id": "12858898", "category": "FINANCE", "job_id": "3889490370", "job_title": "Cloud Automation Manager", "job_text": "Cloud Automation Manager. Job ID 2405140\n\nLocation RICHMOND, VA, US\n\nDate Posted 2024-04-08\n\nCategory Information Technology\n\nSubcategory Cloud Comp Engr\n\nSchedule Full-time\n\nShift Day Job\n\nTravel Yes, 10 % of the Time\n\nMinimum Clearance Required None\n\nClearance Level Must Be Able to Obtain None\n\nPotential for Remote Work No\n\nDescription\n\nSAIC is currently looking for a Cloud Automation Manager. The Cloud Automation Manager is responsible for overseeing the design, development, implementation, and maintenance of the organization's cloud automation infrastructure, ensuring scalability, security, automated deployment and ordering of cloud-based services. This role involves expertise in cloud environment design, engineering, quality assurance, troubleshooting, database management, security, compliance, backup, disaster recovery, performance optimization, automation, issue resolution, collaboration, and documentation.\n\nThis is a Hybrid remote role. It will require working on site 2 days a week in Richmond, VA.\n\nResponsibilities And Duties\n\n Cloud Workflow Design and Development Design, develop, and ensure the quality assurance and testing of cloud automation workflows to meet organizational needs utilizing Morpheus Cloud Management Platform. Cloud Standards and Practices Apply experienced knowledge of standards, practices, and automation for cloud infrastructure. Troubleshooting and Problem Resolution Troubleshoot and resolve issues impacting operational systems and services, ensuring minimal downtime. Database Management Manage the organization's databases, including design, installation, configuration, backup, recovery, and performance tuning. Cloud Service Selection Evaluate cloud services and select the most appropriate services for development based on customer demand and automation capabilities. Security and Compliance Implement and maintain robust security measures for both cloud and database environments, ensuring compliance with industry standards and regulations. Backup and Disaster Re"}, {"resume_id": "24083609", "category": "INFORMATION-TECHNOLOGY", "job_id": "3894211137", "job_title": "Senior Salesforce CPQ Developer", "job_text": "Senior Salesforce CPQ Developer. AVEVA is a global leader in industrial software. Our cutting-edge solutions are used by thousands of enterprises to deliver the essentials of life \u2013 such as energy, infrastructure, chemicals and minerals \u2013 safely, efficiently and more sustainably.\n\nWe\u2019re the first software business in the world to have our sustainability targets validated by the SBTi, and we\u2019ve been recognized for the transparency and ambition of our commitment to diversity, equity, and inclusion. We\u2019ve also recently been named as one of the world\u2019s most innovative companies.\n\nIf you\u2019re a curious and collaborative person who wants to make a big impact through technology, then we want to hear from you! Find out more at https://www.aveva.com/en/about/careers/.\n\nWe are seeking a highly skilled Salesforce CPQ Specialist with expertise in business analysis, CPQ administration, and contract management. The ideal candidate will have hands-on experience in implementing and optimizing Salesforce CPQ solutions, along with proficiency in contract lifecycle management (CLM) using DocuSign CLM.\n\nLocation: Philadelphia\n\nPrimary Responsibilities:\n\nCollaborate with stakeholders to gather and analyze business requirements related to products, pricing, quoting, order processing, inventory, and contract management processes.Design, configure, and customize Salesforce CPQ solutions to meet business needs, including product configuration, pricing rules, discounting, and quote templates.Lead workshops, requirements walk throughs and sprint review sessions with the business, QA, and Development teams.Provide ongoing support and troubleshooting for Salesforce CPQ and DocuSign CLM, addressing user inquiries, and resolving technical issues promptly.Execute administrative tasks for Salesforce CPQ, managing user permissions, security settings, and data integrity.Integrate Salesforce CPQ with other systems and applications, such as CRM, ERP, and other systems, to streamline end-to-end business processes.Implement contract manag"}, {"resume_id": "23296286", "category": "SALES", "job_id": "3905205279", "job_title": "Area Operations Coordinator", "job_text": "Area Operations Coordinator. Securitas Security Services USA, Inc.\n\nPosition Title: Area Operations Coordinator\n\nLocation: St. Paul, Minnesota (MN)\n\nSummary:\n\nServes as confidential administrator for an Area Vice President or Director and Area office. Carries out diverse administrative duties and implements organizational policies and practices. Aids line management in staff capacity by coordinating office services, such as personnel, budget preparation and records control, and conducting special management studies.\n\nBenefits:\n\nDepending on experience, Securitas will offer a base salary of $64K to $67K in addition to a full benefit package that includes:\n\nMedical InsuranceLife InsuranceDental Vision4 Floating Holidays6 Sick Days10 Vacation Days Accrued401K\n\nSecuritas' Credentials:\n\nGreat team of 370,000+ employeesIndustry leader providing global and specialized servicesEstablished in 1850 as Pinkerton and in 1934 as Securitas AB\n\nPosition Qualifications:\n\nEnsures delivery of high-quality customer service.Strong communication, planning, organizing, and decision-making abilities.Is organized, self-disciplined, technologically savvy, compliant, and communicates timely and effectively at all levels.Additional qualifications may be specified and receive preference, depending upon the nature of the position.\n\nEducation/Experience:\n\nHigh School Diploma or G.E.D.3 years of administrative work experienceOr an equivalent combination of education and experience sufficient to perform the essential functions of the job, as determined by the company\n\nCompany Website: https://www.securitasinc.com\n\nEOE M/F/Vet/Disabilities\n\n#AF-SSTA\n\nAbout Us\n\nSecuritas employees come from all walks of life, bringing with them a variety of distinctive skills and perspectives. United through our common purpose, we provide the security needed to safeguard our clients' assets and people. Our core values - Integrity, Vigilance and Helpfulness - are represented by the three red dots in the Securitas logo. If you live by these value"}, {"resume_id": "17812897", "category": "HR", "job_id": "3903487983", "job_title": "Planner/Scheduler", "job_text": "Planner/Scheduler. Responsibilities:Task planning and workflow coordination for multiple CraftsAttend daily Plant meetings to ensure work is captured for planning and schedulingPlan, prioritize and coordination of both corrective and preventative work utilizing input from Operations and Craft Leadershipo Determine manpower, equipment and materials required for effective and efficient completion of planned worko Assignment of both in-house crafts and outside resources for effective and efficient completion of planned worko Scheduling of planned work based on PSM requirements and production risko Coordination with Global Supply Chain / Warehousing around components and spares requirements for upcoming workMonitoring of budgeted cost/timing progress for scheduled workGeneration and distribution of KPI reports (work order completion, equipment failures by type, work order planned vs actual cost, etc.) utilizing information from the CMMS (SAP) Requirements:Experience in SAPWorking knowledge of MS Office, Excel and SAP systemsHigh school diplomaData analysis skillsStrong analytical skills and ability to apply analytical results"}, {"resume_id": "85417107", "category": "HEALTHCARE", "job_id": "3905310314", "job_title": "2nd Shift Enclosure Assembly (Manufacturing)", "job_text": "2nd Shift Enclosure Assembly (Manufacturing). Description\n\nJob Summary:\n\nThe Assembly Tech 2 role is responsible for the assembly of power generation equipment including generators, enclosures, energy storage units, and PECs. This role is responsible for following work instructions created from engineering drawings to build power generation equipment to specified design. The Assembly Tech 2 position is tasked with the electrical wiring and final electrical terminations of the assembly build. They are also responsible for landing and terminating the load cables and other critical components of the power generation equipment manufacturing process. Assembly Tech 2 is someone who has demonstrated proficiency in the servicing/maintenance, assembly, or emplacement of power generation equipment; skills related to the electrical/mechanical servicing of heavy equipment will also be considered.\n\nMinimum Qualifications: (Education, Experience, Knowledge and Skills):\n\n1 years of manufacturing, field service or construction in the energy sector or similar industry preferred.High School Diploma or equivalency preferred.Must be able to read measuring devices to the 1/16th of an inch.Electrical experience is highly preferred.\n\nJob Duties And Responsibilities\n\nAssemble complex electrical and mechanical sub-assemblies according to drawings, bills of material, schematics, and/or standard procedures.Reference engineering documents and schematics to guide them in the assembling of the mechanical parts and the wiring of the controls and house power.Read/ understand electrical drawing of both house power and communication wiring, properly landing/ labeling wiring in both TCC/ECC and house power panel.Mount Genset on its skid using correct hardware and meeting torque requirements. Mount all stands to skid (ECC, GBC, SCR, disconnect) and setting said components in place. Connect exhaust parts and install them using correct hardware, gaskets and meeting all torque requirements. Make load cables using correct gauge cable, lug, and proper"}, {"resume_id": "33685988", "category": "FINANCE", "job_id": "3904389114", "job_title": "RN ICU Full TIme", "job_text": "RN ICU Full TIme. Employment Type:\n\nFull time\n\nShift:\n\nDescription:\n\nEmployment Type:\n\nFull Time\n\nShift:\n\nSelf-staffing unit\n\nPosition Purpose\n\nUnder limited supervision, provides nursing care to assigned patients of all age population by utilizing the nursing process and meeting the established standards within the Nursing Department. The registered nurse is accountable for assigned patients, demonstrates understand of nursing and its issues and is an advocate for patient/families and nursing.\n\nWhat You Will Do \n\nUtilizing the nursing process effectively identifies actual and potential problems and develops/carries out the plan of care for the complex patient; specific to the age of patient population identified within the department/unit scope of service, in accordance with the department/unit standards.Initiates, and revises as necessary, the plan of care, which meets the unit standards. Initiates IPOC within 4 hours of admission. Promotes and maintains a safe and calm environment for complex patients by ensuring appropriate supplies, equipment, and necessary services.Implements nursing intervention and adapts care based on changes in patient condition, consultation with other professionals and patient/family needs.Makes clinical decisions independently based on scientific principles, systematic approach and experience.Identifies actual and potential risk to patients and/or families and initiates appropriate action to minimize risk.Administers medications and treatments as directed, and as appropriate for the patient's medical care, in collaboration with the multi-disciplinary team.Utilizes internal and community resources in planning care and initiating referrals.Initiates appropriate patient/family education following assessment of leaning and discharge needs.\n\nMinimum Qualifications \n\nIs a registered nurse maintaining current licensure defined by Interstate Compact. A senior level nursing student of accredited nursing program may apply. All registered nurses hired after January"}, {"resume_id": "24083609", "category": "INFORMATION-TECHNOLOGY", "job_id": "3886442595", "job_title": "Business Process Analyst", "job_text": "Business Process Analyst. At DICK\u2019S Sporting Goods, we believe in how positively sports can change lives. On our team, everyone plays a critical role in creating confidence and excitement by personally equipping all athletes to achieve their dreams. We are committed to creating an inclusive and diverse workforce, reflecting the communities we serve.\n\nIf you are ready to make a difference as part of the world\u2019s greatest sports team, apply to join our team today!\n\nOverview\n\nJob Duties & Responsibilities\n\nPartner with internal stakeholders to identify and prioritize process and operational opportunities and create efficiencies. Document and analyze current state processes; design & document future state process, including automation opportunities. Direct meetings, interviews, and workshops to gather requirements necessary for design solutions and lead future state implementation plans.\n\nDevelop key reporting metrics to quantify impact of pre/post process efficiency improvement. Leverage findings to influence future store design and operational processes.\n\nCoordinate and complete various project management tasks including, communication and training plans, leadership status reports, and standardized tools/process guides. Identify key risks or roadblocks and provide leadership recommendations to drive work and process efficiencies.\n\nQualifications\n\nBachelor's Degree Business; Technology; Communication, Engineering or other related discipline5-7 years experience Business Process Design Experience Retail Experience preferredLean Six Sigma Certification (green belt or higher) RequiredCurrent/Future State Process Mapping RequiredPMP preferredWorkshop/Training; Planning, Preparation and DeliveryVisioMiroMS Teams/SharepointProcess MappingProject Management toolsMS Powerpoint \u2013 Presentation"}, {"resume_id": "17108676", "category": "ENGINEERING", "job_id": "3904717810", "job_title": "Accounting Manager", "job_text": "Accounting Manager. About The Job\n\nSince 1854, the innovation and creativity of Louis Vuitton\u2019s expert craftsmanship has been passed from generation to generation. Louis Vuitton U.S. Manufacturing (LVUSM) is a part of this rich history and tradition, and proudly operates workshops in California and Texas.\n\nOur ateliers in Irwindale and San Dimas are currently seeking an Accounting Manager. In this position you will supervise, track and evaluate the day-to-day accounting activities. This includes preparing the monthly close, completing the corporate consolidation reports, and maintaining the accuracy of the General Ledger and Fixed Asset Ledger. This position reports to the CFO of LVUSM.\n\nProfile\n\nAdditional Duties\n\nPrepare internal financial reports.Responsible for monthly report review and research to ensure financial transactions are complete and accurateResponsible for the accuracy and integrity of the General Ledger vouchersReview balance sheet account lead sheets prepared by GL accountantsManage the fixed assets ledger and the relative processesReview, approve, and post journal entries from accounting staffReconcile General Ledger accounts, investigate and rectify all discrepanciesManage and support the Accounts Payable (AP), Accounts Receivable (AR), and billing functionsSupervise the accounts payable team and provide guidance in the day to day operations, while providing mentorship for the development of the teamMaintain the vendor database (open and close + solidity analysis)Review on a monthly basis the open purchase order status to ensure accurate accrualsEnsure adherence of the financial internal controls and policiesMaintain data for the annual tax declarations (IT, property tax, 1099 reporting)Assist in financial statement audits, tax filings and compliance filingsComplete data backupsPerform financial and profitability analysis as requestedInterface with the management team on monthly updatesImprove financial processes, reducing execution time and improving accuracyPartic"}, {"resume_id": "16877897", "category": "HR", "job_id": "3902831400", "job_title": "Senior Immigration Attorney", "job_text": "Senior Immigration Attorney. Job Title: Senior Immigration Attorney\nLocation: Remote\nResponsibilities:Representation: Provide comprehensive legal representation to clients in various immigration matters, including but not limited to visa applications, citizenship, asylum, deportation defense, and employment-based immigration.Management: Manage a caseload of complex immigration cases, ensuring all deadlines and requirements are met, and providing guidance and support to junior attorneys and legal staff.Research and Analysis: Conduct in-depth legal research and analysis on immigration laws, regulations, and precedents to develop effective legal strategies and arguments.Communication: Communicate effectively with clients to understand their immigration needs, provide updates on case status, and advise on legal options and potential outcomes.Representation: Represent clients in immigration court proceedings, administrative hearings, and appeals before relevant government agencies and courts.and Filings: Prepare and file various immigration petitions, applications, and supporting documents accurately and timely, ensuring compliance with all legal requirements.and Risk Management: Stay updated on changes in immigration laws and policies, assess potential risks to clients, and provide proactive guidance to mitigate risks and ensure compliance.Collaborate with other attorneys, paralegals, and legal staff to streamline processes, share knowledge, and achieve departmental goals effectively.Development: Contribute to business development initiatives, including client outreach, networking, and participation in legal seminars and conferences to attract new clients and expand the firm's immigration practice.\nQualifications:Doctor (J.D.) degree from an accredited law school.5+ years of experience practicing immigration law, with a proven track record of handling complex cases.knowledge of U.S. immigration laws, regulations, and procedures that includes experience with EOIR filings, family-based, consular, U-V"}, {"resume_id": "31677347", "category": "ENGINEERING", "job_id": "3901370967", "job_title": "Internal Communications Senior Manager", "job_text": "Internal Communications Senior Manager. Job Description\n\nJob Summary:\n\nAs an Internal Communications Senior Manager, you will partner with a variety of internal clients to develop and execute powerful communications that manage change, create engagement and drive a positive and productive organizational culture. This role will help proactively identify internal communications opportunities and elevate communications. You will bring a holistic view and approach to this role through your insight into the firm at large along with deep knowledge and understanding of the business.\n\nJob Duties\n\nFirmwide Communications\n\n Works closely with teams across the firm to understand their needs, vision, goals and challenges, becoming a trusted advisor and valued resource  Develops and executes engaging communications plans that drive awareness of key firm initiatives and campaigns and inspire professionals to take action  Researches and writes impactful and engaging content for internal news site and edits the work of team members  Leverages a variety of communication channels, including but not limited to the intranet, email, an internal social media platform, voicemail and video  Supports crisis or time-sensitive communications with confidence and a sense of urgency  Brings innovative ideas to create or enhance internal communication channels and processes  Other duties as required \n\n\nStrategic Communications\n\n Works closely with stakeholders to understand their needs, vision, goals and challenges, becoming a trusted advisor and valued resource  Utilizes change communications best practices to ensure a steady drumbeat of communications with a cohesive narrative, identify and segment audiences with unique messaging, deliver a multi-channel approach  Conducts final review of any communications before publication  Leads the development and execution of strategic communications plans that promote engagement and facilitate adoption of new processes, technologies and ways of working  Works with key leaders to help them shar"}, {"resume_id": "12858898", "category": "FINANCE", "job_id": "3895800067", "job_title": "Revenue Operations Analyst", "job_text": "Revenue Operations Analyst. At Relatient were on a mission to make access to healthcare simpler.We partner with leading health systems and medical practices - comprising more than 40,000 providers across the US - to optimize every step of a patient journey, from alerting patients to needed care, helping them find the right provider, scheduling appointments across multiple channels, and engaging with patients throughout their care journey via text, email, and chat. Our solutions reduce delays in care, improve communication, and enhance both the provider and consumer experience. Weve been recognized as a Forbes Top Startup, Deloitte Fast 500, and Inc 5000, among other honors, for our rapid growth, innovative technology solutions, and energetic workplace culture.We are currently looking for a Revenue Operations Analyst to join our team inAtlanta.Essential Functions:Analyze revenue data toidentify trends, opportunities, and potential areas for improvement.Collaborate with cross-functional teams to develop and implement revenue optimization strategies.Develop andmaintain revenue forecasting models to support business planning and decision-making.Monitor key revenue metrics and KPIs, providing regular reporting and insights to senior management.Partner with Sales, Marketing, Finance, and other departments to ensure alignment and coordination of revenue-related activities.Lead initiatives to streamline revenue processes, improve efficiency, and enhance overall revenue performance.Stay informed about industry trends, best practices, and emerging technologies related to revenue operations.Education & Experience Requirements:Bachelor's degree in finance, business administration, or similar field or equivalent work experience in lieu of a degree is required.3+ years of experience in revenue operations, revenue analysis, or a similar role, with a demonstrated track record of success.Proficiency in revenue management tools and systems (e.g., Salesforce, NetSuite, Tableau (or similar), Excel or google sheet"}, {"resume_id": "28198029", "category": "SALES", "job_id": "3901950033", "job_title": "Director of Hospice Business Development", "job_text": "Director of Hospice Business Development. Director of Business Development - Hospice SalesLocation: Central Chicago, IL (requires significant travel across the region)\nWheeler Staffing Partners is seeking a Director of Business Development to join our leading hospice care team. This pivotal role entails a mix of office duties and extensive travel throughout the Chicago territory to drive sales and client engagement. The successful candidate will lead a team of Hospice Sales Consultants, enhancing their performance through direct involvement in field activities like ride-alongs and branch visits. This position is ideal for someone with a strong background in sales leadership and a deep commitment to enhancing hospice care.\nResponsibilities:Direct and support a team of Hospice Sales Consultants to excel in their sales targets.Engage in field activities such as client meetings and ride-alongs to provide real-time coaching.Regularly visit branches to ensure operational consistency and adherence to company goals.Foster and maintain key relationships within the healthcare community to enhance referral networks.Guide the sales team towards meeting or exceeding sales quotas.Work collaboratively with the Executive Director to set and implement strategic goals and monitor outcomes.Facilitate training sessions on the referral and admission processes for team members.Ensure your professional and clinical knowledge stays current within the hospice field.Analyze sales data to develop effective business strategies and territory-specific growth plans.Partner with the Regional Vice President to devise and execute market reputation and sales enhancement strategies.\nQualifications:Bachelor\u2019s degree in Marketing, Sales, or a related field is preferred.Proven experience in hospice, home health, healthcare sales, or community outreach.Exceptional communication skills, capable of effectively interacting with various stakeholders.Demonstrated leadership skills with a history of motivating a sales team.Comprehensive understanding o"}, {"resume_id": "30083943", "category": "SALES", "job_id": "3903484181", "job_title": "Senior Accountant, Property - Real Estate", "job_text": "Senior Accountant, Property - Real Estate. A real estate asset manager is searching for a Senior Accountant, Property to maintain and manage accurate financials for a portfolio of their properties. Reporting to the Head of Property Accounting, you\u2019ll support property and asset managers in reviewing and preparing monthly variance reports, and Tenant Billing reports. You\u2019ll also monitor the AR & AP process, and provide support for upcoming accounting projects. \nThe company has experienced huge amounts of growth over the past year and are in the process of scaling further. The Property Accounting team and overall company are extremely collaborative, and there\u2019s room for upward mobility/career advancement. \nNote this opportunity requires you to work a minimum of 3 days a week out of their Hoboken, NJ office location. GrubHub lunch provided to all employees on Tuesdays!\nDesired Experience:Minimum 3-5 years of property accounting - open to asset class. Stable backgrounds preferredUpbeat and positive attitude; willingness to learn/collaborate Strong use of Yardi, as well as Excel (i.e. V-lookups, Pivot tables, sum-ifs)\nHoxton Circle is an equal opportunity employer. We celebrate diversity and are committed to creating an inclusive environment for all employees."}, {"resume_id": "28005884", "category": "ENGINEERING", "job_id": "3889717585", "job_title": "Optical Network Documentation and Data Engineer, W", "job_text": "Optical Network Documentation and Data Engineer, W. Company:\n\nCogent Communications is a global, Tier 1 facilities-based ISP, consistently ranked as one of the top five networks in the world and is publicly traded on the NASDAQ Stock Market under the ticker symbol CCOI. Cogent specializes in providing businesses with high speed Internet access and Ethernet transport services. Cogent's facilities-based, all-optical IP network backbone provides IP services in over 216 markets globally. Since its inception, Cogent has unleashed the benefits of IP technology, building one of the largest and highest capacity IP networks in the world. This network enables Cogent to offer large bandwidth connections at highly competitive prices. Cogent also offers superior customer support by virtue of its end-to-end control of service delivery and network monitoring. A full benefits package takes effect within 30 days of employment. Matching 401k and stock options are also included.\n\nResponsibilities:\n\nDevelop and update logical network diagrams ( Visio drawings) and maps of metro and long-haul optical fiber networksMaintain database of optical network physical parameters ( span distances, loss, fiber provider, provider ID, etc.)Drive the collection of metro and long haul network dataProvide coordination between field managers, fiber acquisition team, NOC and Network planning as it pertains to documenting and verifying as-built drawings/documentationProvide hands-on technical expertise visually translating textual/geographical network configuration data into network diagrams and GIS coded mapsMaintain proficiency in up-to-date technological developments in Internet/telecommunications infrastructure, DWDM/CWDM optical fiber transport systems, and GIS systems\n\nQualifications:\n\nStrong proficiency in MS VisioStrong working knowledge of GIS systems, including familiarity with Google Earth ( .kmz), MS Streets & Trips, MapInfo, etc.Demonstrated ability to render optical fiber network drawings and mapsBasic understanding of DWDM/CWDM optical trans"}, {"resume_id": "16899268", "category": "INFORMATION-TECHNOLOGY", "job_id": "3895523533", "job_title": "Patient Service Representative/Scheduler - FT - Sun View", "job_text": "Patient Service Representative/Scheduler - FT - Sun View. Greets and checks patients in at the front desk as well as performing a variety of office duties including answering phones, entering data into the computer, verifying and filing insurance, scanning charts, processing requests for medical records, billing and accepting payments.\n\nHigh school graduate or GED\n\nPrior Healthcare Business Office Experience Preferred\n\nDemonstrated customer service skills\n\nExperience with Electronic Medical Records\n\nMedical terminology\n\nProficiency with MS Word and Excel"}, {"resume_id": "24083609", "category": "INFORMATION-TECHNOLOGY", "job_id": "3905251438", "job_title": "Merchandise Coordinator", "job_text": "Merchandise Coordinator. About SHEIN\nSHEIN Distribution Corporation distributes SHEIN's products in the U.S. Founded in 2012, SHEIN is a leading global online retailer with operations in Guangzhou, Singapore and Los Angeles, along with other key markets. SHEIN reaches consumers across more than 150 countries and regions around the world. We place a premium on choice, delivering more than 6,000 new fashion, beauty and lifestyle products daily with more than 600,000 items available. Our mission is to help people express their individuality through the latest trends that are accessible and affordable. To learn more about SHEIN, follow us @us.shein.com,sheingroup.com, Instagram.com/sheinofficial, Instagram.com/shein_us, youtube.com/shein.\n\nPosition Summary\nThe Merchandise Coordinator will be critical in supporting the day-to-day tasks of the Brand Product team. This entry level role requires a high level of organization and communication to keep the department running internally and cross-functionally and will be the key liaison between the Product team, China office, and LA marketing and studio teams. Key responsibility in high volume sample management with cross-functional departments to hit Brand milestones.\nJob Responsibilities\nTrack and coordinate samples between China office & LA office. Own the sample process from unpacking, logging, tagging, hanging, and purging.Organize all samples effectively and efficiently. Prepare samples for studio shoot days and post-shooting. Assist cross-functional teams who need to access physical samples.Manage communication between all cross-functional teams. Follow up daily with team(s).Set up and manage cross-functional calendar invites.Execute brand projects as directed by Sr Director or the GM of LA office.Work closely with LA marketing team and managing processes.Generate selling reports. Assist in creating weekly selling reports.Participate in product/merchandising special projects such as trend or social media recaps.Execute special department request"}, {"resume_id": "38314236", "category": "ENGINEERING", "job_id": "3895524038", "job_title": "Registered Nurse - RN - Rehab", "job_text": "Registered Nurse - RN - Rehab. Registered Nurse - RN - Rehab\nCareerStaff Unlimited - Montgomeryville, PA\n2024-02-29\nJob Attributes\nQualifications\nYears of Experience One Year\nCertifications RN\nJob Features\nShifts Evenings\nShift Length 8\nRegistered Nurse - RN - Rehab\n\nCareerStaff Unlimited is hiring a Registered Nurse for a full time contract opportunity in Montgomeryville, PA! Qualified candidates will have at least 1 years of recent SNF/LTC experience, and must be able to collaborate with the physician and healthcare team to facilitate and deliver patient care. This position is available immediately.\n\nHourly Pay: $47.75\n\nBENEFITS OF RN REGISTERED NURSE:\nImmediate openings24/7 Answering ServiceDay and Night shifts availableFlexible SchedulesCompetitive Compensation PackageWeekly with Direct DepositMedical, Dental and Vision InsuranceReferral Bonuses\n\nLICENSURE CREDENTIALS REQUIRED FOR THE RN REGISTERED NURSE:\nValid RN License in the state of practice1 year of LTAC or Acute Care experience within the last 2 years with strong Vent/Trach skillsMust be eligible to work in the United StatesBLS (Basic Life Support) American Heart Association approved for all unitsACLS approved for ER, ICU, TELE, and MS unitsStrong Vent/Trach Skills\n\nABOUT CAREERSTAFF UNLIMITED:\n\nCareerStaff Unlimited, LLC (\"CareerStaff\") is a leader in the delivery of workforce solutions and staffing services for the healthcare industry. Our mission is to connect our clients with talented healthcare professionals ensuring the delivery of exceptional patient care. We serve our mission by leveraging a national network 25+ offices throughout the United States. CareerStaff's services include travel and per diem employment opportunities for nurses, therapists and pharmacists.\n\nAdditionally, CareerStaff provides Managed Service Programs to hundreds of healthcare facilities nationally. By offering unparalleled customer service, unique placement opportunities, top pay and benefits and employment that meets the lifestyle requirements of our cli"}, {"resume_id": "22319662", "category": "SALES", "job_id": "3901365654", "job_title": "Pharmacy Technician - Hospital Inpatient FT", "job_text": "Pharmacy Technician - Hospital Inpatient FT. Employment Type\n\nFull time\n\nShift\n\nRotating Shift\n\nDescription\n\nCome join our Pharmacy team at Johnson Memorial Hospital, a member of Trinity Health Of New England!\n\n**Sign On Bonus $3500 for new colleague**\n\nPosition Purpose\n\nTo support pharmacists in all aspects of pharmacy activities. This includes maintaining automated dispensing machines (ADMs) stock levels. Packages and distributes drugs and sterile products. Dispenses controlled drugs with supervision of a pharmacist to anesthetists, and for delivery to ADM machines\n\nWhat You Will Do\n\nMaintain automated dispensing machines (ADMs) stock levels by loading and refilling medications including narcotics for all in-patientsAnswer telephones, assist nurses trouble-shooting ADM questions and drawer maintenanceDispense controlled drugs with supervision of a pharmacist to anesthetists, and for delivery to ADM machines. May include but not limited to preparing IV admixtures, solutions, and other sterile products and chemotherapyInspect assigned nursing units for proper drug storage, stability and expiration dates as well as maintaining proper drug reliability in the pharmacy\n\nMinimum Qualifications\n\nMinimum high school graduate or equivalent. Completion of a hospital-based, community college or military technician training program preferableNational certification by the Pharmacy Technician Certification Board (PTCB)--if not already obtained-- is required within 1 year of Date of HireCT Pharmacy Technician state registration must be current; or registration as a Pharmacy Intern and actively enrolled in a school of pharmacy program.Hospital or retail pharmacy experience preferred\n\nPosition Highlights And Benefits\n\nFull time 40hrs on days, rotating schedule-- weekend differentials apply!**Sign On Bonus $3500 for new colleague**Excellent benefits starting day 1\n\nMinistry/Facility Information\n\nJohnson Memorial Hospital and Home & Community Health Services provide a continuum of health care services to those living and workin"}, {"resume_id": "24083609", "category": "INFORMATION-TECHNOLOGY", "job_id": "3903451024", "job_title": "Data Engineer (TS/SCI,Python,Elasticsearch) Full Time", "job_text": "Data Engineer (TS/SCI,Python,Elasticsearch) Full Time. Job Title: Data EngineerLocations: Beavercreek, OH, US , Dayton, OH, US ,Ohio City, OH 45874, USType- Full Time / Onsite role Required- TS/SCI clearance\nRole DescriptionThe Data Engineer will be responsible for tasks such as data engineering, data modeling, Extract Transform Load (ETL), data warehousing, and data analytics. They will collaborate with cross-functional teams to design, build, and maintain data pipelines, data systems,and data solutions to support business needs and drive insights.\nQualificationsRaw data and PED systems support Requests for Information (RFI), rapid scripting, process improvement, technique discovery, and validation of raw data.Experience in designing, building, and maintaining data pipelines and data systemsStrong problem-solving and analytical skillsProficiency in Python programming and ElasticsearchExperience with data integration and data manipulationExperience with cloud-based data platformsTS/SCI clearance is requiredPIR raw data processing and analysis techniques\nEducationBachelor-level degree in a STEM field and at least 5 years of related experience\n"}, {"resume_id": "33685988", "category": "FINANCE", "job_id": "3901157652", "job_title": "US Experienced Financial Advisor", "job_text": "US Experienced Financial Advisor. We're Bullish About Your Future Here.\n\nYour experience is va <script>
const RAW = JSON.parse(document.getElementById('labeling-data').textContent);
const PAIRS = RAW.pairs;
const RESUMES = RAW.resumesById;

let idx = 0;
let labels = {}; // key: resume_id_job_id -> 0/1
let history = []; // stack of idx values for undo
let expandedResume = false;
let expandedJob = false;

const root = document.getElementById('root');

function keyOf(p){ return p.resume_id + '_' + p.job_id; }

function render(){
  if (idx >= PAIRS.length){ renderDone(); return; }
  const p = PAIRS[idx];
  const resumeText = RESUMES[p.resume_id] || '';
  const resumeShort = resumeText.slice(0, 500);
  const resumeShow = expandedResume ? resumeText : resumeShort + (resumeText.length > 500 ? '…' : '');
  const jobText = p.job_text || '';
  const jobShort = jobText.slice(0, 600);
  const jobShow = expandedJob ? jobText : jobShort + (jobText.length > 600 ? '…' : '');
  const pct = Math.round((idx / PAIRS.length) * 100);

  root.innerHTML = `
    <div class="app">
      <div class="topbar">
        <div class="title">Eval Labeling</div>
        <div class="counter"><b>${idx + 1}</b> / ${PAIRS.length}</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

      <div class="card">
        <div class="cat-row">
          <span class="cat-badge">${p.category}</span>
          <span class="pair-id">#${p.resume_id} × #${p.job_id}</span>
        </div>
        <div class="section">
          <div class="section-label">
            <span>Candidate Resume</span>
            ${resumeText.length > 500 ? `<button class="expand-btn" id="expandResumeBtn">${expandedResume ? 'show less' : 'show full'}</button>` : ''}
          </div>
          <div class="section-body">${escapeHtml(resumeShow)}</div>
        </div>
        <div class="section">
          <div class="section-label">
            <span>Job Posting</span>
            ${jobText.length > 600 ? `<button class="expand-btn" id="expandJobBtn">${expandedJob ? 'show less' : 'show full'}</button>` : ''}
          </div>
          <div class="section-body job">${escapeHtml(jobShow)}</div>
        </div>
        <div class="actions">
          <button class="btn btn-no" id="noBtn">✕ Not Relevant <kbd>← / N</kbd></button>
          <button class="btn btn-yes" id="yesBtn">✓ Relevant <kbd>→ / Y</kbd></button>
        </div>
      </div>

      <div class="footer-row">
        <button class="undo-btn" id="undoBtn" ${history.length === 0 ? 'disabled' : ''}>← undo last</button>
        <span class="hint">arrow keys or Y/N to label fast</span>
      </div>
    </div>
  `;

  document.getElementById('noBtn').onclick = () => choose(0);
  document.getElementById('yesBtn').onclick = () => choose(1);
  document.getElementById('undoBtn').onclick = undo;
  const erb = document.getElementById('expandResumeBtn');
  if (erb) erb.onclick = () => { expandedResume = !expandedResume; render(); };
  const ejb = document.getElementById('expandJobBtn');
  if (ejb) ejb.onclick = () => { expandedJob = !expandedJob; render(); };
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function choose(val){
  const p = PAIRS[idx];
  labels[keyOf(p)] = val;
  history.push(idx);
  idx++;
  expandedResume = false;
  expandedJob = false;
  render();
}

function undo(){
  if (history.length === 0) return;
  idx = history.pop();
  const p = PAIRS[idx];
  delete labels[keyOf(p)];
  expandedResume = false;
  expandedJob = false;
  render();
}

function renderDone(){
  const total = PAIRS.length;
  const yesCount = Object.values(labels).filter(v => v === 1).length;
  const noCount = Object.values(labels).filter(v => v === 0).length;
  root.innerHTML = `
    <div class="app">
      <div class="done-screen">
        <h2>All ${total} pairs labeled 🎉</h2>
        <p>Download the CSV and send it back — training/eval comparison comes next.</p>
        <div class="stat-row">
          <div class="stat yes"><span class="num">${yesCount}</span><span class="lbl">Relevant</span></div>
          <div class="stat no"><span class="num">${noCount}</span><span class="lbl">Not Relevant</span></div>
        </div>
        <button class="download-btn" id="downloadBtn">Download labeled_eval.csv</button>
        <div class="warn">this downloads all your labels as a CSV file</div>
      </div>
    </div>
  `;
  document.getElementById('downloadBtn').onclick = downloadCsv;
}

function downloadCsv(){
  let rows = [['resume_id','category','job_id','job_title','human_label']];
  PAIRS.forEach(p => {
    const k = keyOf(p);
    if (k in labels){
      rows.push([p.resume_id, p.category, p.job_id, '"' + p.job_title.replace(/"/g,'""') + '"', labels[k]]);
    }
  });
  const csv = rows.map(r => r.join(',')).join('\\n');
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'labeled_eval.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.addEventListener('keydown', (e) => {
  if (idx >= PAIRS.length) return;
  if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'y'){ choose(1); }
  else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'n'){ choose(0); }
  else if (e.key === 'Backspace'){ undo(); }
});

render();
</script>
</body>
</html>
