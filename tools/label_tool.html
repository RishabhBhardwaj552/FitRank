 Facilitates the execution of appropriate BC/DR security principles into the physical facilities.\u2022 Supports enterprise "}, {"resume_id": "31677347", "category": "ENGINEERING", "job_id": "3898155848", "job_title": "Manufacturing Engineer", "job_text": "Manufacturing Engineer. Job Title: Manufacturing EngineerLocation: Weirton, WV (Onsite)Client : Saraca/ Confidential Company DescriptionSARACA is a Global IT and engineering R&D service company working with 25+ Fortune 1000 companies across the world. SARACA delivers engineering solutions and has achieved a remarkable 90% of repeat business from satisfied customers while growing YoY at 300%. The organization has a technically competent team of 250 engineers and management consultants delivering impeccable results onsite and offsite. SARACA's core industries include Medical Device and Pharma, Aerospace, Rail Transport and Automotive, and Semiconductor and Communication. SARACA is an equal-opportunity employer with a work culture filled with innovation and learning.  Job Description:Own the build, purchase, and/or deployment of manufacturing workstations and equipment ranging from initial manual benchtop stations to highly automated systems.You are responsible for designing and deploying your manufacturing lines. From concept to hand over to operations.The engineers will support equipment commissioning, validation and drive the hand over process to operations.the engineers will support manufacturing line design, RFPs, vendor engagement and equipment integration to the factoryThe engineers will support equipment design, industrial studies and support purchasing equipment.The engineers will support equipment installation, working closely with the tool install team & facilities team.Partner with the product design team to drive Design For Manufacturing (DFM) considerations.Design and document robust processes/standard operating procedures capable of a high level of safety, uptime, and qualityAssist in the debug and resolution of time-sensitive issues with manufacturing equipment and processes as they ariseTrain individuals on new manufacturing equipment and processesWork with a diversity of teams inside and outside the company to achieve overall manufacturing successExperience on Factory layout"}, {"resume_id": "93988900", "category": "HEALTHCARE", "job_id": "3885854671", "job_title": "Accounting Coordinator", "job_text": "Accounting Coordinator. About The Company\n\nAre you seeking a rewarding career opportunity with a leading service organization in the Orlando market? Our client is looking to hire an Accounting Coordinator to join their growing accounting and finance team. With significant opportunities for growth and advancement within the department, our company fosters a team-oriented culture. It equips employees with the tools and training necessary to excel in their roles.\n\nResponsibilities Of The Accounting Coordinator\n\nAs an Accounting Coordinator, you will play a pivotal role in managing financial operations and ensuring the accuracy and integrity of our financial transactions. Your responsibilities will include:\n\nCredit Cards and ACH: Manage, monitor, and reconcile credit cards and ACH transactions, fostering financial transparency and accuracy. Vendor Payments and Expense Reports: Handle vendor payments and expense reports, contributing to accurate financial management. Vendor Communication: Communicate with vendors, facilitate conversions, and manage payments, maintaining strong vendor relationships. Internal Communication: Collaborate internally within the department and the treasury team, ensuring adequate financial coordination. Month-End Close: Process month-end close activities, including handling utility accruals and bill payments and contributing to accurate financial reporting. \n\nExperience Preferred For Accounting Coordinator\n\nTo excel in this role as an Accounting Coordinator, you should possess the following qualifications:\n\nExperience: At least 3+ years of experience in Accounting Coordinator and reconciliation, showcasing your expertise in financial transactions and management. Full Cycle Accounting: Knowledge of full-cycle accounting is a significant advantage, reflecting your comprehensive understanding of financial processes. Education: A Bachelor's degree in accounting or finance is a MUST, reflecting your academic foundation in financial management. Excel Skills: Proficiency in "}, {"resume_id": "85417107", "category": "HEALTHCARE", "job_id": "3904718774", "job_title": "Registered Nurse, Home Health Full Time", "job_text": "Registered Nurse, Home Health Full Time. Become a part of our caring community and help us put health first\n\n\"Company car provided with this position\"\n\nAs a Home Health Registered Nurse, You Will\n\nProvide admission, case management, and follow-up skilled nursing visits for home health patients.\n\nAdminister on-going care and case management for each patient, provide necessary follow-up as directed by the Clinical Manager.\n\nConfer with physician in developing the initial plan of treatment based on physician's orders and initial patient assessment. Provide hands-on care, management and evaluation of the care plan and teaching of the patient in accordance with physician orders, under Clinical Manager's supervision. Revise plan in consultation with physician based on ongoing assessments and as required by policy/regulation.\n\nCoordinate appropriate care, encompassing various healthcare personnel (such as Physical Therapists, Occupational Therapists, Home Health Aides and external providers).\n\nReport patient care/condition/progress to patient's physician and Clinical Manager on a continuous basis.\n\nImplement patient care plan in conjunction with patient and family to assist them in achieving optimal resolution of needs/problems.\n\nCoordinate/oversee/supervise the work of Home Health Aides, Certified Home Health Aides and Personal Care Workers and provides written personal care instructions/care plan that reflect current plan of care. Monitor the appropriate completion of documentation by home health aides/personal care workers as part of the supervisory/leadership responsibility.\n\nDischarge patients after consultation with the physician and Clinical Manager, preparing and completing needed clinical documentation.\n\nPrepare appropriate medical documentation on all patients, including any case conferences, patient contacts, medication order changes, re-certifications, progress updates, and care plan changes. Prepare visit/shift reports, updates/summarizes patient records, and confers with other health care discipline"}, {"resume_id": "28198029", "category": "SALES", "job_id": "3895804200", "job_title": "COMMERCIAL PLUMBER \u2013 SERVICE TECHNICIAN", "job_text": "COMMERCIAL PLUMBER \u2013 SERVICE TECHNICIAN. Commercial Plumber - Service Technician\n\nBurlington, NC\n\n \n\nFor more than 40 years, MaintenX has been expertly serving multi-location retail stores, restaurant chains and Fortune 500 companies nationwide. As one of the largest national self-performing facility maintenance and repair companies in the U.S., MaintenX has created a wide network of knowledgeable and professional technicians throughout the country!\n\n \n\n24/7 MaintenX. We keep business running!\" Curb to Roof. Coast to Coast. Self-Performing.\n\n \n\nWe are looking for an experienced Commercial Plumber Service Technician to join our maintenance service technician team. As a Commercial Plumber Service Technician, you will perform the role of a plumbing generalist responsible for diagnosing, repairing and installing plumbing fixtures for our commercial clients. In this critical role, the Commercial Plumber Service Technician will be trusted to use their experience and plumbing knowledge to make judgment calls in the field, ensuring that the customer's facility maintenance problem is quickly and efficiently resolved.\n\n \n\n\nAt MaintenX, our customers rely on us to keep their business running, our service technicians are an integral part of ensuring that we meet and exceed this expectation.\n\n \n\nJob Responsibilities:\n\nOur Commercial Plumber Service Technicians are responsible for assembling, installing, or soldering pipe, fittings, or plumbing fixtures of heating, water, or drainage systems, according to specifications or plumbing codes.\n\nCommunicating with customers upon arrival and completion of work, ensuring customer satisfaction with service\n\n\n Familiar with and ability to use smart phones and tablets for compiling job information (before and after photos, service notes, quoting, etc.)\n Assemble and install valves and fittings\n Install, repair, and maintain sinks and toilets\n Install, repair, and maintain water heaters (gas and/or electric)\n Install, repair, and maintain water coolers/fountains\n Lift Station maint"}, {"resume_id": "30083943", "category": "SALES", "job_id": "3888000689", "job_title": "Pro Territory Sales Manager", "job_text": "Pro Territory Sales Manager. Drives consistent year-over-year sales growth, seeking opportunities to expand the influence of Lowe's Pro Sales to capitalize on market and territory opportunities by leading a team of outside sales representatives through coaching, teaching and developing functional selling skills Drive assigned sales team to achieve portfolio financial goals for assigned customers.  Lead, engage and inspire a team of outside sales professionals to reach their highest potential.  Demonstrate and execute consistent sales coaching behaviors.  Monitor team activities and customer accounts through CRM management.  Attract, recruit, select, develop and retain outside sales professionals Monitor progress toward goals for all success metrics.  Conduct portfolio reviews/updates along with joint sales calls to observe sales interactions and provide feedback.  Collaborate with outside sales professionals to develop and execute effective sales strategies  reporting, and alerting across security levels to significantly reduce operational risk and accelerate the timeline for turning raw data into actionable intelligence.  The successful candidate: \u00b7 10+ years in selling on prem, cloud, or hybrid software solutions / products to Federal Civilian Agencies with at least 5 years specifically with DHS and has active contacts / portfolios in these markets. \u00b7 Is an experienced software seller with a proven history of achieving results, you are motivated by your personal success and financial gain. \u00b7 Proven ability to identify and develop sales opportunities and establish a rapport and a pathway to building yourself as a trusted advisor. Must have a \u201chunter\u201d mentality and work well in closing deals from beginning to end. \u00b7 Deep understanding of Federal mission enablers and how to engage multiple stakeholders to drive urgency and align with available budgets. \u00b7 Able to operate as a utility player in a stable, cash rich, well established, VC backed start-up. \u00b7 Energized by getting in during the early stages with unlimited earning potential.  About The Role: In this role you will be helping our customer grow its presence and adoption in DHS and the Federal Civilian Agency market and building on a strong foundation that has been cultivated. We will look to you to"}, {"resume_id": "85417107", "category": "HEALTHCARE", "job_id": "3903848547", "job_title": "Learning Experience Designer/Developer II", "job_text": "Learning Experience Designer/Developer II. Primary Talent Partners has an exciting remote opportunity with a client of ours. This is a contract position with a duration of 6 months and an opportunity for extension or conversion. No C2C candidates will be considered.\n\nPay Rate: $45/hr\n\nSchedule: fully remote, M to F, normal business hours\n\nDescription\n\nDevelop comprehensive and effective instructional designs and storyboards specifically designed for the company's learning modules.Utilize adult learning principles and strategies to ensure content is engaging and learner-centric, specifically within the context of the company.Create interactive and visually appealing eLearning content using tools such as Articulate Storyline, tailored to the compnay's specific requirements.Incorporate multimedia elements, simulations, and other interactive components to enhance the learning experience for the company's employees.Develop training guides, job aids, facilitator guides, and assessments that align with the company's specific learning objectives and support different learning styles.Ensure consistency and accuracy across all training materials tailored to the company's unique needs.Produce engaging videos to supplement the company's learning materials, utilizing video authoring tools and Adobe Creative Cloud applications.Edit and enhance multimedia content specifically for the company to optimize impact and educational value.Manage multiple of the company's projects simultaneously, ensuring timely delivery of high-quality learning solutions.Collaborate with cross-functional teams and the company's stakeholders to gather requirements and feedback for successful project execution.Provide train-the-trainer sessions specifically designed to equip the company's facilitators with the necessary skills to deliver training effectively.Support company trainers in understanding and implementing adult learning strategies within the organization's context.Conduct regular reviews and evaluations of learning materials tailored to "}, {"resume_id": "29149998", "category": "HR", "job_id": "3901377050", "job_title": "Senior Property Accountant ", "job_text": "Senior Property Accountant . Senior Property AccountantDirect Hire*MUST live in the Atlanta area The Intersect Group is seeking a Senior Property Accountant to join an impressive and rapidly growing real estate organization. If you're seeking an organization with a startup feel and an amazing culture - apply today! Primary Responsibilities:Manage monthly and annual close activities; income statements, balance sheets, and cash account reconciliationsOversee payroll, AP, ARAssist with Annual budget Support audits, tax returns and ad hoc projectsMaintain financial reporting compliance  Required Skills:Bachelors Degree, Accounting 5+ years of property accounting experienceSingle family or multifamily accounting experienceSolid understanding of GAAPCPA track Natural problem solverAbility to take initiative High-lever achiever  Preferred Skills:Yardi Public accounting"}, {"resume_id": "28198029", "category": "SALES", "job_id": "3906082457", "job_title": "Field Supervisor", "job_text": "Field Supervisor. Allied Universal\u00ae, North America\u2019s leading security and facility services company, provides rewarding careers that give you a sense of purpose. While working in a dynamic, diverse and inclusive workplace, you will be part of a team that fuels a culture that will reflect in our communities and customers we serve. We offer medical, dental and vision coverage, life insurance, retirement plan, employee assistance programs, company discounts, perks and more for most full-time positions!\n\nAllied Universal is currently hiring a Field Supervisor (FS) to support operations for remotely managed accounts by performing on-site supervision of Security Professionals (SPs) and ensuring site coverage at all times. FSs work closely with Operations Managers on a day-to-day basis to supervise remote service delivery.\n\nResponsibilities\n\nPerform day / night site visits to inspect & supervise SPs in fieldAddress escalation of \"after hours\" & \"cold start\" calls to ensure sufficient coverage at customer sitesWork with Operations Managers to coach, counsel, discipline, train, and manage relationships with SPsA Field Supervisor (FS) supports operations for remotely managed accounts by performing on-site supervision of Security Professionals (SPs) and ensuring site coverage at all times. FSs work closely with Operations Managers on a day-to-day basis to supervise remote service delivery.Responsible for visiting assigned post locations on a regular basis (specific schedule varies) to monitor performance, address daily operations issues, communicate policy changes or company information, adjust staffing schedules as needed, and make post inspections to ensure professional image (including the hygiene and uniform appropriateness of officers) and quality standards are being maintainedPost inspections also include checking that Post Order manual and all other post and training information is being properly maintained and updated, and that the Post is being properly maintained, cleaned and organize"}, {"resume_id": "38314236", "category": "ENGINEERING", "job_id": "3905295226", "job_title": "Industrial Engineer / Process Engineer - Packaging and Containers Manufacturing", "job_text": "Industrial Engineer / Process Engineer - Packaging and Containers Manufacturing. Job Title: Industrial Engineer / Process Engineer / Manufacturing Engineer - Packaging and Containers ManufacturingLocations: Huntley, ILDuration: Full Time, Permanent & Onsite\nJob DescriptionESSENTIAL JOB TASKS:\nOversees and assesses existing business and operational processes and workflows with a goal of improving productivity and efficiency and eliminating wasteCollaborates with all departments to implement changes to processes and ensure buy-inOptimizes productivity by developing, implementing, and testing new procedures that result in documentation of processes, procedures, work instructions, standardized work instructions, and related formsAssembles reports documenting process status and changesIdentifies metrics that are leading indicators of future performance, and implement opportunities for improvement while tracking metric trends and shiftsCommunicates findings, proposals, and implemented solutions to upper managementFocus on production, business, and management processes to support profitability, customer service, and product qualityProvides thorough instructions for the successful implementation of process changesIdentifies best practices and deploys those practices across all manufacturer sitesConducts risk assessments via PFMEA and DFMEA toolsAssesses compliance with applicable safety and quality standardsContributes to departmental efforts by accomplishing related tasks as neededIdentify training needs and conduct proper trainingHelps develop training material for all new and updated processes \nQUALIFICATIONS AND EDUCATION REQUIREMENTS:\nBachelor\u2019s degree in Industrial Engineering, or other Engineering related field.Lean, Lean Six Sigma, and Theory of Constraints Certifications are preferred.Experience in ManufacturingExperience in leading multi-site activitiesPrevious experience in quality or business process engineering KNOWLEDGE, SKILLS AND ABILITIES:\nExcellent analytical and math skillsStrong written and verbal communication skillsAbility to persu"}, {"resume_id": "17108676", "category": "ENGINEERING", "job_id": "3905332034", "job_title": "Assistant Store Manager", "job_text": "Assistant Store Manager. Location\n\nAL - Spanish Fort - Eastern Shore - 2186\n\nClassification\n\nFull-Time\n\nJob Summary\n\nAs an assistant store manager (ASM), you enjoy working with people, are energized by your passion for books and model excellent service every day. As the deputy to the store manager (SM), you focus on the look and consistent presentation of our stores, empowered to make decisions ensuring the shopping experience for our customers is to their satisfaction. You communicate consistently with your SM on your ideas to ensure this experience and drive this through our people, actively participating in bookseller development. In your role, you ensure sales and profit through your ability to leverage resources which results in booksellers who can provide first-class service to our customers. As a leader, you work collaboratively with the team to ensure a store where booksellers are engaged doing what they love: talking about and selling books.\n\nWhat You Do\n\n Ensure consistent, friendly and informed service to customers, first by the example you set and second by the training and delivery of first-class service by the store team. Ensure a vibrant bookstore through the flawless execution of bookstore basics. Assess the store from the customer\u2019s perspective and use insight to seek and influence improvement with the SM. Model handselling skills to drive successful campaigns such as Our Monthly Picks, preorders, etc., to establish book prowess and drive sales. Develop the bookselling team through engagement and coaching; work with team by providing feedback to assess and focus on individual strengths and recommend talent for development in the store. Ensure the achievement of sales goals and deliver operational excellence to maximize efficiency and minimize loss through timely execution of all processes. Ensure compliance to company standards as it pertains to safety, customer communications and all store operations. Communicate with your store team respectfully and with urgency on key is"}, {"resume_id": "29149998", "category": "HR", "job_id": "3904501432", "job_title": "Head, Talent Acquisition \u2013CCO, CPO, SSGA & Global Markets - MD", "job_text": "Head, Talent Acquisition \u2013CCO, CPO, SSGA & Global Markets - MD. Who We Are Looking For\n\nState Street is looking for a dynamic and experienced Head of Talent Acquisition to lead the experienced hiring \u2013 (Sr. Associate to Executive Vice President levels) efforts for our revenue generating business groups \u2013 the Chief Commercial Officer, Chief Product Officer, SSGA and the Global Markets businesses. This role will lead a global team of recruiting, sourcing and interview coordination specialists based on productivity metrics with full cycle responsibility for managing the entire process of experienced hires for these business lines globally including delivering on the inclusion and diversity mandates. They would partner with the Sr.HR Business Partners and their senior business leadership teams to set global functional priorities and lead the execution efforts.\n\nWhile this role has been advertised to be Boston based and reports to the Head of Global Talent Acquisition, we are location agnostic with the final placement of the role within the Global footprint of the Company.\n\nWhy This Role Is Important To Us\n\nThis critical leadership role is responsible for leading the recruitment function for our client facing and revenue generating teams and ensuring a consistent, effective, client centric and compliant approach that is closely aligned with the strategic priorities of these business and enables them to meet their needs, inclusion and diversity goals. Investment Services brings together our client segments through the Chief Commercial Officer role, the design and deployment of product capabilities through the Chief Product Officer role. SSGA is the investment management division of the firm that creates and manages investment strategies for our clients around the world. The Global Markets division supports the balance sheet business with products and services across FX trading and Sales, Securities Lending and transition management. Collectively, these divisions drive the entire wallet share and revenue for State Street.\n\nRole Respons"}, {"resume_id": "24854026", "category": "FINANCE", "job_id": "3889156478", "job_title": "Pharmacist (Full or Part Time)", "job_text": "Pharmacist (Full or Part Time). Job Objectives\n\nProvides pharmacy consulting services with empathy to patients regarding the effective usage of medications and awareness with drug interactions. Offers preventive and clinical healthcare services, including immunizations, diagnostic testing, and patient outcomes services. Responsible for ensuring the proper compounding, dispensation, review, and verification of prescribed medications within regulatory guidelines, company policies and procedures. Supports the efficient workflow of the pharmacy and assists the pharmacy manager in identifying ways to optimize pharmacy financials, inventory management and enhance patient experience.\n\nJob Responsibilities/Tasks\n\nPatient Experience\n\nEngages patients by greeting them and offering assistance with products and services. Resolves patient issues in a timely manner and answers questions to ensure a positive patient experience.Models and shares customer service best practices with all team members to deliver a distinctive and joyful experience, including interpersonal habits that show care (e.g., greeting, eye contact, courtesy, etc.) and Walgreens service traits (e.g., demonstrating curiosity to identify needs and proactively helping, servicing until satisfied, championing empathy and inclusivity, etc.).Connects with patients by anticipating needs and proactively offering services. Supports efforts on enhancing patient experience by increasing awareness of healthcare services offered through Walgreens (e.g., patient consultation, medication management, drug therapy reviews, and perform clinical, or wellness services such as immunizations, diagnostic testing, and patient outcomes services) thereby promoting the shift of the Walgreens pharmacy role from transactional to interpersonal.Participates and assists in events that reflect the unique communities we serve as requested by Store Manager, Healthcare Supervisor, District Manager or Pharmacy Manager.\n\nOperations\n\nCounsels' patients and answers their questions r"}, {"resume_id": "16877897", "category": "HR", "job_id": "3904360730", "job_title": "Intelligent Data Capture Engineer", "job_text": "Intelligent Data Capture Engineer. Company Overview: Join a dynamic and innovative technology and consulting company dedicated to revolutionizing business processes through cutting-edge solutions. At Initium SoftWorks we specialize in providing tailored automation solutions to a diverse range of industries, leveraging the latest advancements in Intelligent Data Capture technology. As an ABBYY FlexiCapture/Vantage Software Engineer, you will play a pivotal role in designing, developing, and implementing state-of-the-art solutions that empower our clients to streamline their document and data-centric processes effectively. \nPosition Overview: We are seeking a talented and versatile Intelligent Data Capture Engineer with expertise in ABBYY FlexiCapture and ABBYY Vantage. The ideal candidate will have a passion for leveraging technology to solve complex business challenges and possess the ability to design and deliver customized solutions tailored to client needs. \nKey Responsibilities: Collaborate with clients to understand their business requirements and document processing workflows. Design and implement intelligent data capture solutions using ABBYY FlexiCapture and ABBYY Vantage to automate document classification, data extraction, and validation processes. Develop and optimize SQL queries and stored procedures to support data extraction and integration with client systems. Create custom scripts and extensions in C# to enhance the functionality and performance of ABBYY FlexiCapture and ABBYY Vantage solutions. Configure and deploy ABBYY FlexiCapture projects, including defining document types, extraction rules, and validation criteria. Integrate ABBYY FlexiCapture and ABBYY Vantage solutions with existing client applications and systems, ensuring seamless data exchange and workflow integration. Conduct thorough testing and quality assurance to ensure the accuracy, reliability, and performance of intelligent data capture solutions. Provide technical expertise and support to project teams and clients "}, {"resume_id": "10553553", "category": "INFORMATION-TECHNOLOGY", "job_id": "3887878862", "job_title": "Director, Software Engineering", "job_text": "Director, Software Engineering. The Director of Software Engineering at FloQast will oversee multiple software engineering teams tasked with designing and implementing features and functionalities to scale and enhance our B2B SaaS products and platforms. Beyond technical expertise, we seek a visionary leader adept at fostering cross-functional collaboration across all facets of the organization to deliver value to our customers. This pivotal role demands a seasoned product engineering executive with a comprehensive understanding of software product development. The successful candidate will adeptly navigate the intersection of people management, leadership, product development, and technical prowess. Moreover, they will play a critical role in team expansion by spearheading recruitment efforts, mentoring current staff, and cultivating a culture of innovation within the engineering department. Collaboration is paramount, as the Director of Software Engineering will work closely with internal teams, directors, managers, and senior leadership to champion an ethos of engineering excellence.\n\nFloQast is headquartered in Los Angeles, CA and we are seeking US Based REMOTE Engineers.\n\nVisa sponsorship is NOT available at this time\n\nWhat You'll Do\n\nWork closely with product, design, and engineering teams to develop and ship new and existing products to the delight of our customersWork cross-functionally with all departments (product, sales, marketing, customer success, HR, recruiting, finance, etc.) to help lead the product-to-customer journeyLead, manage, mentor, and develop teams of managers, software engineers, and quality engineers to grow your team members\u2019 career paths.Recruit, hire, and retain software engineering staff by participating in recruiting and interview effortsWork with other engineering leaders to continuously invest in and improve the engineering department processes, practices, and culture. Advocate for software product quality and delivery by promoting automated testing, CI/CD, DevOps"}, {"resume_id": "29149998", "category": "HR", "job_id": "3904432418", "job_title": "Licensed Skin Esthetician", "job_text": "Licensed Skin Esthetician. Job Description\n\nSUMMARY/JOB PURPOSE:\n\nWork as an integral part of our client\u2019s in-store Sephora Team representing their brand to the highest standard during events. Introduce Sephora shoppers to this skincare brand\u2019s products by performing personalized Professional Skin Treatments on sales floor and converting service results to product purchase. Provide customer education and recommendations via FaceMapping/approved skin analysis and product demonstrations, meeting all retail and service goals.\n\nEssential Duties And Responsibilities\n\nPerforms personalized skincare treatments in the allotted time following the approved brand protocols, ensuring each interaction leads to the designated retail goalIncorporate nano infusion skin treatments using the brand\u2019s new skincare technology in events, following the brand approved protocolsEducate clients on skin care needs by performing skin analysis and product demonstrationsEducate and inspire Sephora customers to learn more about their personal skincare needs and build brand trust for their brand with each client interactionConvert color clients to skin care purchases through focused education and service applications.Follow consultation guidelines, ensuring clients complete the legal waiver prior to receipt of service treatmentsMaintain and increase knowledge of our client\u2019s product line and treatments by completing all allocated training plans and utilizing provided online resourcesEnsure our client and Sephora company policies and code of conduct are adhered toMaintain a clean, hygienic, organized and professional treatment area\n\nThe above typical duties are characteristic of this job and are not intended to list or limit the duties which may be required or assigned to employees in the classification.\n\nQualification Requirements\n\nTo perform this job successfully, an individual must be able to perform each essential duty satisfactorily. The requirements listed below are representative of the knowledge, skill and/or ability"}, {"resume_id": "10553553", "category": "INFORMATION-TECHNOLOGY", "job_id": "3902324315", "job_title": "PT Produce Sales Associate", "job_text": "PT Produce Sales Associate. Address: USA-NC-Franklinton-33801 Ushwy 1 At Janice Ave\n\nStore Code: Store 01421 Produce/Perishable (7223583)\n\nFood Lion has been providing an easy, fresh and affordable shopping experience to the communities we serve since 1957. Today, our 82,000 associates serve more than 10 million customers a week across 10 Southeastern and Mid-Atlantic states.\n\nPrimary Purpose\n\nProvide quality customer service within the Produce Department. Responsible for maintaining standards in accordance with the standard practice manual, maximizing sales through excellent customer service and minimizing shrink through proper utilization of standard practice.\n\nDuties And Responsibilities\n\n Maintain an atmosphere of enthusiastic customer awareness with primary emphasis on fast, friendly, and accurate customer service to create a positive shopping experience Courteous and helpful to other associates Ensure that ordering, receiving, preparation, conditioning and displaying of merchandise is done in accordance with policies and guidelines Unload trucks for the Produce Department Understand and use company tools such as; average cost inventory system (ACIS) and ordering (CAO) Maintain a complete understanding of and adherence to company guidelines, policies and standard practice Understand and follow Food Safety and Workplace Safety guidelines and procedures Observe and correct all unsafe conditions that could cause associate or customer accidents Report all associate and customer accidents in accordance with established Food Lion procedures to the Manager on Duty Ensure compliance with local, state and federal regulations Wear the Food Lion uniform with apron, complete with name badge, when on duty, has a neat and clean appearance while adhering to the Food Lion dress code Successfully complete Computer Based Training (CBT), Training Packet and Training Aid courses Perform all other duties as assigned\n\nQualifications\n\n High school graduate or equivalent preferred Excellent interpersonal, organi"}, {"resume_id": "22319662", "category": "SALES", "job_id": "3895811390", "job_title": "Sales Associate", "job_text": "Sales Associate. Overview\n\nAbout Express, Inc.\n\nExpress, Inc. is a multi-brand fashion retailer whose portfolio includes Express, Bonobos and UpWest. The Company operates an omnichannel platform as well as physical and online stores. Grounded in a belief that style, quality and value should all be found in one place, Express is a brand with a purpose - We Create Confidence. We Inspire Self-Expression. - powered by a styling community. Bonobos is a menswear brand known for exceptional fit and an innovative retail model. UpWest is an apparel, accessories and home goods brand with a purpose to Provide Comfort for People & Planet.\n\nThe Company has over 530 Express retail and Express Factory Outlet stores in the United States and Puerto Rico, the Express.com online store and the Express mobile app; over 60 Bonobos Guideshop locations and the Bonobos.com online store; and 13 UpWest retail stores and the UpWest.com online store. Express, Inc. is traded on the NYSE under the symbol EXPR. For more information about our Company, please vis it www.express.com/investor and for more information about our brands, please visit www.express.com , www.bonobos.com or www.upwest.com .\n\n Store Name \n\nLa Plaza\n\nResponsibilities\n\n Express is seeking a Retail Sales Associate to join our team . \n\nThe Sales Associate is responsible for p roviding a great in-store shopping experience for our retail customers w hile assi stin g with addit iona l tasks such as stocking, cleaning, folding merchandise, etc.\n\n\u202f\n\nKey Responsibilities\n\n Maintain a clean and organized sales floor, checkout, fitting room, and stock room to ensure the store is safe and inviting to customers.  Follow company policies and procedures to ensure the safety of all our associates and customers.  Assist with product launch changes according to company SOP.  Provide a Great Customer Experience  Deliver on all aspects of the customer experience model.  Process transactions quickly and accurately reducing the customers wait time.  Positively reso"}, {"resume_id": "26958533", "category": "HEALTHCARE", "job_id": "3885861741", "job_title": "Locum Hospitalist Physician job in Portsmouth, NH - Make $180/hr - $200/hr", "job_text": "Locum Hospitalist Physician job in Portsmouth, NH - Make $180/hr - $200/hr. Aya Locums has an immediate opening for a 13-week locum Hospitalist Physician job in Portsmouth, NH paying $180/hr - $200/hr.\n\nJob Responsibilities\n\nAssess patients, document medical histories and address patient inquiries and concerns.Diagnose and manage injuries, illnesses and medical conditions.Conduct, analyze and interpret diagnostic tests and communicate results to patients.Keep patient records current by updating information and treatments.Develop treatment plans and recommendations.Collaborate with other healthcare professionals to coordinate patient care.Stay up to date with advances in medicine and best practices.\n\nQualifications\n\nAn active and unencumbered physician license in the state of employment (if a new license is needed for your assignment, Aya Locums can help).Board certification or eligibility for certification in a specialty relevant to the role (highly preferred).Basic Life Support (BLS) and Advanced Cardiac Life Support (ACLS) certification.\n\nSkills\n\nExperienced in diagnostic and clinical decision-making.Effectively communicates with others.Ability to work independently and in a team setting.Commitment to providing compassionate, patient-centered care.Familiarity with electronic medical record systems and technology.\n\nWorking Hours\n\n5, 12-Hour 07:00 - 19:00\n\nEducation Requirements\n\nA Bachelor of Science (BS) degree in a relevant field.A Doctor of Medicine (M.D.) or Doctor of Osteopathic Medicine (D.O.) degree.Completed residency program in your chosen specialty.Continuing medical education (CME) activities to maintain medical licenses.\n\nWith Aya Locums, You Get\n\nAccess to top hospitals and healthcare systems in diverse care settings.Highly competitive, transparent locum tenens pay.Dedicated application and assignment support.In-house credentialing and licensing teams.Travel and lodging coverage.Easy timekeeping and streamlined management of documents.Malpractice coverage and risk management support.Aya may provide other benefits where require"}, {"resume_id": "17108676", "category": "ENGINEERING", "job_id": "3899540632", "job_title": "GENERAL SURGICAL PATHOLOGIST", "job_text": "GENERAL SURGICAL PATHOLOGIST. GENERAL SURGICAL PATHOLOGISTCALL OR TEXT KATHY @ 551-795-1471\nJOB SUMMARY: The Pathologist is responsible for providing pathology services to aid in the diagnosis and treatment of human disease.\nESSENTIAL FUNCTIONS: Provide pathology services to aid in the diagnosis and treatment of human disease.Produce complete, comprehensive pathology reports, containing all necessary elements, in a timely fashion.Supervise and direct activities of the laboratory in accordance with accepted national standards and internal administrative policies.Consult with other pathologists and serve as a consultant to clinical physicians.Conduct autopsies and perform macroscopic and microscopic examination of all tissues or fluids showing evidence of pathologic conditions, as needed.Attend staff meetings and participates in call schedule as assigned/directedEngage in research projects and prepare scientific papers on the nature, cause and behavior of diseases.Investigate and study trends in the developments in pathology practice and technique; and evaluate adaptability to the needs of the laboratory.Learn and apply computer related applications and programs, including using electronic keyboards and other devices.Perform all job responsibilities in alignment with the industry's best security practices and regulatory guidelines to protect the confidentiality, integrity, and availability of protected health information and other sensitive company data.Must be familiar with and abide by the Corporate Compliance Program and all Corporate policies, including the Privacy and Security policies.\nRequirementsEDUCATION & LICENSURE: Medical Degree required.Active license to practice medicine in worked-in state required.Certification in anatomic and clinical pathology required; subspecialties also required depending upon scope of duties.National certification by the American Society of Clinical Pathology (ASCP) as Clinical Laboratory Specialist.Maintain appropriate continuing education for certification/l"}, {"resume_id": "38314236", "category": "ENGINEERING", "job_id": "3905249909", "job_title": "HR Officer - Technology", "job_text": "HR Officer - Technology. Job Summary\n\nJoin a global leader in semiconductor technology, where innovation meets excellence. Our company drives technological advancements across various industries, shaping the future of technology worldwide. With a commitment to diversity, sustainability, and fostering a culture of continuous learning and growth, we are looking for a talented HR Officer to join our dynamic team.\n\nlocation: Austin, Texas\n\njob type: Permanent\n\nsalary: $95,000 - 110,000 per year\n\nwork hours: 8am to 4pm\n\neducation: Bachelors\n\nResponsibilities\n\n Develop and implement employee engagement strategies to foster a positive work environment. Ensure compliance with all federal, state, and local employment laws. Manage employee benefits, including health insurance, 401(k) plans, and payroll processing. Address and resolve employee concerns related to benefits and compensation. Collaborate with other departments to streamline HR processes.\n\nQualifications\n\nExperience level: ExperiencedMinimum 5 years of experienceEducation: Bachelors\n\nSkills\n\nProject ManagementHRIS\n\nEqual Opportunity Employer: Race, Color, Religion, Sex, Sexual Orientation, Gender Identity, National Origin, Age, Genetic Information, Disability, Protected Veteran Status, or any other legally protected group status.\n\nAt Randstad Digital, we welcome people of all abilities and want to ensure that our hiring and interview process meets the needs of all applicants. If you require a reasonable accommodation to make your application or interview experience a great one, please contact HRsupport@randstadusa.com.\n\nPay offered to a successful candidate will be based on several factors including the candidate's education, work experience, work location, specific job duties, certifications, etc. In addition, Randstad Digital offers a comprehensive benefits package, including health, an incentive and recognition program, and 401K contribution (all benefits are based on eligibility).\n\nApplications accepted on ongoing basis until filled."}, {"resume_id": "17108676", "category": "ENGINEERING", "job_id": "3905885978", "job_title": "Sr. Mobile Application Security Engineer - 4 days onsite in Charlotte, NC. Locals only", "job_text": "Sr. Mobile Application Security Engineer - 4 days onsite in Charlotte, NC. Locals only. Job Title: Sr. Mobile Application Security Engineer\n\n Duration: 12 months Contract\n\n Location: Charlotte, NC. Locals only. 4 days onsite \n\n Required Pay Scale: $85 - $90/hr \n\nSkills:\nMinimum of 5 years in Manual Penetration testing of web and mobile applications.Strong understanding of command linesScripting experience:One or more of Python, JavaScript, PowerShell, shell script, Ruby, PHP, LUA etc.Proven work experience in manual secure code review.Experience working with GitLab Ultimate CI/CD technology, shift-left tools, and application security workflows.Understanding of cloud technologies and environments (AWS, Azure, Google).GPEN, OSCP, CISSP, GWAPT, CEH, or similar certifications.Strong communication! Need someone who mentor junior folks on team\n\nAbout Matlen Silver\n\n Experience Matters. Let your experience be driven by our experience. For more than 40 years, Matlen Silver has delivered solutions for complex talent and technology needs to Fortune 500 companies and industry leaders. Led by hard work, honesty, and a trusted team of experts, we can say that Matlen Silver technology has created a solutions experience and legacy of success that is the difference in the way the world works.\n\n \n\n Matlen Silver is an Equal Opportunity Employer and considers all applicants for all positions without regard to race, color, religion, gender, national origin, age, sexual orientation, veteran status, the presence of a non-job-related medical condition or disability, or any other legally protected status.\n\n If you are a person with a disability needing assistance with the application or at any point in the hiring process, please contact us at email and/or phone at: info@matlensilver.com // 908-393-8600"}, {"resume_id": "24083609", "category": "INFORMATION-TECHNOLOGY", "job_id": "3901372262", "job_title": "Sanitation Technician", "job_text": "Sanitation Technician. Location: USA : Wausau\n\nState: Wisconsin\n\nCountry: USA\n\nOur purpose points the way\n\nIn Novonesis, we know that solutions rooted in biology can help solve humanity\u2019s biggest challenges. Since we began more than a century ago, this has been our guide. It\u2019s how we've gotten so far. And it\u2019s how we'll impact the future. Now, more than ever, the world needs change. And with biosolutions, the possibilities for transformation are endless.\n\nWe\u2019re here to better our world with biology.\n\nJoin us as our new Sanitation Technician \n\nUnder the direction of the Sanitation Supervisor, the Sanitation Technician is responsible for the cleaning and sanitizing of the plant to ensure sanitary conditions at all times and in accordance with UAS\u2019 standard operating procedures. Cleaning duties include general custodial work, floor scrubbing and room cleaning.\n\nIn this role you'll make an impact by: \n\nCompleting our 2nd Shift team, working 2:45 pm - 12:45 am Monday through Thursday.Performing sanitation duties as required by the Master Cleaning SchedulePerforming general custodial dutiesPerforming room cleaning during product change overPerforming nightly cleaning of floors and other areas assignedStrictly adhering to and following all applicable Standard Operating Procedures Recording information as required\n\n\nTo succeed you must hold: \n\nHigh School Diploma along with 1+ year experience in a similar capacity2+ years of relevant experience in an FDA-regulated or controlled manufacturing environment, preferably dietary supplements or pharmaceuticals.Must have the ability to read, write, speak and comprehend English sufficiently to perform the essential functions of the positionAbility to lift up to 50 lbs. regularly during shiftAbility to utilize a ladder while follow all safety procedures \n\n\nCould our purpose be yours? Then apply today!\n\nApplication deadline: April 26, 2024\n\nAt Novonesis we commit to an inclusive recruitment process and equality of opportunity for all our job applicants. We "}, {"resume_id": "21866029", "category": "HEALTHCARE", "job_id": "3902746186", "job_title": "Sr. Tax Manager", "job_text": "Sr. Tax Manager. It's fun to work in a company where people truly BELIEVE in what they're doing!\n\nWe're committed to bringing passion and customer focus to the business.\n\nCorporate Overview\n\nIn today\u2019s cyber threat landscape, protection starts with people. At Proofpoint, that simple truth fuels our passion for protecting users, the data they create, and the systems they rely on from a uniquely people-centric perspective.\n\nAnd we\u2019re just as passionate about finding the right people to help us in that mission. When you join Proofpoint, you\u2019re helping to\n\nBuild and enhance our proven security platformBlend innovation and speed in a constantly evolving cloud environmentAnalyze new threats and offer deep insight through data-driven intelCollaborate with customers to help solve their toughest security challenges\n\nWe are singularly devoted to helping our customers protect their greatest assets and biggest security risk their people. That\u2019s why we\u2019re a leader in next-generation cybersecurity\u2014and why more than half of the Fortune 100 trust us as a security partner.\n\nThe Role \n\nThe Proofpoint Tax Department is responsible for the assessment and review of the Company\u2019s transactions as it relates to all forms of tax compliance as well as accounting for income taxes under US GAAP. The ideal candidate typically possesses a combination of strong technical tax knowledge, leadership skills, significant experience in tax provisions, tax compliance, and successfully managed complex tax projects.\n\nYour day-to-day \n\nManage the preparation and completion of accurate and timely quarterly and year-end income tax provisions in accordance with US GAAP.Ensure compliance with accounting principles and relevant tax regulations.Collaborate with cross-functional teams to gather necessary financial data for tax provision calculations.Provide guidance on tax provision matters and assist in decision-making processes.Support our external financial audit/income tax provision as necessary.Assist in managing US sales an"}, {"resume_id": "17812897", "category": "HR", "job_id": "3887908409", "job_title": "Sr. Web Growth Marketer", "job_text": "Sr. Web Growth Marketer. We are a team of doers, seasoned engineers, hackers and builders, working on the future of streaming data.\n\nFunded by premier investors including GV and Lightspeed, Redpanda is building the streaming data platform for developers. We\u2019re evolving streaming beyond the Apache Kafka\u00ae protocol into a unified \u201cengine of record\u201d that delivers a categorical reduction in complexity, wicked-fast performance, onboard Wasm transforms, and transparent tiered storage that gives consumers access to both real-time and historical data from a single API.\n\nAbout the Role:\n\nIn this role, we\u2019re looking for a web growth leader to own our web experiences with a focus on guiding developers and buyers to adopt Redpanda. You will own the performance, vision, and strategy for all Redpanda web properties.\n\nYou Will: \n\nWeb Experience Roadmap Lead:\n\nDefine, align, and own the multi-year web experience roadmap outlining key initiatives like a unified information experience, growth conversion capabilities, developer experience modules, and lead generation data capture integrationsConduct research and analysis of modern web UX trends, competitor websites, and internal stakeholders to inform roadmap prioritiesCommunicate and secure alignment on roadmap priorities with stakeholders including executives, product leaders, and marketing headsOwn web experience deliverables and progress across agency and in-house resources\n\nWebsite Performance Management:\n\nAlign stakeholders around business revenue and userbase goals, define and monitor meaningful web KPIs that influence those goals across traffic, conversions, engagement, and journey indicatorsProvide regular reporting across primary web performance targets while highlighting above/below target rationale\n\nMarketing Growth Alignment:\n\nLead marketing web growth meetings and discussions to ensure project priorities, ownership, and deliverables are on trackIdentify growth opportunities for the website with marketing channels including social media, email, di"}, {"resume_id": "16899268", "category": "INFORMATION-TECHNOLOGY", "job_id": "3905831504", "job_title": "Controller", "job_text": "Controller. The ideal candidate is a detail-oriented individual who will oversee the company's financial records and account personnel. You will be responsible for maintaining all procedures and controls related to the company's financial accounts.\nThis position is Hybrid in Tennessee. Must be open to relocation (with assistance) or live in Knoxville Tennessee\nResponsibilitiesMaintain compliance with government agenciesAct as the point of contact for external auditorsMaintain internal books and finances Analyze financial transactions\nQualificationsBachelor's degree in Accounting or 5 - 7 years of related experienceFluency in Microsoft Office suite (Outlook, Excel, Word, PowerPoint, etc.)GAAP knowledge, CPA preferredStrong written, verbal and collaboration skills"}, {"resume_id": "47410104", "category": "FINANCE", "job_id": "3902367472", "job_title": " AVP Underwriter ", "job_text": " AVP Underwriter . The AVP Underwriter Surety will be responsible for:Handle results-oriented underwriting by assisting Head of North America Surety in developing and monitoring a technically sound and profitable portfolioProvide a market presence to continue to build the PartnerRe brand with key clients and brokersSupport and foster a culture of agility, high performance, client centricity and solution-oriented decision makingRepresent PartnerRe at market events, client visits, underwriting file reviews and workshops, as assignedEnsure compliance with underwriting and pricing guidelines, operations and procedures.Support portfolio management and exposure/risk accumulation monitoring according to corporate guidelinesEffectively collaborate with key stakeholders within the organization including the actuarial, claims, and wording departments.Handle underwriting administrative tasks, including: Special acceptances analysis and recommendation, review of contractual documents and endorsement requests, data input, maintain data quality of portfolio, etc.Accurate and timely data entry into internal systems in conjunction with UW operatio ired skills:4+ years of digital market"}, {"resume_id": "12858898", "category": "FINANCE", "job_id": "3899522698", "job_title": "Desktop Support/ End-User Support Technician", "job_text": "Desktop Support/ End-User Support Technician. Title : Desktop Support/ End-User Support Technician Location : Carlsbad, New MexicoRate : $19/hr on W2 or $23/hr on C2CContract\nJob Description:\nBackground As a member of the End User Support team, the candidate will provide high quality support with very good customer service, technical expertise and timeliness. This position has frequent contact with end users, peers and managers primarily face to face as deskside support for service requests and on-site problem resolution. The candidate will work in a team environment with a collaborative approach to resolving customer problems and supporting other members of the Site Services department. The candidate will also provide hands and eyes support to other IT teams including but not limited to Audio Visual, Network, Server and print services. \nDescription :\nAs an End User Support Technician with Minimum of 5 years technical experience in providing quality services to the end users which includes the following key roles and responsibilities: Provide customer facing end-user support that includes Break-fix support for Laptop, desktop, tablets and associated hardware peripherals IMAC support including large scale/bulk office moves/re-stack activities (all moves) Support for Operating System, base load software, MS Office suite and other business application Support for the Imaging devices (print/scan/copy/fax) that includes printers and MFDs Access related issues with smart card, password and security, application configuration and troubleshooting, and general inquiries Support for the Mobility devices (IOS/iPhone/IPads) VIP and home-based office (HBO) user support Manage the ticket queue in remedy system and ensure they are resolved and closed within the defined service level maintenance Respond to end-user requests for updates on ticket status and promptly follow up as needed. Coordinate with vendors for provision of end-user support (e.g. Hardware Vendor technicians for warranty repair/replacement) Perform managed pr"}, {"resume_id": "31677347", "category": "ENGINEERING", "job_id": "3884990768", "job_title": "Front-End Engineer II, AWS Marketplace, Product Types", "job_text": "Front-End Engineer II, AWS Marketplace, Product Types. Description\n\nCome join the AWS Marketplace Team in our mission to change the way enterprise software is bought and sold! AWS Marketplace enables software sellers to reach all AWS customers, and it enables software buyers to easily discover, purchase and consume software. Our goals include enriching the platform to support more diverse selection, improving buyer and seller experience and implementing new capabilities to improve the products and offerings. Our vision is to make AWS Marketplace the one stop shop for buying and selling software just like Amazon.com is for retail.\n\nWe are looking for an experienced Front-End Engineers (FEE) to help the team take AWS Marketplace to the next level. As a FEE on the team you will own significant portions of the product and will have influence on our strategy by helping define the next wave of product features and system architecture. The systems are complex and there are huge opportunities to work at all levels from a set of robust platform services, to system level pieces and everything in between. You should be somebody who enjoys working on complex system software, is customer-centric, and is passionate about building quality software as well as achieving operational excellence. A commitment to teamwork, hustle, and strong communication skills (to both business and technical partners) are essential.\n\nThe ideal candidate will have a track record of success delivering new features or products. This person has thrived and succeeded in delivering high quality technology st.  Ensures employee files, both paper and electronic are up to date.  Coordinates and delivers onboarding for new hires.  Provides support and/or coordination to the HR team with key HR activities such as change-of-status (e.g. job transfers, promotion, employment confirmations  Creates, updates and maintains personnel files as applicable  Act as a liaison between managers/employees/HR Team.  Assist with various HR projects. \n\n\nWhat You\u2019ll Need To Succeed\n\n A minimum of 2 years\u2019 experience or any related corporate field and/or in Human Resources is preferred  PHR Certification or Equivalent is Preferred  Ability to use Microsoft Office software (Outlook, PowerPoint,"}, {"resume_id": "17108676", "category": "ENGINEERING", "job_id": "3905244995", "job_title": "Patient Access Call Center Specialist - Days", "job_text": "Patient Access Call Center Specialist - Days. Who We Are\n\nJPS Health Network is a $950 million, tax-supported healthcare system in North Texas. Licensed for 582 beds, the network features over 25 locations across Tarrant County, with John Peter Smith Hospital a Level I Trauma Center, Tarrant County's only psychiatric emergency center, and the largest hospital-based family medical residency program in the nation. The health network employs more than 7,200 people.\n\nAcclaim Multispecialty Group is the medical practice group featuring over 300 providers serving JPS Health Network. Specialties range from primary care to general surgery and trauma. The Acclaim Multispecialty Group formed around a common set of incentives and expectations supporting the operational, financial, and clinical performance\n\noutcomes of the network. Our goal is to provide high quality, compassionate clinical care for every patient, every time.\n\nWhy JPS?\n\nWe're More Than a Hospital. We're 7,200 Of The Most Dedicated People You Could Ever Meet. Our Goal Is To Make Sure The People Of Our Community Get The Care They Need And Deserve. As Community Stewards, We y reaching over 6.5 million readers monthly.\nWhy Work with City Lifestyle?Build your own business with substantial profit margins.Enjoy the autonomy of working for yourself while benefiting from corporate support.Make a tangible difference in your community.No prior industry experience required.One of the lowest franchise investments in the industry\nCorporate Support:Comprehensive training and sales support.Assistance with layout and ad design.Handling of publication creation, printing, and mailing.Website design and ongoing support.Access to a customized Customer Relationship Management (CRM) system and Customer Portal.\nKey Responsibilities:Cultivate robust relationships and foster a sense of community in the environment where you live, eat, and breathe.Engage with local businesses to comprehensively understand their advertising needs, challenges, and objectives.Proactively pursue and close new business through effective cold calling and in-person sales interactions.\nWe're on the hunt for individuals who not only aim for the stars but have the dedication to reach them. Comprehensive training in all aspects of publishing is part of the package, ensuring you're well-equipped to thrive. Our expectations are as high as the rewards. Ready to join the ranks of City Lifestyle's elite? Your journey starts now. Apply today!"}, {"resume_id": "38314236", "category": "ENGINEERING", "job_id": "3905872737", "job_title": "Fleet Operations Coordinator", "job_text": "Fleet Operations Coordinator. Job Description\n\nClean Harbors Benicia, CA is looking for a Fleet Operations Coordinator to join their team! The Fleet Operations Coordinator is responsible for providing functional oversight of pickups of all trucks, including supporting the utilization of fleet management.\n\nWhy work for Clean Harbors?\n\n Health and Safety is our #1 priority and we live it 3-6-5!  Competitive wages  Comprehensive health benefits coverage after 30 days of full-time employment  Group 401K with company matching component.  Opportunities for growth and development for all the stages of your career  Generous paid time off, company paid training and tuition reimbursement  Positive and safe work environments \n\nKey Responsibilities\n\n Ensuring that Health and Safety is the number one priority by complying with all safe work practices, policies, and processes and acting in a safe manner at all times;  Assist all aspects of Asset Disposal Process with a focus on;  Posting assets to Equipment One Online Auctions;  Order and collect title for assets to be sold from the US Registration team;  Timely management of assets that need to be sold out of key refurbishment locations;  Asset Scrap / wholesale projects / \u201cyard sweeps\u201d from strategic properties;  Oversee actions to properly retire each asset sold including asset sales including creation of Bills of sale, tracking payments, scanning of sales paperwork, logging of sales, fixed asset retirement.  Other tasks and duties that may come up from management. \n\nWhat does it take to work for Clean Harbors? \n\n Associate degree required: Bachelor preferred.  1+ years of fleet maintenance management experience;  Knowledge of fleet management or vehicle maintenance;  Knowledge of Microsoft Access, Excel, and Outlook;  Strong Attention to detail;  Must be excellent at multitasking;  Strong word processing typing skills. \n\n40-years of sustainability in action. At Clean Harbors, our mission is to create a safer, cleaner environment through the treatment, rec"}, {"resume_id": "33685988", "category": "FINANCE", "job_id": "3906246964", "job_title": "Salesperson", "job_text": "Salesperson. Job Description\n\nWhat is a Salesperson?\n\nEntry level sales position capable of supporting the DIY business and achieve our sales and service objectives. The role has good knowledge of store systems, basic automotive system knowledge and basic part knowledge. The role has the basic ability to source from stores, hubs, pdq, and external suppliers. The role has in-depth knowledge of the store inventory and maintenance processes. Position can be part time or full time. Fleet safety certification preferred.\n\nPrimary Responsibilities\n\nProvide excellent selling experience for DIY customer visits and phone callsAchieve personal sales goal and help store achieve its sales goalsProvide DIY services including battery installation, testing, wiper installs, etc.Maintain store product and operational standardsResponsible for inventory processes including truck put away, shoot outs, cycle counts, Back stock, etc.\n\nSecondary Responsibilities\n\nStore Cleanliness including floors, bathrooms, facing, dusting, parking lotGeneral stocking including truck stocking and back stockSafely deliver parts to customers as needed\n\nSuccess Factors\n\nBasic driving and navigation abilityAbility to use delivery board systemFriendly communicationAbility to locate and stock partsSafety knowledge and skillsOperating inventory systems and store equipmentParts and automotive system knowledge skillsOperating POS and Parts lookup systemsExpert at testing and diagnostic equipment for DIY service\n\nEssential Job Skills Necessary For Success As a Salesperson\n\nSpeak and write English (Spanish a plus); communicate effectively and build strong relationships with customers, peers and managementRead and interpret documents such as safety rules, operating and maintenance instructions, parts catalogs, and procedure manualsUse basic math accurately: add, subtract, multiply, and divide in all units of measure, using whole numbers, common fractions, and decimalsAbility to work an assortment of days, evenings, and weekends "}, {"resume_id": "28005884", "category": "ENGINEERING", "job_id": "3900947844", "job_title": "Equipment Technician", "job_text": "Equipment Technician. We Deliver the Goods:\n\nCompetitive pay and benefits on 1st day Wellness Benefits, Employee Stock Purchase Plan, 401K Employer Matching, Education Assistance, ment or tooling to accommodate requirements. Set stops, angles, and dies for defined part dimensions, and configuration. Manually feed material through fabrication operations.Perform quality checks, complete check lists, verify counts, record time per job and ensure compliance with production schedules.Stage completed parts for movement or move to subsequent operations to maintain work flow.Maintain a clean and safe work area. Take responsibility for the physical inventory of materials. Request material reorders as necessary.\n\n\nOther Duties\n\nPerform or assist with any operations, as required to maintain workflow and to meet schedules and quality requirements.Maintain work areas in a clean and orderly condition. Consistently operate in keeping with all safety rules and requirements.Participate in any variety of meetings and work groups to integrate activities, communicate issues, obtain approvals, resolve problems, and maintain specified level of knowledge pertaining to new developments, requirements, and policies.Perform other related duties as assigned.\n\n\nTools And Equipment\n\nUse computer and related syst"}, {"resume_id": "28005884", "category": "ENGINEERING", "job_id": "3901699127", "job_title": "Vice President, Business Development - Banking & Financial Services - Back Office", "job_text": "Vice President, Business Development - Banking & Financial Services - Back Office. Creating a Digitally Driven Tomorrow\n\nTeleperformance is where inspiration meets innovation and where we empower individuals to redefine the future. For over 45 years, we have revolutionized business operations, leading the way in intelligent, digital-first solutions that simplify processes and supercharge results.\n\nIn 2023, we achieved an outstanding revenue milestone of more than \u20ac10 Billion, and with the recent acquisition of Majorel, our global team has expanded to 500,000 employees across five continents while serving more than 170 countries, proficiently serving over 300 cally multiple people within the business that provide the same level of subject matter expertise. Developed communication and diplomacy skills are required in order to guide, influence and convince others, in particular colleagues in other areas and occasional external customers. Significant impact on the area through complex deliverables. Provides advice and counsel related to the technology or operations of the business. Work impacts an entire area, which eventually affects the overall performance and effectiveness of the sub-function/job family.\n\nResponsibilities:\n\nContributes to the analytics and development of Non-Trading Market Risk Management Frameworks (\"NTMR\") in Corporate Treasury including:Asset Allocation and Other Comprehensive Income (\"OCI\") analyses and strategy support for Citi's $600bn of Liquidity Investment Securities PortfolioInvolved in developing 1st line NTMR Risk Management Frameworks including methodology, governance, global policies and standards for FX, Credit Spread on the banking book, Pensions, Bank Owned Life Insurance, and Equity investmentsExposure to Citi\u2019s balance sheet and develop understanding of data and technology infrastructure supporting the NTMR reporting process including but not limited to Asset Allocation, BOLI, and FX , CSRBBPerforms other duties and functions as assignedAppropriately assess risk when business decisions are made, demonstrating particular consideration for the firm's reputation and safeguarding Citigroup, its clients and assets, by driving compliance with applicable laws, rules and regulations, adhering to Policy, applying sound ethical judgment regarding persona"}, {"resume_id": "28198029", "category": "SALES", "job_id": "3903474862", "job_title": "HRIS Analyst (Mid-Level) - Workday Recruiting Configuration", "job_text": "HRIS Analyst (Mid-Level) - Workday Recruiting Configuration. Why USAA?\n\nLet\u2019s do something that really matters.\n\nAt USAA, we have an important mission: facilitating the financial security of millions of U.S. military members and their families. Not all of our employees served in our nation\u2019s military, but we all share in the mission to give back to those who did. We\u2019re working as one to build a great experience and make a real impact for our members.\n\nWe believe in our core values of honesty, integrity, loyalty and service. They\u2019re what guides everything we do \u2013 from how we treat our members to how we treat each other. Come be a part of what makes us so special!\n\nThe Opportunity\n\nAs a dedicated HRIS Analyst (Mid-Level) for Workday Recruiting Configuration, you will serve as a point of contact or a proficient knowledge resource for HR business projects involving the development, implementation and testing of systems modifications within the Workday Recruiting Module. Responsible for researching, analyzing, configuring and testing solutions, troubleshooting, and resolving issues that impact data quality and integrity. Collaborates with management in enhancing the HR infrastructure by providing input towards HR Information Systems solutions. Assesses overall project and operational risk and develops mitigation plans.\n\nWe offer a flexible work environment that requires an individual to be in the office 4 days per week. This position can be based in one of the following locations: San Antonio, TX, Plano, TX, Phoenix, AZ, Colorado Springs, CO, Charlotte, NC, or Tampa, FL.\n\nRelocation assistance is not available for this position.\n\nWhat You'll Do\n\nLeads and facilitates moderately sophisticated HR business projects involving systems and/or business processes to acquire business goals and operational objectives with oversight from senior team members or management.Assists with assessing overall project and operational risks and participates in the development of mitigation plans.Coordinates and facilitates working teams guiding them i"}, {"resume_id": "16899268", "category": "INFORMATION-TECHNOLOGY", torage technology to carry out activities relating to security certification and accreditation  Ability to provide expert "}, {"resume_id": "38314236", "category": "ENGINEERING", "job_id": "3888035014", "job_title": "Staff Accountant", "job_text": "Staff Accountant. Hello Hire Talent Solutions is pleased to be leading this search for one of our valued clients.\nPOSITION OVERVIEW\nWe are seeking a highly skilled and versatile Accountant with experience in sales tax filing, sales contract management, prequalification processes, as well as USE, Sales Tax, and CAT (Commercial Activity Tax) compliance. The ideal candidate will be responsible for managing various aspects of accounting related to these areas, ensuring compliance with relevant regulations, and optimizing financial processes for our organization.\nCORE RESPONSIBILITIES\nSales Tax Filing and Compliance: Oversee the preparation, filing, and timely submission of sales tax returns across relevant jurisdictions. Ensure compliance with all sales tax regulations and requirements, including accurate calculation of tax owed. Use of sales tax software and tools, primarily Avalara software.Financial Analysis: Conduct financial analysis related to sale tax liabilities, contract terms, prequalification requirements, USE, Sales Tax, and CAT. Provide recommendations to management based on analysis findings.Documentation and Record-Keeping: Maintain accurate records and documentation related to sales tax filings, sales contracts, prequalification processes, USE, Sales Tax, and CAT compliance. Ensure documentation is organized and easily accessible for audits and reference purposes.Process Improvement: Identify opportunities to streamline and improve processes. Implement besT practices and automation tools to help enhance efficiency and accuracy.Sales Contract Management: Manage the review, negotiation, and administration of sales contracts. Ensure contracts comply with company policy and legal requirements. Collaborate to finalize contract terms.Prequalification Process: Coordinate the prequalification process for prospective customers or vendors. Ensure all required documentation and information are collected and submitted accurately and in a timely manner. Collaborate with other departme"}, {"resume_id": "16899268", "category": "INFORMATION-TECHNOLOGY", "job_id": "3903883186", "job_title": "Global Security Organization (GSO) Intern", "job_text": "Global Security Organization (GSO) Intern. ADP is hiring a Global Security Organization (GSO) Intern.\n\n\"ADP is hiring Global Security Interns for the Summer of 2024.\u201dAre you graduating in May 2025? Are you looking for real corporate experience at a Fortune 250 company? Do you want to make a valuable contribution to a business' success? Are you ready to join an energetic, collaborative team and experience an inclusive culture of belonging? \nIf so, then this may be just the opportunity you've been searching for. Read on and see for yourself.\n\nWhat You'll Do\n\nAs a Global Security Organization (GSO) Team Intern, you may assist with several security centric initiatives such as incident triage, incident root cause analysis, or remediation planning. Additionally, you may also receive exposure to process automation, code analysis, developing security applications, business partner relationship management, product security integrates and automate security controls and application security testing practices. You will have the opportunity to interact with security and business professionals who will guide and support you as you enhance your skills while gaining relevant experience, all while collaborating with your partner interns.\n\nWhat You\u2019ll Gain\n\nAs an Intern at ADP, you will work alongside seasoned professionals who will guide and support you to enhance your professional skills while gaining relevant experience in a business environment. Even better: you will also participate in a variety of functional and leadership activities to enhance your personal and professional capabilities. Your objective: to learn as much as possible and gain relevant business experience during your time interning with us.\n\nTo Succeed In This Role\n\nYou have completed at least 3 years of a 4-year bachelor's degree program. Self-Starter. You are high-reaching and unstoppable. You have a can't-stop-won't-stop attitude and an urge to persevere until you get it right. Insatiable Appetite to Learn. You're always learning, growing, questioning,"}, {"resume_id": "16899268", "category": "INFORMATION-TECHNOLOGY", "job_id": "3891074620", "job_title": "Azure Data Engineer", "job_text": "Azure Data Engineer. Title: Azure Data EngineerLocation: Plano, TX / Atlanta, GADuration: Long term \nJob Description:+10 years in Data Engineering and AnalyticsExpertise in data analytical skills and handling big data along with real time streaming.Graph Ontology and semantic modeling with GraphQL or SPARQL experience is desirable.Proactive, self-driven, works independently and collaborates well.Expertise in Python, Py sparkUse of data bricks is a must."}, {"resume_id": "47410104", "category": "FINANCE", "job_id": "3905308922", "job_title": "Compliance Analyst", "job_text": "Compliance Analyst. Our client, a global investment bank based in New York, NY, is seeking a Compliance Associate to assist with the Registration's department with all aspects of the FINRA licensing and registration\u2019s process. This person will be tasked with creating electronic employee folders ensuring proper documents are in place including fingerprint results, previous employer U5, signed U4, and HR background checks. Additional responsibilities include creating FINRA BD/IA user accounts, scheduling FINRA exams, fingerprints (NFA) and ordering study materials. Candidates must have extensive experience with FINRA licensing/registrations and working knowledge of FINRA Gateway.\nRequirements:Minimum of 3 years of direct experience in processing FINRA, NFA, SEC and SRO firm and agent regulatory registrations.Proficient in FINRA Gateway and NFA ORS systems.Bachelor\u2019s Degree required Strong office program knowledge, with special emphasis on Excel."}, {"resume_id": "22319662", "category": "SALES", "job_id": "3895598320", "job_title": "Branch Operations Manager - Branch 2292", "job_text": "Branch Operations Manager - Branch 2292. Job Description\n\nSummary: The WORLPAC Branch Operations Manager directs warehousing activities for organization by performing the following duties personally or through subordinates.\n\nEssential Duties And Responsibilities\n\nNinety percent of time spent directly managing Assistant Branch Operations Manager and 5 or more associates in warehouse and delivery.Carries out management responsibilities in accordance with the organization\u2019s policies and applicable laws.Responsibilities include interviewing, hiring and training associates; planning, assigning and directing work; conducting performance appraisals and recommending pay increases; recommending rewards, conducting associate counseling and disciplinary actions, addressing complaints and resolving problems when possible.Regularly prepares written memos to Regional Operations Manager and Human Resources and prepares associate counseling memos and performance appraisals.Responsible for the overall direction, coordination and evaluation of this unit.Instills and maintains a customer service oriented philosophy in all conduct of self and subordinates.Confers with customers and department heads to evaluate, promote and provide improved and expanded services in the area.Develops plans for efficient use of resources (materials, equipment and associates).Prepares annual operational budget for submission for approval.Follows operational procedures for activities such as verification of incoming and outgoing shipments, handling and disposition of materials and keeping warehouse inventory current.Makes recommendations for improvements to proced
