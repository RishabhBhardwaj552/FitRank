<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval Labeling — Resume x Job Fit</title>
<style>
  :root{
    --bg: #14151a;
    --panel: #1c1e26;
    --panel-2: #23252f;
    --border: #33353f;
    --text: #eceef2;
    --text-dim: #8b8d99;
    --accent-yes: #34d399;
    --accent-yes-dim: #1c4d3d;
    --accent-no: #fb7185;
    --accent-no-dim: #4d222a;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .app{ width:100%; max-width:760px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .title{ font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); font-family:var(--mono); }
  .counter{ font-family:var(--mono); font-size:13px; color:var(--text-dim); }
  .counter b{ color:var(--text); }

  .progress-track{ height:4px; background:var(--panel-2); border-radius:4px; overflow:hidden; margin-bottom:22px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--accent-no), var(--accent-yes)); transition:width .25s ease; }

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:0; overflow:hidden;
  }
  .cat-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--border);
  }
  .cat-badge{
    font-family:var(--mono); font-size:11px; letter-spacing:0.05em;
    background:var(--panel-2); color:var(--text-dim); padding:4px 10px; border-radius:20px;
    border:1px solid var(--border);
  }
  .pair-id{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }

  .section{ padding:16px 20px; }
  .section + .section{ border-top:1px solid var(--border); }
  .section-label{
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;
  }
  .section-body{
    font-size:14.5px; line-height:1.55; color:var(--text); white-space:pre-wrap;
    max-height:180px; overflow-y:auto; padding-right:4px;
  }
  .section-body.job{ max-height:220px; }
  .job-title{ font-weight:600; font-size:15.5px; margin-bottom:6px; color:var(--text); }
  .expand-btn{
    font-family:var(--mono); font-size:10.5px; color:var(--text-dim); background:none; border:none;
    cursor:pointer; text-decoration:underline; padding:0;
  }
  .section-body::-webkit-scrollbar{ width:6px; }
  .section-body::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  .actions{ display:flex; gap:10px; padding:16px 20px 20px; }
  .btn{
    flex:1; padding:16px; border-radius:10px; border:1px solid var(--border);
    font-family:var(--sans); font-size:15px; font-weight:600; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-no{ background:var(--accent-no-dim); color:var(--accent-no); }
  .btn-no:hover{ filter:brightness(1.15); }
  .btn-yes{ background:var(--accent-yes-dim); color:var(--accent-yes); }
  .btn-yes:hover{ filter:brightness(1.15); }
  .btn kbd{
    font-family:var(--mono); font-size:10.5px; opacity:0.65; font-weight:400;
  }

  .footer-row{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .undo-btn{
    font-family:var(--mono); font-size:12px; color:var(--text-dim); background:none;
    border:none; cursor:pointer; text-decoration:underline;
  }
  .undo-btn:disabled{ opacity:0.3; cursor:default; text-decoration:none; }
  .hint{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }

  .done-screen{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:40px 32px; text-align:center;
  }
  .done-screen h2{ margin:0 0 8px; font-size:22px; }
  .done-screen p{ color:var(--text-dim); margin:0 0 24px; font-size:14px; }
  .stat-row{ display:flex; justify-content:center; gap:28px; margin-bottom:28px; }
  .stat{ font-family:var(--mono); }
  .stat .num{ font-size:26px; font-weight:700; display:block; }
  .stat .lbl{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; }
  .stat.yes .num{ color:var(--accent-yes); }
  .stat.no .num{ color:var(--accent-no); }
  .download-btn{
    background:var(--text); color:var(--bg); border:none; padding:14px 28px;
    border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; font-family:var(--sans);
  }
  .download-btn:hover{ filter:brightness(0.92); }

  .warn{
    font-family:var(--mono); font-size:11px; color:var(--text-dim); text-align:center; margin-top:16px;
  }
</style>
</head>

 rocket on the launch pad, an advanced 13-tonne payload class, reusable rocket to launch the mega constellations of the future. Our space systems business includes our extensive line of satellites and components that have enabled more than 1,700 missions including the James Webb Space Telescope, NASA Psyche Mission, Artemis I, Mars Ingenuity helicopter, and more.\n\nJoin our pioneering team and launch your career to new heights!\n\n SPACE SYSTEMS \n\nRocket Lab\u2019s Space Systems team is responsible for every satellite and satellite component made by Rocket Lab: from complete satellites destined for missions to the Moon and Mars, to the individual components and subsystems that make up a satellite like solar panels, flight software, reaction wheels and star trackers, separation systems, radios, and more. Our Space Systems team is made up of engineers, technicians, and designers who design, create, and put together our own satellites for missions across the commercial, government, and defense sectors, or who build and assemble satellite hardware and software that supports other satellite missions.\n\nSPACECRAFT ASSEMBLY, INTEGRATION, AND TEST TECHNICIAN II\n\nBased onsite at Rocket Lab's global headquarters in Long Beach, CA the Spacecraft AIT Technician II will be trained on Rocket Lab systems and procedures in Electron Avionics Production while also supporting the space systems department to mature processes. The AIT Technician needs to be able to transverse both R&D and Manufac"}, {"resume_id": "85417107", "category": "HEALTHCARE", "job_id": "3900092950", "job_title": "Clinic RN - Swedish Urgent Care - Edmonds WA", "job_text": "Clinic RN - Swedish Urgent Care - Edmonds WA. Description\n\nWork under the direction of the Supervisor or Clinic Manager to provide basic patient care to assigned patients.\n\nProvidence caregivers are not simply valued \u2013 they\u2019re invaluable. Join our team at Swedish Health Services DBA Swedish Medical Group and thrive in our culture of patient-focused, whole-person care built on understanding, commitment, and mutual respect. Your voice matters here, because we know that to inspire and retain the best people, we must empower them.\n\nRequired Qualifications\n\nGraduate of accredited school of registered nursing.Washington Registered Nurse License upon hire.National Provider BLS - American Heart Association upon hire.One (1) year Nursing experience in a clinic, OrOne (1) year Nursing experience in acute care with completion of a residency program, OrOne (1) year Nursing Tech experience.\n\nPreferred Qualifications\n\nProvider Advanced Cardiovascular Life Support (ACLS) - American Heart Association upon hire.\n\nWhy Join Providence?\n\nOur best-in-class benefits are uniquely designed to support you and your family in staying well, growing professionally and achieving financial security. We take care of you, so you can focus on delivering our mission of improving the health and wellbeing of each patient we serve.\n\nAbout Providence\n\nAt Providence, our strength lies in Our Promise of \u201cKnow me, care for me, ease my way.\u201d Working at our family of organizations means that regardless of your role, we\u2019ll walk alongside you in your career, supporting you so you can support others. We provide best-in-class benefits and we foster an inclusive workplace where diversity is valued, and everyone is essential, heard and respected. Together, our 120,000 caregivers (all employees) serve in over 50 hospitals, over 1,000 clinics and a full range of health and social services across Alaska, California, Montana, New Mexico, Oregon, Texas and Washington. As a comprehensive health care organization, we are serving more people, advancing best practices "}, {"resume_id": "21866029", "category": "HEALTHCARE", "job_id": "3905283680", "job_title": "Lead Medical Scribe", "job_text": "Lead Medical Scribe. Description\n\nCompany: Oak Street Health\n\nTitle: Lead Clinic Informatics Specialist\n\nLocation:\n\nOak Street Health is a rapidly growing, innovative company of community-based healthcare centers delivering higher quality health and wellness care that improves outcomes, manages medical costs and provides an unmatched experience for adults on Medicare in medically underserved communities. By providing holistic, comprehensive and integrated care right in our patients' communities, we can help keep them healthy and reinvest cost savings in further care for those same communities and others. Since 2013, Oak Street Health has brought its singular approach to tens of thousands of people across the nation. With an ambitious growth trajectory, Oak Street Health is attracting and cultivating team members who embody Oak Street values and are passionate about our mission to rebuild healthcare as it should be.\n\nFor more information, visit www.oakstreethealth.com.\n\nRole Description\n\nThe Lead Clinic Informatics Specialist is a critical member of the Scribe Program. They champion the organization's mission to provide high quality patient care by leading their Clinic Scribe team. The Lead Clinic Scribe acts as an in-clinic expert on all Scribe related matters including: training, coordinating coverage and assistance with implementation of any new clinic initiatives. In addition, they will engage with the Senior Scribes to facilitate successful execution of Scribe activities in each clinic. This new addition to the Oak Street Health team will be responsible for ensuring the smooth day to day operations of these essential activities.\n\nCore Responsibilities\n\nLead a team of 4-5 Clinic ScribesOngoing training and support of Clinic ScribesIn-clinic point person for coding and workflow questionsWellness Review Visit Review assistanceCoordinate Regional Scribe coverageObserve and record patient encounters/examinationsDocument patient information, history and diagnosesAssist in medical manageme"}, {"resume_id": "16877897", "category": "HR", "job_id": "3894533187", "job_title": "DC-Assistant Distribution Supervisor", "job_text": "DC-Assistant Distribution Supervisor. The Assistant Supervisor is responsible for assisting the Supervisor in leading and supervising the department. This person must be able to maintain the stability of the department when the Supervisor isn't present.\n\n Highlights of your role \n\nIn tandem with the Supervisor, provides employees with tools, information, knowledge and support to meet production goalsPartners with Supervisor on process changes and continuous improvement projectsListens, and encourages to ensure a positive culture; creating a great place to work Supports the daily productivity by balancing labor against goalsCommunicates with and involves appropriate support departments when neededMeets and maintains quality measuresMeets and maintains safety measures (i.e. OSHA incident rate)Investigate quality concerns to determine root causePrevent quality issues from leaving the facility\n\n You're a good fit if you have (or if you can) \n\nSupervisory experience (required)Basic computer skillsAbility to multi task, remain organized, problem solve, and prioritize daily responsibilitiesAbility to effectively communicate, both verbally and writtenPossess interpersonal skills; ability to motivate, develop and coach employeesAbility to understand department goals/metrics and communicate and execute plans established to meet those goals\n\n We invite you to See Yourself at Marvin \n\nFrom people to products, Marvin is committed to creating better ways of living. When you join this family-owned and -led window and door company, you belong to a community full of opportunities.\n\nFor more than 100 years, we've been designing, building, and engineering premier products. Today, in our 16 locations across North America, we manufacture Marvin's portfolio of products, which includes Infinity Replacement Windows, TruStile Doors, and Marvin Coastline brands.\n\nBenefits\n\nTogether, we live our values and enjoy a culture that feels like home. Our better living approach to benefits supports you at work and beyond. From day one, y"}, {"resume_id": "17812897", "category": "HR", "job_id": "3901951304", "job_title": "Driver Helper", "job_text": "Driver Helper. Knoxville, TN - Amherst Road\n\nJob Title:\nDriver Helper\n\nDepartment:\nOperations\n\nCountry:\nUnited States of America\n\nState/Province:\nTennessee\n\nCity:\nKnoxville\n\nFull/Part Time:\nFull time\n\nJob Summary:\nUnder close supervision, this position is responsible for loading, delivering and unloading products using various equipment types including flatbeds, box trucks and dry vans. The incumbent will assist with securing products, ensuring paperwork completion and accuracy, communicating ETAs to customers, unloading products at job sites, stores, or customer homes, communicating with JBH management throughout the day, and cleaning the equipment at the end of the day. Incumbent must be able to work any shift to satisfy the demand for flexibility of scheduling to ensure operational success. This position has the possibility to work outdoors, in the elements, or across multiple shifts including nights and/or weekends in addition to overtime; it requires full-time attendance.\n\nJob Description:\nKey Responsibilities: \n\n Review loading tickets and specifications to select and load appropriate products onto the delivery vehicle Communicate delivery arrivals to the customer Assist driver with ensuring all paperwork is in order, accurate, and complete Unload products from delivery vehicle using appropriate equipment such as lift gate, ramp, push cart or pallet jack Interact with coworkers and customers in a professional, fast-paced environment to ensure customer needs are met while building a strong working relationship with a positive attitude Maintain cleanliness of delivery equipment and workspace Understand and promote all JBHT safety requirements including required use of personal protective equipment to ensure safety of self and co-workers; adhere to safety policies and procedures to ensure job site is safe for product installation and free from hazards and obstructions that could endanger workers or damage the delivery site May help in installing and assembling large appliances,"}, {"resume_id": "17812897", "category": "HR", "job_id": "3902880391", "job_title": "Senior Human Resources Business Partner", "job_text": "Senior Human Resources Business Partner. OVERVIEW: Axiom Space is the commercial leader in human spaceflight and on-orbit research & manufacturing services, steered by a team of experts and guided by the vision of a thriving home in space that benefits every human, everywhere. Axiom provides unprecedented access to the International Space Station today while building and operating its successor \u2013 the world\u2019s first international commercial space station \u2013 to improve life on Earth and foster possibilities beyond it. Our mission-driven team is seeking a bold and dynamic Senior HR Business Partner who is preoccupied with big questions: Where do we go from here? What are the limits of innovation and exploration? How do we continue to evolve as a species?SUMMARY:  As a Senior HR Business Partner, you will play a pivotal role in aligning human resources strategies with business objectives. Your responsibilities will revolve around fostering a positive work culture, facilitating employee engagement, and providing strategic HR support to various departments within the organization. You will collaborate closely with senior management to develop and implement HR initiatives that drive organizational growth and employee satisfaction. DUTIES & RESPONSIBILITIESas a trusted advisor and subject matter expert on all HR-related matters, offering guidance and expertise to stakeholders across the organization.closely with senior leadership to gain insights into business objectives, facilitating the development of HR strategies aligned with organizational goals.with various HR centers of excellence, including compensation, benefits, payroll, talent acquisition, communications, and learning and development, to deliver cohesive HR solutions and initiatives.with department heads to strategize on workforce planning, succession planning, and talent pipelines, emphasizing our commitment to leadership.HR metrics and trends analysis to provide actionable insights and recommendations for enhancing employee engagement, retention, and di"}, {"resume_id": "24854026", "category": "FINANCE", "job_id": "3887874075", "job_title": "2024 Construction Engineer Intern (Seattle)", "job_text": "2024 Construction Engineer Intern (Seattle). Division: Seattle Main\n\nProject Location(s): Seattle, WA 98134 USA\n\nMinimum Years Experience:\n\nTravel Involved: 0-10%\n\nJob Type: Seasonal\n\nJob Classification: Intern\n\nEducation: Degree in Progress\n\nJob Family: Construction\n\nCompensation: Intern Non-Exempt\n\nTURNER CONSTRUCTION IS HIRING 2024 SUMMER INTERNS-- CONSTRUCTION MANAGEMENT, ENGINEERING, AND EH&S STUDENTS ENCOURAGED TO APPLY!\n\nTurner Construction is the leading general builder in the United States performing work in market segments including Healthcare, Education, Sports, Residential, Biotech, and Commercial Office. In the Seattle area, we have been responsible for such iconic projects as Century Link Field, the renovation of Husky Stadium, and the historic renovation of Pike Place market. You can currently see our tower cranes dotting the Seattle and Bellevue skies. Our company has earned international recognition for undertaking complex projects, fostering innovation, embracing emerging technologies, and making a difference for our clients, employees and community. While we build buildings, our true goal is to enrich the communities where we live and work.\n\nTurner's award winning internship program strives to combine meaningful work as a part of a construction project team with opportunities to learn every facet of our business as a general contractor. Successful applicants will interface across projects, departments, and even other business units in a series of learning and social opportunities. We seek to employ thought-provoking leaders who excel in a fast-paced, challenging, and collaborative environment. We encourage eager learners who share our company's values of sustainable building and creating inclusive and diverse workplaces to apply.\n\nPosition Description: Assist in day-to-day supervised activities related to the development of a construction project to build foundational knowledge in construction management, business and project financial management, project safety protocols, subcontractor rela"}, {"resume_id": "93988900", "category": "HEALTHCARE", "job_id": "3905293818", "job_title": "Part-Time Security - We Will Train - $15-$20/HR", "job_text": "Part-Time Security - We Will Train - $15-$20/HR. Why Join Our Team?\n--> Quick Setup for Success: Citadel Security USA provides local training programs and company uniforms, setting you up for success from day one. We'll equip you with the skills and knowledge needed to excel in your role.--> Competitive Pay: Your dedication and contribution will be rewarded with a competitive wage that recognizes your commitment. Refer to the specific job posting for pay information. --> Weekly Paychecks: We understand the importance of timely payments. Rest assured; our regular payroll schedule ensures that you receive a paycheck every week. We also have the flexibility to provide daily payments, giving you the financial stability even during the unexpected personal times.--> Benefits: We value our employees and foster a supportive work environment. Full-time employees are eligible for benefits, including medical, dental, vision, life, and other supplemental benefits insurances. Enjoy the peace of mind that comes with comprehensive coverage while being part of an exciting career. --> Other Benefits: We provide a 401(k) Safe Harbor Retirement Savings Plan to all employees with a generous immediate vesting employer match.--> Time Off: Full-time employees are eligible for Paid Time Off (PT0). PTO replaces traditional vacation and allows employees the opportunity to decide how they would like to use paid time away from work.--> Referral Program: Share the joy with friends and earn extra rewards! Refer someone you know to join our team, and when they're hired, you'll receive $50.00 as a token of our appreciation.\nPAY INFORMATION$15.00 to $20.00 per hour Non-exempt position (eligible for overtime when applicable under state law) LOCATIONColumbia is often referred to the \"Athens of Missouri\" because of its classic beauty, architecture, and most notably, the columns at Mizzou. Because of the city's excellent higher education programs, excelling job growth, and low cost of business expenses, the job market and economy is booming here. Tha"}, {"resume_id": "26958533", "category": "HEALTHCARE", "job_id": "3885843769", "job_title": "RN, Registered Nurse Lead - ICU Neonatal", "job_text": "RN, Registered Nurse Lead - ICU Neonatal. Description\n\nSummary:\n\nOversees and coordinates day-to-day activities of nursing personnel in patient care units, provides direction to Clinical Staff, implements work of assigned units and coordinates activities with other patient care units and related departments.\n\nCHRISTUS Santa Rosa Hospital - New Braunfels (CSRH-NB), nestled in the heart of downtown New Braunfels, is a full-service, 94-private bed facility that continues to expand to meet the needs of New Braunfels\u2019 strong population growth. Innovative equipment and procedures are utilized, including an Outpatient Imaging Center, orthopedic and surgical services, rehabilitation, a renovated birthing center, including 24/7 neonatal coverage, emergency care, wound care/hyperbaric center, 3D mammography, and comprehensive heart care, from diagnostics to open-heart surgery.\n\nResponsibilities\n\n Organizing and overseeing patient care delivery during an assigned shift, ensuring proper staffing and smooth operations of a patient care unit. Coaching/counseling individual team members; monitoring and providing feedback on performance and addressing training needs. Documenting daily staffing, operational, and administrative records; maintaining compliance with governmental policies and procedures. Providing direction and support to nursing staff demonstrating and promoting respect for the dignity and rights of every patient; assisting with communications with patients and families Allocates team resources responsibly and equitably, delegates appropriate levels of responsibility and authority, and provides oversight and guidance. Mediates and resolves conflicts among individuals, groups, and departments.\n\nCORE COMPETENCIES\n\nStandard I: Utilizes the Nursing Process\n\n Uses critical thinking skills to assess the basic physical, psychosocial, social, cultural, Spiritual, and development needs of patient and families Communicates findings to appropriate healthcare team members Develops and uses a specific plan of care and modi"}, {"resume_id": "47470864", "category": "HR", "job_id": "3901963538", "job_title": "Human Resources Generalist", "job_text": "Human Resources Generalist. Position: Human Resources Generalist\nJob SummaryThe human resource generalist is responsible for performing HR-related duties on a professional level and works closely with senior HR management in supporting the field operations. This position carries out responsibilities in the following functional areas: onboarding, HRIS and employee file administration, compliance, employee relations, policy implementation, and employment law compliance.\nDuties and Responsibilities:Serves as the primary administrator for the human resource information system (currently UKG) including the set-up and maintenance of employee documents, appropriate settings, approvals/workflow, time off, access levels, etc. to ensure maximum functionality.Conducts or acquires background checks and employee eligibility verifications.Oversees and coordinates new employee on-boarding into the HRIS system ensuring completion of the new hire employee file including required forms and compliance documents.Performs routine tasks required to administer and execute human resource programs including but not limited to compensation, benefits, and leave; disciplinary matters; disputes and investigations; performance and talent management; productivity, recognition, and morale; occupational health and safety; and training and development.In partnership with senior HR management, responds to employee relation issues such as employee complaints, harassment allegations and civil rights complaints.Handles employee separation communication, off boarding and exit interviewing.Support the ops team in ensuring benefit information is entered into HRIS during annual open enrollment.Administers FMLA, ADA and other employee medical certifications in partnership with senior HR management.Assists in the administration and oversight of the compensation program; monitors the performance evaluation program.Partners with employees and management to communicate various human resource policies, procedures, laws, standards and other "}, {"resume_id": "85417107", "category": "HEALTHCARE", "job_id": "3885828280", "job_title": "Patient Accounts Receptionist", "job_text": "Patient Accounts Receptionist. Description \n\nFront desk at dental clinic -\n\n Verify insurance coverage; compute patient benefits and compile itemized bills. Answer patient questions regarding billing statements and insurance coverage. Telephone, write or fax insurance companies with unpaid insurance claims to obtain settlement of claim. Prepare forms outlining dental expenses for governmental, welfare and other agencies paying for specified patients. Record insurance payments and close out file when paid in full. Prepare unpaid claims for transfer to collection agencies. Compute and record totals of transactions Count money in cash drawers to insure amounts are correct and that there is adequate change Greet customers, issue receipts, refunds, credits or change due to customers and explain benefit coverage to patient. Receive payment by cash, check, credit cards or automatic debits Keep a balance sheet of amounts and numbers of transactions\n\n\n Skills \n\nClericalFront deskAdministrative supportHealthcareDental office supportReception\n\n\n Additional Skills & Qualifications \n\nMUST\n\n1 year professional office experience\n\n\nJob tenure is main disqualifier - must have 1-2 years in previous roles\n\nNICE\n\nhealth / dental experience \n\n\n Experience Level \n\nEntry Level\n\n\n About TEKsystems \n\nWe're partners in transformation. We help clients activate ideas and solutions to take advantage of a new world of opportunity. We are a team of 80,000 strong, working with over 6,000 clients, including 80% of the Fortune 500, across North America, Europe and Asia. As an industry leader in Full-Stack Technology Services, Talent Services, and real-world application, we work with progressive leaders to drive change. That's the power of true partnership. TEKsystems is an Allegis Group company.\n\nThe company is an equal opportunity employer and will consider all applications without regards to race, sex, age, color, religion, national origin, veteran status, disability, sexual orientation, gender identity, genetic information or "}, {"resume_id": "26958533", "category": "HEALTHCARE", "job_id": "3905313002", "job_title": "Registered Nurse, full-time 7a-7p, Kahn 4- Med/Surg/Renal", "job_text": "Registered Nurse, full-time 7a-7p, Kahn 4- Med/Surg/Renal. Job Description\n\nResponsible for working with other healthcare professionals to help treat patients with various injuries, illnesses or disabilities. Monitors patients, administers medications, keeps records, consults with healthcare providers, educates patients and more.\n\nPrincipal Accountabilities\n\n Maintains accurate, complete health care records and reports. Administers medications to patients and monitors them for side effects and reactions. Prescribes assistive medical devices and related treatments. Monitors, reports, and records symptoms or changes in patient conditions. Assesses, implements, plans, or evaluates patient nursing care plans by working with healthcare team members. Records patient vital signs and medical information. Performs other related duties as assigned.\n\n\nRequired\n\n Qualifications \n\n Bachelor degree in Nursing or related field. 3+ years of experience in Nursing or relevant area. Current state licensure as a Registered Nurse and BLS certification required. ACLS certification.\n\n\nPreferred\n\n Masters degree in Nursing or related field.\n\n\nAbout Us\n\nABOUT US\n\nAt Atlantic Health System, Our Promise To Our Communities Is; Anyone Who Enters One Of Our Facilities, Will Receive The Highest Quality Care Delivered At The Right Time, At The Right Place, And At The Right Cost. This Commitment Is Also Echoed In The Respect, Development And Opportunities We Give To Our More Than 20,000 Team Members. Headquartered In Morristown, New Jersey, We Are One Of The Leading Non-profit Health Care Systems In The Nation. Our Facilities And Sites Of Care Include\n\nMorristown Medical Center, Morristown, NJOverlook Medical Center, Summit, NJNewton Medical Center, Newton, NJChilton Medical Center, Pompton Plains, NJHackettstown Medical Center, Hackettstown, NJGoryeb Children's Hospital, Morristown, NJCentraState Healthcare System, Freehold, NJAtlantic Home Care and HospiceAtlantic Mobile HealthAtlantic Rehabilitation\n\n\nWe also have more than 900 community-based healthcar"}, {"resume_id": "33685988", "category": "FINANCE", "job_id": "3894874284", "job_title": "Yard Worker", "job_text": "Yard Worker. At WillScot Mobile Mini (NASDAQ WSC), our 4000+ people are at the heart of everything we do. In addition to providing industry-leading pay and benefits, we provide opportunities for development and upward mobility, while investing in the communities we serve. We are the undisputed leader in providing innovative \ufb02exible workspace and portable storage solutions, serving an incredible range of customers across all industries from 240+ locations across the United States, Canada, and Mexico.\n\nOur values are our foundation. We constantly strive to diversify our teams to ensure we have the best and brightest talent. We\u2019re deeply committed to creating an inclusive and equitable workplace where each person can contribute while being their authentic self. For more about WillScot Mobile Mini and who we are, click here. Build your future with us!\n\nAbout The Job\n\nThe primary focus of this position is to ensure the Mobile Mini Storage Units and Offices are cleaned, repaired and in working condition so they can be rented out. This role will perform a variety of generalized labor tasks.\n\nWhat You'll Be Doing\n\nWhat you'll do as one of our Yard Workers:\n\nClean, repair and ensure all Mobile Mini Storage Units and Offices are in working condition and ready to be rented. Could also repair Units on the customer site. This will include:Sweep and hose outChecking A/C if applicableReplacing tile or epoxy flooringRepairing drywall holesCleaning windows, blinds, doors, floors and wallsReplacing light bulbs, locks, blinds, door handles, etcPaintingMinor weldingMinor electricAny needed repairs for customer units in the fieldDocument work completed and verifies units either need further repairs (red tagged) or are ready to rent (green tagged)Ensure the supplies are replenished and the Yard is both organized and is free of debris and potential hazardsMay operate the forklift to load and unload containers from a variety of trucks and trailersOther duties as assigned. Regular attendance is required"}, {"resume_id": "23296286", "category": "SALES", "job_id": "3901173097", "job_title": "Administrative Specialist", "job_text": "Administrative Specialist. JOB DESCRIPTION:A Local Administrative Specialist works within the Indiana Department of Health\u2019s Mobile Response Operations Mobile Teams. This position will serve in a designated geographical area in the state of Indiana as their primary focal location. Purpose of Position/Summary:A Local Administrative Specialist works within the Indiana Department of Health\u2019s Mobile Response Operations Mobile Teams. This position will serve in a designated geographical area in the state of Indiana as their primary focal location. This position will coordinate with team members and management to assist with public health coordinated outreach and conduct of vaccine and testing locations. This position will be the primary individual on their team that works with all aspects regarding the registration of individuals in different designated websites to receive the appropriate testing or vaccines required by all ages of individuals. This position will also assist in any set up and demobilization of resources while also working with team members to track multiple resources used by the team that can differ from day to day as well as by mission type. Essential Duties/Responsibilities:This position\u2019s primary role is to be the subject matter expert on client registration for the opportunities being offered by the Mobile Response Teams. Show the ability to adapt to different community environments throughout the state of Indiana. Assist in any crowd control and flow with individuals either on foot or in a vehicle. Demonstrate the ability to handle tracking of extremely different resources used by Mobile Response team. Maintain proficiency and receive routine or assigned in-person and digital training in procedures for their position. Assist in set up, conduct and demobilization of all sites assigned to individual.Job Requirements:Demonstrate the ability to use all technical registration/computer systems used by team. Conduct self in a manner that demonstrates professional and state conduct p"}, {"resume_id": "30083943", "category": "SALES", "job_id": "3905823054", "job_title": "Sales Manager", "job_text": "Sales Manager. Position Summary: Our Sales Manager has managing partnerresponsibilities for a team of 5-25 Executive Consultants in marketing J.Galt's SaaS memberships and consulting services. In addition, the ManagingPartner/Sales Manager represents J. Galt in attracting memberships throughchannel partners, strategic alliances, chambers of commerce, and state,trade, and professional associations.\nOur Mission: We believe in helping small and medium-sized businessessucceed. It is tragic that most business owners carry the credit needs oftheir business. They often rely on personal credit cards, or they signpersonally for the business to access the funding, equipment, or facilities thebusiness requires to operate.\nWhat We Do: J. Galt Finance Suite offers a SaaS platform and consultativeservices to small and medium-sized business owners. Our system includes aproven 7-step process to build credit for a business around the business EINwithout personal guarantees or using the owner\u2019s personal credit profile.\nJ. Galt is seeking six-figure sales talent and aggressive growth-orientedexecutives with a proven track record of success. Successful candidates willpossess a(n):\n\u2022 Minimum 10 years of successful business experience in a marketing-intensive business\u2022 Uncompromising need for top-level earnings\u2022 High energy, self-disciplined, self-starter with a positive attitude\u2022 Goal-oriented with a lifelong quest for personal development and career growth\u2022 Persuasive communication skills in oral & written form\u2022 Comfortable speaking in front of groups in person or virtually\u2022 Top-notch consultative sales skills\u2022 Comfortable marketing to professionals and C-level executives\u2022 Superior time management and organization skills and a desire to work from a home-based office ance to our Engineering clients. You will work closely with leaders to align HR initiatives with business goals, implement effective talent acquisition strategies, drive employee engagement and development, and ensure compliance with employment laws and regulations.\n\nPrimary Responsibilities\n\nBuild and maintain effective relationships; serve as a trusted advisor to both business leaders and employees, fostering a strong partnership"}, {"resume_id": "17812897", "category": "HR", "job_id": "3884431645", "job_title": "Payroll/HR Associate (Pharma/Biotech/Med Devices/Healthcare) - Hybrid!!", "job_text": "Payroll/HR Associate (Pharma/Biotech/Med Devices/Healthcare) - Hybrid!!. Job Title: Payroll/HR AssociateW2 Contract & Hybrid role Work Location: Exton, PA\nOne of our leading Pharmaceutical Client is looking for a Payroll/HR Associate will support multiple payroll projects and process improvement. This individual should have payroll/human resource business knowledge, in depth ADP and/or Workday knowledge, and system conversion or upgrade experience.\nEntry level is acceptable.\nRequired Skill & Experience:\nMinimum 0-3 years of experience supporting payroll implementations or conversions for US.In depth ADP and/or Workday knowledge, and system conversion or upgrade experience.Advanced excel skills are required \nResponsibilities:Support projects and cross functional initiatives.Act as a resource for Payroll special projects within or across HR groups.Analyze and evaluate data for purposes of conversion from ADP to Workday.Escalate issues/risks pro-actively to appropriate team and members and management. Regularly communicate status and challenges to team members and management.\nIf you are a good fit then please apply quick!!"}, {"resume_id": "26958533", "category": "HEALTHCARE", "job_id": "3905313436", "job_title": "Sales Engineer", "job_text": "Sales Engineer. Airgas is Hiring for a REMOTE Application Engineer in California/Arizona/Nevada!\nAt Airgas, we RESPECT, practices and achieve high-quality, patient-centered care. The company is growing rapidly and expanding services in the Western Region U.S. They work with a talented team of dentists, hygiene professionals, business managers and administrative staff and strive to deliver an unparalleled level of service across the dental industry. \nReporting to the Director of Finance, the role as Accounting Manager will be responsible for overseeing all daily functions of the Accounting department. The position will require exceptional time management and organization skills due to the fast paced, growing nature of our business. The Accounting Manager will be expected to delegate daily tasks and be organized enough to shift focus in the event of an unexpected merger, acquisition, or start-up of a new dental practice. \nKey ResponsibilitiesGeneral Accounting & Administrative DutiesMaintain general ledger Fixed asset accounting & depreciationAccount reconciliations EOD cash & revenue reporting auditsMaintain corporate documentsCash ManagementBi-Monthly cash analysis & transfersWeekly cash balance verification for Payroll & A/PDaily cash account verification and issue resolution Month-End Close Practice revenue entries & transfers Balance sheet & bank reconciliationsMonthly adjusting entries, accruals and allocationsIntercompany calculations, allocations and tie-outs Financial Statement PreparationUpload P&L and BSs from QuickBooks to financial packagesUpdate and tie-out financial packages by entityPrepare cash flows by entityProduce combined financial statements including cash flowsPayroll SupervisionReview payroll on a bi-weekly basisBack-up payroll processor/administ"}, {"resume_id": "21866029", "category": "HEALTHCARE", "job_id": "3889718031", "job_title": "Maintenance Technician", "job_text": "Maintenance Technician. Harbor Group Management Company is a multi-billion dollar real estate investment and property management firm. As we continue to grow, we are looking for passionate, goal oriented, creative individuals with an entrepreneurial spirit and great communication skills. Harbor Group is dedicated to outstanding customer service and providing exquisite living experience for our residents.\n\nMaintenance Technician\n\nThe Purpose:\n\nIn a Maintenance Technician role, you will be responsible for maintaining efficient operation and upkeep of the property\u2019s buildings and grounds.\n\nKey Role Responsibilities:\n\nPerform general maintenance such as plumbing, electrical, HVAC repairs, carpentry, appliance repairs, glass replacement, etcMaintain efficient operation and upkeep of the property buildings and groundsPerform routine maintenance punch on vacant units prior to new resident occupancyRespond to resident service requests; enter and track requests using a work order systemKeep all amenity areas in clean and operable condition\n\nPrimary Requirements Include:\n\nPrior experience in plumbing, electrical, carpentry, dry-wall and paintingAppliance service and repair a plusHVAC certification highly preferredApartment maintenance experience idealMust be available for on-call workHVAC Certification required for role\n\nWhat We Offer:\n\nCompetitive Salaries & BonusesMedical, Dental & Vision Plans401(k) Plan With Employer Matching ContributionsPaid Personal Time & HolidaysFlexible Spending AccountsFree Long-Term DisabilityFree Life InsuranceShort Term DisabilityHealth Savings Account with Employer ContributionsWellness PerksFinFit Health Finance ProgramEmployee Apartment DiscountEmployee Referral ProgramEmployee Recognition & AwardsEmployee Assistance ProgramVolunteer & Community Service OpportunitiesTuition Reimbursement\n\nVeteran Friendly\n\nThis pre-employment application will be given every consideration, but its receipt does not imply that the applicant will be employed. Each question should be ans"}, {"resume_id": "17812897", "category": "HR", "job_id": "3889486955", "job_title": "Automotive Technician", "job_text": "Automotive Technician. MobilityWorks is actively seeking Mechanics and Technicians of different expertise levels to join our team urgently. We welcome candidates from diverse backgrounds, not limited to the mobility sector. Proficiency in diagnostics is essential, and knowledge of 12-volt systems is a valuable asset. While OEM and ASE certifications are advantageous, they are not mandatory.\n\nAt MobilityWorks, our primary mission is to serve the disabled community by providing accessible minivans, full-size vans with lifts, and commercial fleet vehicles. We are committed to empowering wheelchair users with the mobility, independence, and freedom they deserve. If you are passionate about making a positive impact, please continue reading to learn how you can contribute to our team.\n\nWe offer a remarkable work-life balance with regular business hours, allowing you to spend quality time with your family or pursue your interests outside of work. Every team member is highly valued, and we deeply appreciate the skills, efforts, and contributions of each individual. Our core values drive us to fulfill our mission and create a positive impact on our customers' lives.\n\nIn the role of Automotive Technician at MobilityWorks, your responsibilities will encompass a wide range of highly skilled mechanical work, including the maintenance and repair of automotive and related equipment. Your tasks will include diagnosing complex maintenance issues, conducting vehicle inspections, performing road tests, and operating specialized equipment commonly used in the automotive repair industry.\n\nHere's what you'll be able to achieve in this position:\n\n Perform diagnostics and testing Install and connect various electrical wiring systems Conduct functional tests on electrical systems Identify and rectify any issues discovered Install electrical panels and miscellaneous components in accordance with engineering specifications Ensure work quality through thorough inspections Interpret and understand schematics Assess v"}, {"resume_id": "28005884", "category": "ENGINEERING", "job_id": "3903842408", "job_title": "HR Project Manager", "job_text": "HR Project Manager. Our Customer\u2019s mission is to create groundbreaking sport innovations, by making their products more sustainable, building a creative and diverse global team, and making a positive impact in communities where we live and work. Their purpose is to bring inspiration and innovation to unite the world through sport to create a healthy planet, active communities, and an equal playing field for all.\n\nWe are seeking an HR Project Manager on a contract basis to support our customer's ongoing business needs. This role is a hybrid setup with 3 days remote and 2 days onsite in Boston, MA.\n\nWhat You'll Do\n\nProvide HR project management for an operating model transformation, including employee events, new team formation, and engagement with leaders Provide project management and HR business partner staff support to optimize operating model transformation Develop and maintain project documentation, including project plans, status reports, issue logs, and change control documentation. Develop materials to support change management, learning & development, teaming, and onboarding Manage project risks and issues, and develop mitigation strategies to ensure project success. Conduct regular meetings with project teams to provide updates on project status, discuss challenges, and make recommendations for improvement. Manage stakeholder expectations and provides guidance and advice throughout project duration. Foster and maintains good relationships with HR colleagues to ensure that processes are maintained and supported following project completion. Other related duties as assigned \n\nSkill/Experience required:\n\n5+ years of experience in HR Project Management Experience with SmartSheet, or similar tools Experience creating HR training programs Experience creating HR communications for enterprise organizations Experience managing complex employee events Ability to work with senior leaders Ability to work with highly confidential information SHRM-CP and PMP certifications are nice to have "}, {"resume_id": "47470864", "category": "HR", "job_id": "3884444742", "job_title": "Electrical Foreman - Special Projects", "job_text": "Electrical Foreman - Special Projects. Brief Description\n\nAre you looking to continue developing your electrical contracting leadership expertise?Are you hungry for access to challenging verticals like bioscience, medical, data centers, industrial, and more?Do you want to work for a place consistently voted into the \u201cTop Places to Work\u201d, where we actually live our values?Are you looking for a company with growth opportunities that focus on development and career pathing?\n\nIf you answered \"YES\" to those questions, then an Electrical Foreman - Special Projects role at Weifield Group Contracting may be perfect for you!\n\nWhat You Will Do\n\nWhile continuing to hone your craft, you will\n\nProvide leadership, organization, and field management of service/special projects teams ranging from 5-25 journeymen and apprentices on a wide variety of electrical construction projects ranging from $250K-$5MStart and manage projects including Controlled Take-Offs, material and labor budgets, correct phasing, time reporting, daily logs, and scheduled meetingsContinuously train and develop your teams to ensure employee retention and company effectiveness and efficiencyManage daily production, safe installation methods, quality control, and high morale of your journeyman and apprenticesStrengthen existing client, vendor, and team relationships, and build new onesDemonstrate and embrace our company values, our PACT: People, Advance Process, Community, and Trusting Relationships\n\nWhat You Will Bring\n\nIn addition to holding yourself to the highest standards and having a passion for being the best, you will\n\nHave a minimum of 6 years\u2019 electrical experience, and 2-4 years managing high dollar commercial or industrial electrical projects and large teamsPossess a growth-focused mindset and a passion for teaching and developing your teamsPossess a current Texas State electrical journeyman licenseBe willing to get LEED and NICET Leve 2 certifications with commensurate compensation increasesBe willing to travel with incentives\n\nWhat Weif"}, {"resume_id": "24854026", "category": "FINANCE", "job_id": "3902359821", "job_title": "Financial Planning Analyst Advisor", "job_text": "Financial Planning Analyst Advisor. Job Title: FP&A Advisor\nEmployment Type: Contact\nLocation: Houston, TX 77056 - Hybrid\nPlanning:Coordinate the preparation of annual budgets, re-forecasts, and medium-term business plansCollaborate with the Partnership Management team to prepare and present partnership financial and operational forecasts to external partnersEnsure reporting accuracy by partnering with accounting and IT. This includes but is not limited to data mapping and creating new reporting structures\nAnalysis:Engage across the organization to maintain a high level of business understanding to develop, validate, and communicate best estimates and early warningsRespond quickly and accurately to ad hoc analysis requests from senior ManagementCoordinate financial forecast and analysis deliverables managing delivery against multiple deadlines\nMonth-End Reporting:Ensure monthly closing quality by validating the monthly financial. Compare those results to the budget and most recent best estimate and analyze the reasonableness of results based on key performance indicators and market dynamicsMonitor and validate key financial indicators, including operating margin, OPEX, Capex, net debt, capital employed, and other metrics that communicates to its investor communityReforecast the income statement and cash flows based business activities and with the support of operational colleaguesCollaborate with the Partnership Management team to prepare periodic partnership financial reports that are comparable to the financial forecasts noted above\nFinancial Results Analysis:Analyze monthly income statement variances versus budget, the most recent reforecast, and prior year, providing analytical commentaries and recommending corrective actionsProvide operating margin variance analysis via a deep understanding of the drivers of the income statement, including energy volumes, energy prices, hedging activities, and inventory costs consumed.Provide cash flow analysis focused on milestones and balance sheet structures d"}, {"resume_id": "29149998", "category": "HR", "job_id": "3906093642", "job_title": "Chief Compliance Officer", "job_text": "Chief Compliance Officer. For more than 100 years, the Kansas City Board of Public Utilities (BPU) has provided safe, dependable water and electric services across Wyandotte County. As a non-profit public utility, we are fully committed to serving our customers and the community as a whole. It\u2019s more than simply providing a service. It\u2019s a commitment to a better quality of life. That\u2019s why BPU has been recognized as one of the top public utilities in the country. That\u2019s the Power of Community.The BPU offers very competitive pay and one of the best benefits packages in greater Kansas City! Come join the Power of Our Community!\nDuties and Responsibilities\nDirect and manage corporate environmental programs, establishing and upholding standards to ensure strict compliance with legal and permit requirements. Develop and implement associated procedures, work instructions, and tools essential for effective implementation. *Direct facility environmental programs, ensuring adherence to pertinent regulations. Offer guidance on best practices for environmental monitoring, reporting, and record keeping, encompassing, the development of protocols for air quality, environmental testing, waste sampling, and water monitoring. Collaborate closely with the operations team, including utility management and environmental personnel, to ensure seamless execution of environmental compliance programs cross all facilities. Direct the development of comprehensive environmental training content to meet permit and regulatory-required environmental training requirements. *Develop and implement a Bulk Electric System compliance program, aligning with mandatory NERC Reliability Standards and Requirements. Develop and implement policies to address additional directives from FERC, NERC, the RE, or other regulatory bodies. Direct the preparation and execution of internal and external regulatory audits, coordinating with NERC or the Regional Entity. Engage in direct negotiations with regulatory authorities concerning complian"}, {"resume_id": "10553553", "category": "INFORMATION-TECHNOLOGY", "job_id": "3905841768", "job_title": "Field Technician, Locator - Greenville, SC", "job_text": "Field Technician, Locator - Greenville, SC. Since 1933,  Heath Consultants Incorporated  has been the leading provider of services and equipment to the natural gas and utility industry.\n\nHeath Consultant\u2019s number one goal is to protect life and property! Our clients are underground utility companies across the country and responsible for detecting and properly marking underground utilities.\n\nHealth Consultant Inc. is actively hiring Utility Locator Technicians \u2013 Damage Prevention Specialist who are service-minded team players. If serving your community, protecting the environment, and working in a stable industry with plenty of room for growth sounds appealing, then we want to talk to you. Let us help you become the Leader you were born to be!\n\n BECOME A DAMAGE PREVENTION Technician!!! \n\nResponsibilitites\n\n No Experience Required, PAID Training. \n\nUtility Locator positions require continuous walking and working outdoors in varying weather elements. Along with walking, technicians will bend, kneel, and stand frequently throughout the day. Equipment can range in weight from 2-15 pounds, the ability to read (or learn to read) and understand utility maps may be required to complete daily tasks.\n\nQualifications\n\nAt a minimum, applicants must meet these requirements:\n\n Must be reliable and punchual for scheduled assignements  Must be able to lift up to 15lbs  Possess a valid driver\u2019s license with clean driving record  Pass pre-employment background and drug screening  Have a High School Diploma or GED \n\nSchedule\n\nCome work in a self-managed work environment where you\u2019re not just another number, you are actually valued as a team member. Without our dependable employees, where would we be? Here at Heath, we make it a point to value our team members and show our appreciation!\n\n Full-time/Day-time positions.  Some overtime may be required as well as on-call shifts occasionally and some Holidays.  Remote mobile office, equipment provided . \n\nBenefits\n\n The reason to choose HEATH CONSULTANTS: \n\n 100% paid training \u2013 Come"}, {"resume_id": "38314236", "category": "ENGINEERING", "job_id": "3904093392", "job_title": "Civil Engineer", "job_text": "Civil Engineer. Founded in 2007, Markon is a nationally recognized consulting firm headquartered in Falls Church, Virginia. With employees in seven states and overseas, we support the intelligence community, defense and civilian sectors, as well as commercial clients. Markon is committed to advancing clients through project management and business improvement services offered in a premiere, highly personal environment.\nJoin our winning team! We empower our employees to make decisions and encourage them to take on leadership roles. New ideas from employees are also encouraged. Markon is a place where you can truly demonstrate your capabilities to your full potential. We are consistently named a Washington Post Top Workplace and Best Place to Work in Virginia because we put our employees first. Markon offers an exceptional benefits package that ranks in the top tier of our industry.Markon is an Equal Opportunity/Affirmative Action Employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, pregnancy, sexual orientation, gender identity, national origin, age, protected veteran status, or disability status.\nDescription:Markon is seeking an experienced civil engineer with expertise in the construction industry to provide Owner's Representative construction management services to a DoD client.\nResponsibilities:Candidate\u2019s primary role will be to support the engineering and design efforts related to pre-construction. Candidate\u2019s secondary role will be to support project managers who manage awarded construction projects.Support Government acquisition efforts for both A/E services and Construction projects by coordinating efforts across Government working groups.Provide Subject Matter Expertise, especially with managing and overseeing studies and designs for new construction, renovations and improvements to real property facilities.Provide engineering support and analysis to the Government in their management of awarded study an"}, {"resume_id": "20237244", "category": "INFORMATION-TECHNOLOGY", "job_id": "3901669333", "job_title": "Sales & Use Tax Accountant", "job_text": "Sales & Use Tax Accountant. The Team You Will Be Joining\n\nPublicly traded company and global leader in the entertainment industry for theme parks More than 150 years of growth and expansion with now over 28 million guests Innovative partnerships with well-known brands and strong impact on the community Word class talent of collective amusement park experience delivering results and dedication to commitment and loyalty \n\nWHAT THEY OFFER YOU:\n\nFree seasonal admission and food and merchandise discounts at theme parks across North America Well-structured training and opportunities to learn new things in a fun and exciting industry An organization that invests in their employees, partners with the community, and respects the environment Values their employees with a focus on perks and giving back \n\nWHAT YOU WILL BE DOING:\n\nLead and support the accounting team at our Sandusky office, working closely with the AP Director and Accounting Supervisor. Serve as a seasoned resource within the sales tax space, ideally with experience handling multiple states. Act as an advocate for the Accounts Payable (AP) team, driving initiatives to optimize processes and save costs. Maintain a balance of sociability and professionalism, fostering effective collaboration while ensuring productivity within a fully in-office environment. \n\nREQUIREMENTS:\n\nBachelor's degree in Accounting or related field preferred. 5-7 years of experience in non-leadership accounting roles, with a strong focus on AP functions. Experience with multi-state Sales Tax Proficiency in Excel; experience with in-house accounting systems preferred."}, {"resume_id": "47410104", "category": "FINANCE", "job_id": "3904502420", "job_title": "Quality Assurance Test Engineer", "job_text": "Quality Assurance Test Engineer. Public Trust or Active Security Clearance Required2 days on site and 3 days remote a week in Falls Church, VA or Joint Base Lewis-McChord in Tacoma, WADefense Health Agency (DHA)\n\nDuties and Responsibilities:Designs, implements, and maintain automated testing processes with the other members of the automation team using Java, TestNG, Selenium and Appium.Analyzes existing QA practices and makes recommendations and strategies for improvement as well execute testing.Maintains and executes manual smoke and regression scripts to ensure that new code, functionality, or new releases have not introduced errors to existing functionality.Documents and tracks all test results in accordance with defined processes.Investigates problems and develops disposition and corrective actions for recurring discrepancies.Recommends corrective actions, dispositions, process optimization and modifications.Interfaces with stakeholders to ensure requirements are met.Develops tech work documents for the controlled work package.\nMinimum Qualifications: (To perform this job successfully, an individual must be able to perform each essential duty satisfactorily.)Bachelor's degree in a relevant field (preferred).3 years of relevant experience.Experience in DoD Healthcare IT (preferred).\nKnowledge, Skills and Abilities:Public Trust Clearance.Experience in software testing, including experience in the Agile/Scrum development lifecycle.Strong knowledge of software testing techniques & technologies including Smoke/unit/regression, Integration Testing, Test Driven Development (TDD), Automated testingBasic Knowledge of Automation testingMid-Level understanding of coding technologies: HTML, CSS and javaExperience with Selenium or another automated test suite is preferred.Ability to write and execute acceptance tests and test cases.Ability to write and execute automated test scripts to support an automation script libraryAndroid and iOS apps testing experience highly desiredStrong understanding of mobile an"}, {"resume_id": "22319662", "category": "SALES", "job_id": "3905305117", "job_title": "Registered Nurse", "job_text": "Registered Nurse. Company Description Vascular Solutions of North Carolina is an outpatient office based lab performs lower extremity angiography based interventional PAD and embolization procedures. No weekends, no weeknights.\n Role Description This is a full-time on-site role located in Cary, NC for a Registered Nurse. As a Registered Nurse, you will be responsible for providing direct patient care that includes pre ans post op care, adminstering conscious sedation , assessing patient conditions, administering medications, monitoring vital signs, and collaborating with the healthcare team to develop and implement care plans. This role requires strong communication skills, attention to detail, and the ability to work in a fast-paced environment.\n Qualifications Valid and active RN licenseGraduate of an accredited nursing programExperience in a clinical settingStrong knowledge of medical terminology and proceduresExcellent communication and interpersonal skillsAbility to multitask and prioritize patient careAttention to detail and ability to follow protocols and proceduresBasic computer skills and knowledge of electronic health recordsAbility to work collaboratively in a healthcare teamStrong problem-solving and critical-thinking skills"}, {"resume_id": "16877897", "category": "HR", "job_id": "3905334013", "job_title": "Sales Coordinator", "job_text": "Sales Coordinator. ABOUT CITYWALK BHAM:The recent completion of Birmingham\u2019s I-59/20 Central Business District (CBD) Interstate bridges brings about a renewed focus on the space underneath the bridges known as City Walk BHAM. The goal of City Walk BHAM is to provide a space to assist in reconnecting Birmingham and create a destination and common area open to all citizens. City Walk BHAM spans 10 city blocks, from 15th St N to 25th St N \u2013 almost a mile in length. The entire area encompasses 31 acres, which will provide a space to assist in connecting Birmingham. For more information visit www.bjcc.org Summary/Objective \n Under the supervision and guidance of the Director of Public Relations and Community Partnerships, the Sales Coordinator is responsible for receiving City Walk use inquiries, reviewing, tracking, issuing, and receiving license agreements and insurance certificates, entering Concentrics City Walk BHAM use opportunities, working with prospective users on fees, license agreement terms and other parameters in keeping with City Walk BHAM standards. This position will serve to assist with completing additional requests, special projects, or tasks as assigned by the director to fulfill the department\u2019s goals and objectives, including acting on behalf of or in support of the department head as required. This role will provide integral support to both the sales and the administrative functions of City Walk BHAM associated with receiving, reviewing, tracking, and executing licensed use of City Walk BHAM while also providing support to the Director.  Essential Duties/Responsibilities Demonstrates understanding and full performance ability in each of the following:With Director oversight, responsible for scheduling licensed use of CityWalk BHAM.Maintains an efficient workflow to receive and process interest in the utilization CityWalk BHAM beginning with information provided on the website and web-to-lead form optimization through communication of calendar availability, usage fee "}, {"resume_id": "23296286", "category": "SALES", "job_id": "3899544157", "job_title": "Vice President Human Resources", "job_text": "Vice President Human Resources. Scion Executive Search (SES) has been retained to conduct a search for a new VP of Human Resources on behalf of our exceptional client, Community Action Marin! They are looking for a passionate individual who is eager and energized to make a difference in the lives of children, families, and communities by serving a key role in advancing workplace culture and supporting the agency\u2019s commitment to racial and economic justice. This thrilling opportunity is full-time, located in Marin County, California, and operates on a flexible hybrid schedule. The VP of Human resources will be expected to collaborate onsite with team members and staff.\nABOUT COMMUNITY ACTION MARIN:Community Action Marin (CAM)\u2019s mission is to promote members of Marin County to achieve well-being by providing them with the education, mental health, and vital services they need. CAM works to actively break down the barriers that impede access and ability for individuals to support themselves and each other.\nMarin County is considered by many to be one of the most beautiful places to live in the United States. While it has some of the highest incomes per capita and one of the lowest unemployment rates, it also holds claim to the widest income gap and one of the greatest racial inequities in the State of California. The cost of living in Marin has risen 48% in just the past four years, and families are struggling to make ends meet. Right now, a family of four with two adults, one infant, and one preschooler would need to earn $149,545 annually\u2014an amount 82% greater than the federal poverty level of $26,500\u2014to cover all the family\u2019s basic expenses, such as housing, food, childcare, health care, transportation, and taxes without public or private assistance.\nWhen community members need help, CAM\u2019s duty is to meet them where they are, put them first, listen to their needs, and give them more than just the tools to meet the basic requirements for survival. CAM\u2019s bilingual and bicultural staff ensures that p"}, {"resume_id": "30083943", "category": "SALES", "job_id": "3895807323", "job_title": "Cert Respiratory Therapist - PRN", "job_text": "Cert Respiratory Therapist - PRN. We\u2019re a Little Different\n\nOur mission is clear. We bring to life a healing ministry through our compassionate care and exceptional service.\n\nAt Mercy, we believe in careers that match the unique gifts of unique individuals \u2013 careers that not only make the most of your skills and talents, but also your heart. Join us and discover why Modern Healthcare Magazine named us in its \u201cTop 100 Places to Work.\u201d\n\nOverview\n\nPerforms direct patient care in all aspects of respiratory care, according to physician's orders. Consults physicians on effectiveness of therapy. Acts as an advanced resource person for physicians and nursing on respiratory care. Performs duties as assigned.\n\nQualifications\n\nEducation: Graduate of CoArc approved Respiratory Care program.\n\nLicensure: Meets state licensure requirements and has a current Respiratory Care Practitioner (RCP) license.\n\nExperience: None.\n\nCertifications: Hold the Registered Respiratory Therapist (RRT) credential awarded by the National Board for Respiratory Care (NBRC). For co-workers who work in the Emergency Room PALS is required.\n\nOther: Physical demands are attached plus push, pull, and grip up to 50 lbs. Plus, pinch up to 10 lbs., kneel, crouch, and crawl minimally.\n\nEquipment Used: All appropriate respiratory care devices.\n\nPreferred Education: Acute Cardiac Life Support (ACLS)\n\nPreferred Experience: Prefer critical care experience.\n\nWe Offer Great Benefits\n\nDay-one comprehensive health, vision and dental coverage, PTO, tuition reimbursement and employer-matched retirement funds are just a few of the great benefits offered to eligible co-workers, including those working 32 hours or more per pay period!\n\nWe\u2019re bringing to life a healing ministry through compassionate care.\n\nAt Mercy, our supportive community will be behind you every step of your day, especially the tough ones. You will have opportunities to pioneer new models of care and transform the health care experience through advanced technology and innovative procedures"}, {"resume_id": "47410104", "category": "FINANCE", "job_id": "3903822963", "job_title": "Datawarehouse / ETL Developer", "job_text": "Datawarehouse / ETL Developer. Position: Datawarehouse / ETL DeveloperLocation: Downtown Chicago, IL (Hybrid - 3 days a week)Duration: 12 Months ContractRate: $60/HR-W2\nBackground in Finance would be great \nJob Description:Looking for someone strong in SQL, Datawarehouse, ETL, and be local to Chicago.Data warehouse concepts \u2013 Hands on experience working in a Datawarehouse environmentComplex SQL - analyzing data sets & etc., data flow diagrams, ETL (python framework - ETL ingested).Experience would be an excellent bonus!"}, {"resume_id": "85417107", "category": "HEALTHCARE", "job_id": "3901939052", "job_title": "Title Processing Clerk", "job_text": "Title Processing Clerk. Ride North is looking for a highly organized Title Clerk/Professional Administrator
